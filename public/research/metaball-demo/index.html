<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Metaball Stream Demo</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        background: #0e1116;
        color: #e4f0ff;
      }
      /* Make the canvas actually occupy the viewport */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .overlay {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 8px 12px;
        background: rgba(8, 10, 14, 0.72);
        border: 1px solid rgba(102, 196, 255, 0.35);
        border-radius: 6px;
        font-size: 14px;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="overlay">
      Metaball playground · WASD/drag to orbit<br />
      Stage 1: basic scene scaffolding
    </div>
    <canvas id="demo-canvas"></canvas>
    <script type="module" src="./metaballDemo.js"></script>
  </body>
</html>
