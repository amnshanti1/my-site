<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mountain Light Lab</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-top: #08111e;
      --bg-mid: #102036;
      --bg-bottom: #060a12;
      --panel-bg: rgba(8, 12, 18, 0.62);
      --panel-border: rgba(175, 213, 255, 0.2);
      --text: #ecf4ff;
      --muted: rgba(236, 244, 255, 0.72);
      --accent: #91caff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 24%, rgba(149, 183, 255, 0.22), transparent 34%),
        radial-gradient(circle at 50% 72%, rgba(22, 30, 44, 0.8), transparent 52%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 48%, var(--bg-bottom) 100%);
      color: var(--text);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          125deg,
          rgba(255, 255, 255, 0.025) 0 1px,
          transparent 1px 8px
        );
      opacity: 0.18;
      pointer-events: none;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 10;
      width: min(360px, calc(100vw - 36px));
      padding: 18px 18px 14px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(16, 22, 34, 0.72), rgba(6, 10, 16, 0.5));
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", serif;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 600;
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .lede {
      margin: 10px 0 0;
      max-width: 28ch;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .meta {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(236, 244, 255, 0.8);
      font-size: 12px;
      line-height: 1.55;
    }

    .meta strong {
      color: var(--text);
      font-weight: 600;
    }

    .hint {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 10;
      padding: 10px 12px;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      background: rgba(7, 11, 16, 0.46);
      color: rgba(236, 244, 255, 0.78);
      font-size: 12px;
      backdrop-filter: blur(12px);
      pointer-events: none;
    }

    @media (max-width: 700px) {
      .hud {
        padding: 16px 16px 13px;
        border-radius: 16px;
      }

      .hint {
        max-width: calc(100vw - 36px);
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="demo-canvas"></canvas>
    <div class="hud">
      <p class="eyebrow">Research Scene</p>
      <h1>Mountain Light Lab</h1>
      <p class="lede">A clean 3D playground for prototyping mountain-card light placement, mask alignment, and future settlement-light techniques.</p>
      <div id="status" class="meta">Loading scene…</div>
    </div>
    <div class="hint">Orbit: drag. Pan: right-drag. Zoom: scroll. Use the control rail for stack and mask experiments.</div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.156.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
