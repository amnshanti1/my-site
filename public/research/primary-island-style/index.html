<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Primary Island Style Demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        background: #1b1427;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .overlay {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 20;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        background: rgba(10, 9, 15, 0.48);
        color: #f7e8c9;
        font: 13px/1.3 system-ui, sans-serif;
        padding: 8px 10px;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.156.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="overlay">Primary Island import-only demo</div>
    <canvas id="demo-canvas"></canvas>
    <script type="module" src="./main.js"></script>
  </body>
</html>
