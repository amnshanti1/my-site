<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toon Demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #22386f;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .overlay {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(8, 10, 18, 0.4);
        color: #f4f6fb;
        font: 13px/1.2 sans-serif;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="overlay">MeshToonMaterial + OutlineEffect demo: primitives + texturedGlobe.glb</div>
    <canvas id="demo-canvas"></canvas>
    <script type="module" src="./toonDemo.js"></script>
  </body>
</html>
