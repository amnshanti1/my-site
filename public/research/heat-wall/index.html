<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Heat Wall Research Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0f18;
      color: #e5efff;
      font-family: "Inter", system-ui, sans-serif;
    }
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(10, 18, 30, 0.85);
      border: 1px solid rgba(120, 180, 255, 0.35);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.5;
      max-width: 320px;
    }
    .hud strong {
      color: #9fd2ff;
      font-weight: 600;
    }
    .hud button {
      margin-top: 8px;
      background: #1c2a42;
      color: #d5e7ff;
      border: 1px solid rgba(120, 180, 255, 0.35);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="heat-canvas"></canvas>
    <div class="hud">
      <div><strong>Heat Wall</strong> research demo</div>
      <div>Orbit: drag / scroll / right-drag</div>
      <div id="heat-meta"></div>
      <button id="regen">Regenerate</button>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.156.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
