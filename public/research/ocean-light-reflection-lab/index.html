<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ocean Light Reflection Lab</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05080d;
      --panel-bg: rgba(7, 11, 18, 0.62);
      --panel-border: rgba(180, 220, 255, 0.16);
      --text: #eef6ff;
      --muted: rgba(238, 246, 255, 0.72);
      --accent: #8fd2ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, rgba(64, 108, 180, 0.22), transparent 32%), var(--bg);
      color: var(--text);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }

    #app, canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hud {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 10;
      width: min(360px, calc(100vw - 36px));
      padding: 18px 18px 14px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(14, 20, 32, 0.78), rgba(6, 10, 16, 0.5));
      backdrop-filter: blur(14px);
      pointer-events: none;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.24);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", serif;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 600;
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .lede {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      max-width: 28ch;
    }

    .meta {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(238, 246, 255, 0.82);
      font-size: 12px;
      line-height: 1.55;
    }

    .hint {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 10;
      padding: 10px 12px;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      background: rgba(7, 11, 16, 0.46);
      color: rgba(238, 246, 255, 0.78);
      font-size: 12px;
      backdrop-filter: blur(12px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="demo-canvas"></canvas>
    <div class="hud">
      <p class="eyebrow">Research Scene</p>
      <h1>Ocean Light Reflection Lab</h1>
      <p class="lede">A near-direct port of the three.js ocean shader example for studying reflective water, sun response, and cinematic bloom.</p>
      <div id="status" class="meta">Loading ocean scene…</div>
    </div>
    <div class="hint">Orbit: drag. Pan: right-drag. Zoom: scroll. Use the control rail to tune sky, water, and bloom.</div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
