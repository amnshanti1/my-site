    function createToonGradientMap(THREE, stepCount = 4) {
      const steps = Math.max(2, Math.min(8, Math.floor(stepCount)));
      const data = new Uint8Array(steps);
      for (let i = 0; i < steps; i += 1) {
        data[i] = Math.round((i / (steps - 1)) * 255);
      }
      const gradientMap = new THREE.DataTexture(data, steps, 1, THREE.RedFormat);
      gradientMap.minFilter = THREE.NearestFilter;
      gradientMap.magFilter = THREE.NearestFilter;
      gradientMap.generateMipmaps = false;
      gradientMap.needsUpdate = true;
      return gradientMap;
    }

    const primaryIslandTextureColorCache = new WeakMap();

    function sampleTextureAverageColor(THREE, texture) {
      if (!texture || !texture.image) return null;
      if (primaryIslandTextureColorCache.has(texture)) {
        return primaryIslandTextureColorCache.get(texture).clone();
      }

      const image = texture.image;
      const width = Math.max(1, Math.min(32, image.width || 0));
      const height = Math.max(1, Math.min(32, image.height || 0));
      if (!width || !height) return null;

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      if (!ctx) return null;

      let color = null;
      try {
        ctx.drawImage(image, 0, 0, width, height);
        const data = ctx.getImageData(0, 0, width, height).data;
        let r = 0;
        let g = 0;
        let b = 0;
        let count = 0;
        for (let i = 0; i < data.length; i += 4) {
          const a = data[i + 3];
          if (a < 8) continue;
          r += data[i];
          g += data[i + 1];
          b += data[i + 2];
          count += 1;
        }
        if (count > 0) {
          color = new THREE.Color().setRGB(
            r / (count * 255),
            g / (count * 255),
            b / (count * 255),
            THREE.SRGBColorSpace
          );
        }
      } catch {
        color = null;
      }

      if (!color) return null;
      primaryIslandTextureColorCache.set(texture, color.clone());
      return color;
    }

    function resolvePrimaryIslandBaseColor(THREE, sourceMaterial) {
      const baseColor = sourceMaterial?.color ? sourceMaterial.color.clone() : new THREE.Color(0xffffff);
      const textureColor = sampleTextureAverageColor(THREE, sourceMaterial?.map);
      if (!textureColor) return baseColor;
      return baseColor.multiply(textureColor);
    }

    function createPrimaryIslandToonMaterial(THREE, sourceMaterial, gradientMap) {
      const toonMaterial = new THREE.MeshToonMaterial({
        color: resolvePrimaryIslandBaseColor(THREE, sourceMaterial),

        transparent: sourceMaterial?.transparent === true,
        opacity: sourceMaterial?.opacity ?? 1,
        alphaTest: sourceMaterial?.alphaTest ?? 0,
        side: sourceMaterial?.side ?? THREE.FrontSide,
        depthWrite: sourceMaterial?.depthWrite ?? true,
        depthTest: sourceMaterial?.depthTest ?? true,
        vertexColors: sourceMaterial?.vertexColors ?? false
      });
      if ('flatShading' in toonMaterial && sourceMaterial?.flatShading !== undefined) {
        toonMaterial.flatShading = sourceMaterial.flatShading;
      }

      if (sourceMaterial?.emissive) toonMaterial.emissive.copy(sourceMaterial.emissive);
      if (sourceMaterial?.emissiveIntensity !== undefined) {
        toonMaterial.emissiveIntensity = sourceMaterial.emissiveIntensity;
      }
      toonMaterial.needsUpdate = true;
      return toonMaterial;
    }

    function applyToonToPrimaryIslandModel(THREE, model, gradientMap) {
      const materialCache = new WeakMap();
      const shouldKeepOriginalMaterial = nodeName => {
        const normalized = String(nodeName || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        return normalized === 'primaryislandbase' || normalized === 'crttvscreen' || normalized === 'crttvscreenproxy';
      };
      const convertMaterial = sourceMaterial => {
        if (!sourceMaterial) return sourceMaterial;
        if (materialCache.has(sourceMaterial)) {
          return materialCache.get(sourceMaterial);
        }
        const toonMaterial = createPrimaryIslandToonMaterial(THREE, sourceMaterial, gradientMap);
        materialCache.set(sourceMaterial, toonMaterial);
        return toonMaterial;
      };

      model.traverse(node => {
        if (!node.isMesh) return;
        if (shouldKeepOriginalMaterial(node.name)) {
          if (Array.isArray(node.material)) {
            node.material = node.material.map(material => (material?.clone ? material.clone() : material));
          } else if (node.material?.clone) {

          node.receiveShadow = false;

        node.receiveShadow = false;

    function usesLiveMainSceneStars(mode = getSkyRenderMode()) {
      return !usesSkyBackdropCache(mode);
    }

    function usesDirectSkyMesh(mode = getSkyRenderMode()) {
      return mode === SKY_RENDER_MODES.DIRECT_SKYBOX;
    }

    function usesFullscreenSky(mode = getSkyRenderMode()) {
      return mode === SKY_RENDER_MODES.FULLSCREEN_SHADER;
    }

    function isSkyCacheAnimated(mode = getSkyRenderMode()) {
      if (!usesSkyBackdropCache(mode)) return false;
      return Boolean(state.assetRefs.skyPresetAnim || skyControlState.animateTime || state.assetRefs.stars?.visible);
    }

    function isSkyVisualAnimating(mode = getSkyRenderMode()) {
      if (usesSkyBackdropCache(mode)) {
        return false;
      }
      return Boolean(state.assetRefs.skyPresetAnim || skyControlState.animateTime || state.assetRefs.stars?.visible);
    }

    function applySkyExampleUniforms(uniforms, preset) {
      setSkyUniformIfPresent(uniforms, 'cloudScale', getSkyPresetNumber(preset, 'cloudScale'));
      setSkyUniformIfPresent(uniforms, 'cloudSpeed', getSkyPresetNumber(preset, 'cloudSpeed'));
      setSkyUniformIfPresent(uniforms, 'cloudCoverage', getSkyPresetNumber(preset, 'cloudCoverage'));
      setSkyUniformIfPresent(uniforms, 'cloudDensity', getSkyPresetNumber(preset, 'cloudDensity'));
      setSkyUniformIfPresent(uniforms, 'cloudElevation', getSkyPresetNumber(preset, 'cloudElevation'));
      setSkyUniformIfPresent(uniforms, 'cloudQuality', getSkyPresetNumber(preset, 'cloudQuality'));
      setSkyUniformIfPresent(uniforms, 'showSunDisc', getSkyPresetBool(preset, 'showSunDisc') ? 1 : 0);
      if (uniforms?.up?.value?.set) {
        uniforms.up.value.set(
          getSkyPresetNumber(preset, 'upX'),
          getSkyPresetNumber(preset, 'upY'),
          getSkyPresetNumber(preset, 'upZ')
        );
        if (uniforms.up.value.lengthSq() <= 0.000001) {
          uniforms.up.value.set(0, 1, 0);
        }
      }
    }

    function writeSkyControlStateToPreset() {
      const preset = SKY_PRESETS[skyControlState.preset] || SKY_PRESETS.sunset;
      preset.turbidity = skyControlState.turbidity;
      preset.rayleigh = skyControlState.rayleigh;
      preset.mieCoefficient = skyControlState.mieCoefficient;
      preset.mieDirectionalG = skyControlState.mieDirectionalG;
      preset.elevation = skyControlState.elevation;
      preset.elevationOffset = skyControlState.elevationOffset;
      preset.azimuth = skyControlState.azimuth;
      preset.exposure = skyControlState.exposure;
      preset.cloudScale = skyControlState.cloudScale;
      preset.cloudSpeed = skyControlState.cloudSpeed;
      preset.cloudCoverage = skyControlState.cloudCoverage;
      preset.cloudDensity = skyControlState.cloudDensity;
      preset.cloudElevation = skyControlState.cloudElevation;
      preset.cloudQuality = skyControlState.cloudQuality;
      preset.showSunDisc = skyControlState.showSunDisc;
      preset.upX = skyControlState.upX;
      preset.upY = skyControlState.upY;
      preset.upZ = skyControlState.upZ;
      preset.animateTime = skyControlState.animateTime;
      preset.timeScale = skyControlState.timeScale;
      preset.timeOffset = skyControlState.timeOffset;
      preset.manualTime = skyControlState.manualTime;
    }

    function syncSkyControlStateFromPreset(name = state.assetRefs.skyPreset || skyControlState.preset, { updateDisplays = true } = {}) {
      const presetName = SKY_PRESETS[name] ? name : 'sunset';
      const preset = SKY_PRESETS[presetName];
      skyControlState.preset = presetName;
      skyControlState.turbidity = preset.turbidity;
      skyControlState.rayleigh = preset.rayleigh;
      skyControlState.mieCoefficient = preset.mieCoefficient;
      skyControlState.mieDirectionalG = preset.mieDirectionalG;
      skyControlState.elevation = preset.elevation;
      skyControlState.elevationOffset = getSkyPresetNumber(preset, 'elevationOffset');
      skyControlState.azimuth = preset.azimuth;
      skyControlState.exposure = preset.exposure;
      skyControlState.cloudScale = getSkyPresetNumber(preset, 'cloudScale');
      skyControlState.cloudSpeed = getSkyPresetNumber(preset, 'cloudSpeed');
      skyControlState.cloudCoverage = getSkyPresetNumber(preset, 'cloudCoverage');
      skyControlState.cloudDensity = getSkyPresetNumber(preset, 'cloudDensity');
      skyControlState.cloudElevation = getSkyPresetNumber(preset, 'cloudElevation');
      skyControlState.cloudQuality = getSkyPresetNumber(preset, 'cloudQuality');
      skyControlState.showSunDisc = getSkyPresetBool(preset, 'showSunDisc');
      skyControlState.upX = getSkyPresetNumber(preset, 'upX');
      skyControlState.upY = getSkyPresetNumber(preset, 'upY');
      skyControlState.upZ = getSkyPresetNumber(preset, 'upZ');
      skyControlState.animateTime = getSkyPresetBool(preset, 'animateTime');
      skyControlState.timeScale = getSkyPresetNumber(preset, 'timeScale');
      skyControlState.timeOffset = getSkyPresetNumber(preset, 'timeOffset');
      skyControlState.manualTime = getSkyPresetNumber(preset, 'manualTime');
      skyControlState.yawFollow = Number.isFinite(state.assetRefs.skyYawFollow) ? state.assetRefs.skyYawFollow : SKY_DEBUG_DEFAULTS.yawFollow;
      skyControlState.pitchFollow = Number.isFinite(state.assetRefs.skyPitchFollow) ? state.assetRefs.skyPitchFollow : SKY_DEBUG_DEFAULTS.pitchFollow;
      skyControlState.horizon = Number.isFinite(state.assetRefs.skyPitchAdjustment)
        ? state.assetRefs.skyPitchAdjustment * 180 / Math.PI
        : SKY_DEBUG_DEFAULTS.pitchOffsetDeg;
      skyControlState.yawLocked = Boolean(state.assetRefs.skyYawLocked);
      if (updateDisplays) {
        skyControlControllers.forEach(controller => controller.updateDisplay());
      }
    }

    function applySkyFollowControlState() {
      const THREERef = state.THREE;
      if (!THREERef) return;
      state.assetRefs.skyYawFollow = THREERef.MathUtils.clamp(skyControlState.yawFollow, 0, 1);
      state.assetRefs.skyPitchFollow = THREERef.MathUtils.clamp(skyControlState.pitchFollow, 0, 1);
      state.assetRefs.skyPitchAdjustment = THREERef.MathUtils.degToRad(THREERef.MathUtils.clamp(skyControlState.horizon, -45, 45));
      state.assetRefs.skyYawLocked = Boolean(skyControlState.yawLocked);
      if (state.assetRefs.skyYawLocked && !Number.isFinite(state.assetRefs.skyYawLockValue)) {
        state.assetRefs.skyYawLockValue = state.stage ? state.stage.rotation.y : 0;
      }
      skyYawFollowInput.value = state.assetRefs.skyYawFollow.toFixed(2);
      skyYawFollowValue.textContent = state.assetRefs.skyYawFollow.toFixed(2);
      skyPitchFollowInput.value = state.assetRefs.skyPitchFollow.toFixed(2);
      skyPitchFollowValue.textContent = state.assetRefs.skyPitchFollow.toFixed(2);
      skyPitchOffsetInput.value = (state.assetRefs.skyPitchAdjustment * 180 / Math.PI).toFixed(1);
      skyPitchOffsetValue.textContent = (state.assetRefs.skyPitchAdjustment * 180 / Math.PI).toFixed(1);
      skyLockButton.textContent = state.assetRefs.skyYawLocked ? 'Sky: Locked' : 'Sky: Follow Yaw';
      updateSkyCamera();
    }

    function applySkyControlState() {
      if (!state.THREE) return;
      skyControlApplying = true;
      writeSkyControlStateToPreset();
      state.assetRefs.skyPresetAnim = null;
      setSkyPreset(skyControlState.preset);
      applySkyFollowControlState();
      skyControlApplying = false;
      requestRenderHold();
    }

    function handleSkyPresetControlChange() {
      syncSkyControlStateFromPreset(skyControlState.preset, { updateDisplays: true });
      if (skyControlState.smoothPreset) {
        setSkyPresetSmooth(skyControlState.preset, { duration: skyControlState.transitionDuration });
      } else {
        setSkyPreset(skyControlState.preset);
      }
      applySkyFollowControlState();
    }

    function updateSkyRenderModeUrl(mode = getSkyRenderMode()) {
      const url = new URL(window.location.href);
      if (mode === SKY_RENDER_MODES.CACHED_CURRENT) {
        url.searchParams.delete('skyMode');
      } else {
        url.searchParams.set('skyMode', mode);
      }
      window.history.replaceState({}, '', `${url.pathname}${url.search}${url.hash}`);
    }

    function resetSkyRenderDiag() {
      SKY_RENDER_DIAG.mode = getSkyRenderMode();
      SKY_RENDER_DIAG.reset();
      state.assetRefs.skyDiagLastRenderAt = 0;
      state.assetRefs.skyVisualLastRender = 0;
    }

    function applySkyRenderMode({ updateUrl = false } = {}) {
      const mode = getSkyRenderMode();
      const sky = state.assetRefs.sky;
      const stars = state.assetRefs.stars;
      const fullscreenSky = state.assetRefs.fullscreenSky;

      if (updateUrl) {
        updateSkyRenderModeUrl(mode);
      }

      resetSkyRenderDiag();

      if (sky) {
        sky.visible = !usesFullscreenSky(mode);
        sky.layers.set(usesDirectSkyMesh(mode) ? 0 : 1);
        sky.position.set(0, 0, 0);
        sky.quaternion.identity();
        sky.renderOrder = -100000;
        if (sky.material) {
          sky.material.depthWrite = false;
          sky.material.depthTest = false;
        }
      }

      if (stars) {
        stars.layers.set(usesLiveMainSceneStars(mode) ? 0 : 1);
        stars.renderOrder = -99999;
        stars.visible = getCurrentStarOpacity() > 0.001;
      }

      if (fullscreenSky) {
        fullscreenSky.visible = usesFullscreenSky(mode);
      }

      if (state.scene) {
        if (usesSkyBackdropCache(mode)) {
          const target = ensureSkyBackdropTarget();
          if (target) {
            state.scene.background = target.texture;
          }
        } else {
          state.scene.background = null;
        }
      }

      state.assetRefs.skyBackdropDirty = true;
      state.assetRefs.skyBackdropLastRender = 0;
      requestRenderHold();
    }

    function setSkyRenderMode(mode) {
      skyControlState.renderMode = SKY_RENDER_MODE_VALUES.has(mode) ? mode : SKY_RENDER_MODES.CACHED_CURRENT;
      applySkyRenderMode({ updateUrl: true });
    }

    function setSkyPreset(name) {
      const preset = SKY_PRESETS[name] || SKY_PRESETS.sunset;
      const { THREE, renderer } = state;
      const sky = state.assetRefs.sky;
      if (!preset || !THREE || !renderer || !sky) return;

      const uniforms = sky.material.uniforms;
      uniforms.turbidity.value = preset.turbidity;
      uniforms.rayleigh.value = preset.rayleigh;
      uniforms.mieCoefficient.value = preset.mieCoefficient;
      uniforms.mieDirectionalG.value = preset.mieDirectionalG;
      applySkyExampleUniforms(uniforms, preset);

      const sunBase = state.assetRefs.sunBase || new THREE.Vector3();
      if (preset.useDirection && preset.direction) {
        if (Array.isArray(preset.direction)) {
          sunBase.set(preset.direction[0], preset.direction[1], preset.direction[2]);
        } else {
          sunBase.copy(preset.direction);
        }
        sunBase.normalize();
      } else {
        const elevation = preset.elevation + getSkyPresetNumber(preset, 'elevationOffset');
        const phi = THREE.MathUtils.degToRad(90 - elevation);
        const theta = THREE.MathUtils.degToRad(preset.azimuth);
        sunBase.setFromSphericalCoords(1, phi, theta);
      }
      uniforms.sunPosition.value.copy(sunBase);
      renderer.toneMappingExposure = preset.exposure;

      state.assetRefs.sun = uniforms.sunPosition.value;
      state.assetRefs.sunBase = sunBase;
      state.assetRefs.skyPreset = name;
      if (state.assetRefs.stars) {
        state.assetRefs.stars.visible = getCurrentStarOpacity() > 0.001;
      }
      skyToggleButton.textContent = `Sky: ${name.charAt(0).toUpperCase()}${name.slice(1)}`;
      markSkyBackdropDirty();
      updateHorizonBackdrop();
      if (!skyControlApplying) {
        syncSkyControlStateFromPreset(name, { updateDisplays: true });
      }
    }

    function setSkyPresetSmooth(name, { duration = 0.6 } = {}) {
      const preset = SKY_PRESETS[name] || SKY_PRESETS.sunset;
      const { THREE, renderer } = state;
      const sky = state.assetRefs.sky;
      if (!preset || !THREE || !renderer || !sky) return;

      const uniforms = sky.material.uniforms;
      const from = {
        turbidity: uniforms.turbidity.value,
        rayleigh: uniforms.rayleigh.value,
        mieCoefficient: uniforms.mieCoefficient.value,
        mieDirectionalG: uniforms.mieDirectionalG.value,
        cloudScale: uniforms.cloudScale?.value ?? SKY_EXAMPLE_DEFAULTS.cloudScale,
        cloudSpeed: uniforms.cloudSpeed?.value ?? SKY_EXAMPLE_DEFAULTS.cloudSpeed,
        cloudCoverage: uniforms.cloudCoverage?.value ?? SKY_EXAMPLE_DEFAULTS.cloudCoverage,
        cloudDensity: uniforms.cloudDensity?.value ?? SKY_EXAMPLE_DEFAULTS.cloudDensity,
        cloudElevation: uniforms.cloudElevation?.value ?? SKY_EXAMPLE_DEFAULTS.cloudElevation,
        cloudQuality: uniforms.cloudQuality?.value ?? SKY_EXAMPLE_DEFAULTS.cloudQuality,
        showSunDisc: uniforms.showSunDisc?.value ?? (SKY_EXAMPLE_DEFAULTS.showSunDisc ? 1 : 0),
        up: uniforms.up?.value?.clone ? uniforms.up.value.clone() : new THREE.Vector3(SKY_EXAMPLE_DEFAULTS.upX, SKY_EXAMPLE_DEFAULTS.upY, SKY_EXAMPLE_DEFAULTS.upZ),
        sunPosition: uniforms.sunPosition.value.clone(),
        exposure: renderer.toneMappingExposure
      };

      const sunTarget = new THREE.Vector3();
      if (preset.useDirection && preset.direction) {
        if (Array.isArray(preset.direction)) {
          sunTarget.set(preset.direction[0], preset.direction[1], preset.direction[2]);
        } else {
          sunTarget.copy(preset.direction);
        }
        sunTarget.normalize();
      } else {
        const elevation = preset.elevation + getSkyPresetNumber(preset, 'elevationOffset');
        const phi = THREE.MathUtils.degToRad(90 - elevation);
        const theta = THREE.MathUtils.degToRad(preset.azimuth);
        sunTarget.setFromSphericalCoords(1, phi, theta);
      }

      const to = {
        turbidity: preset.turbidity,
        rayleigh: preset.rayleigh,
        mieCoefficient: preset.mieCoefficient,
        mieDirectionalG: preset.mieDirectionalG,
        cloudScale: getSkyPresetNumber(preset, 'cloudScale'),
        cloudSpeed: getSkyPresetNumber(preset, 'cloudSpeed'),
        cloudCoverage: getSkyPresetNumber(preset, 'cloudCoverage'),
        cloudDensity: getSkyPresetNumber(preset, 'cloudDensity'),
        cloudElevation: getSkyPresetNumber(preset, 'cloudElevation'),
        cloudQuality: getSkyPresetNumber(preset, 'cloudQuality'),
        showSunDisc: getSkyPresetBool(preset, 'showSunDisc') ? 1 : 0,
        up: new THREE.Vector3(
          getSkyPresetNumber(preset, 'upX'),
          getSkyPresetNumber(preset, 'upY'),
          getSkyPresetNumber(preset, 'upZ')
        ),
        sunPosition: sunTarget,
        exposure: preset.exposure
      };

      state.assetRefs.skyPresetAnim = {
        timer: 0,
        duration: Math.max(duration, 0.001),
        from,
        to,
        fromName: state.assetRefs.skyPreset || 'sunset',
        targetName: name
      };

      if (!state.assetRefs.skyPresetUpdater) {
        state.assetRefs.skyPresetUpdater = registerUpdater(({ delta = 0 }) => {
          const anim = state.assetRefs.skyPresetAnim;
          if (!anim) return;
          anim.timer += delta;
          const t = Math.min(anim.timer / anim.duration, 1);
          const eased = 1 - Math.pow(1 - t, 3);

          uniforms.turbidity.value = anim.from.turbidity + (anim.to.turbidity - anim.from.turbidity) * eased;
          uniforms.rayleigh.value = anim.from.rayleigh + (anim.to.rayleigh - anim.from.rayleigh) * eased;
          uniforms.mieCoefficient.value = anim.from.mieCoefficient + (anim.to.mieCoefficient - anim.from.mieCoefficient) * eased;
          uniforms.mieDirectionalG.value = anim.from.mieDirectionalG + (anim.to.mieDirectionalG - anim.from.mieDirectionalG) * eased;
          setSkyUniformIfPresent(uniforms, 'cloudScale', anim.from.cloudScale + (anim.to.cloudScale - anim.from.cloudScale) * eased);
          setSkyUniformIfPresent(uniforms, 'cloudSpeed', anim.from.cloudSpeed + (anim.to.cloudSpeed - anim.from.cloudSpeed) * eased);
          setSkyUniformIfPresent(uniforms, 'cloudCoverage', anim.from.cloudCoverage + (anim.to.cloudCoverage - anim.from.cloudCoverage) * eased);
          setSkyUniformIfPresent(uniforms, 'cloudDensity', anim.from.cloudDensity + (anim.to.cloudDensity - anim.from.cloudDensity) * eased);
          setSkyUniformIfPresent(uniforms, 'cloudElevation', anim.from.cloudElevation + (anim.to.cloudElevation - anim.from.cloudElevation) * eased);
          setSkyUniformIfPresent(uniforms, 'cloudQuality', anim.from.cloudQuality + (anim.to.cloudQuality - anim.from.cloudQuality) * eased);
          setSkyUniformIfPresent(uniforms, 'showSunDisc', anim.from.showSunDisc + (anim.to.showSunDisc - anim.from.showSunDisc) * eased);
          if (uniforms.up?.value?.lerpVectors) {
            uniforms.up.value.lerpVectors(anim.from.up, anim.to.up, eased);
            if (uniforms.up.value.lengthSq() <= 0.000001) {
              uniforms.up.value.set(0, 1, 0);
            }
          }
          uniforms.sunPosition.value.lerpVectors(anim.from.sunPosition, anim.to.sunPosition, eased);
          renderer.toneMappingExposure = anim.from.exposure + (anim.to.exposure - anim.from.exposure) * eased;
          if (state.assetRefs.stars) {
            state.assetRefs.stars.visible = getCurrentStarOpacity() > 0.001;
          }
          markSkyBackdropDirty();
          updateHorizonBackdrop();

          if (t >= 1) {
            state.assetRefs.skyPresetAnim = null;
            state.assetRefs.skyPreset = anim.targetName || name;
            skyToggleButton.textContent = `Sky: ${state.assetRefs.skyPreset.charAt(0).toUpperCase()}${state.assetRefs.skyPreset.slice(1)}`;
            if (!skyControlApplying) {
              syncSkyControlStateFromPreset(state.assetRefs.skyPreset, { updateDisplays: true });
            }
          }
        }, {
          tag: 'skyPreset',
          isActive: () => Boolean(state.assetRefs.skyPresetAnim)
        });
      }
    }

    function syncSkyCameraProjection() {
      const { camera } = state;
      const skyCamera = state.assetRefs.skyCamera;
      if (!camera || !skyCamera) return;
      const cache = state.assetRefs.skyCameraProjectionCache || (state.assetRefs.skyCameraProjectionCache = {});
      if (
        cache.fov === camera.fov &&
        cache.aspect === camera.aspect &&
        cache.near === camera.near &&
        cache.far === camera.far
      ) {
        return;
      }
      skyCamera.fov = camera.fov;
      skyCamera.aspect = camera.aspect;
      skyCamera.near = camera.near;
      skyCamera.far = camera.far;
      skyCamera.updateProjectionMatrix();
      cache.fov = camera.fov;
      cache.aspect = camera.aspect;
      cache.near = camera.near;
      cache.far = camera.far;
    }

    function ensureSkyBackdropTarget() {
      const { THREE, renderer } = state;
      if (!THREE || !renderer) return null;
      const width = Math.max(2, Math.floor((canvas.clientWidth || window.innerWidth || 2) * SKY_BACKDROP_SCALE));
      const height = Math.max(2, Math.floor((canvas.clientHeight || window.innerHeight || 2) * SKY_BACKDROP_SCALE));
      let target = state.assetRefs.skyBackdropTarget;
      if (!target) {
        target = new THREE.WebGLRenderTarget(width, height, {
          depthBuffer: true,
          stencilBuffer: false
        });
        target.texture.name = 'CachedSkyBackdrop';
        target.texture.colorSpace = THREE.SRGBColorSpace;
        target.texture.generateMipmaps = false;
        target.texture.minFilter = THREE.LinearFilter;
        target.texture.magFilter = THREE.LinearFilter;
        state.assetRefs.skyBackdropTarget = target;
        if (usesSkyBackdropCache()) {
          state.scene.background = target.texture;
        }
        state.assetRefs.skyBackdropDirty = true;
        return target;
      }
      if (target.width !== width || target.height !== height) {
        target.setSize(width, height);
        state.assetRefs.skyBackdropDirty = true;
      }
      if (usesSkyBackdropCache() && state.scene?.background !== target.texture) {
        state.scene.background = target.texture;
      }
      return target;
    }

    function markSkyBackdropDirty() {
      state.assetRefs.skyBackdropDirty = true;
      requestRenderHold();
    }

    function markSkyBackdropDirtyIfCameraMoved() {
      const skyCamera = state.assetRefs.skyCamera;
      const { THREE } = state;
      if (!skyCamera || !THREE) return;
      const lastPosition = state.assetRefs.skyBackdropCameraPosition || (state.assetRefs.skyBackdropCameraPosition = new THREE.Vector3(Infinity, Infinity, Infinity));
      const lastQuaternion = state.assetRefs.skyBackdropCameraQuaternion || (state.assetRefs.skyBackdropCameraQuaternion = new THREE.Quaternion());
      if (lastPosition.distanceToSquared(skyCamera.position) > 0.000001 || lastQuaternion.angleTo(skyCamera.quaternion) > 0.00001) {
        lastPosition.copy(skyCamera.position);
        lastQuaternion.copy(skyCamera.quaternion);
        state.assetRefs.skyBackdropDirty = true;
      }
    }

    function updateSkyBackdropCache(now = performance.now()) {
      if (!usesSkyBackdropCache()) return;
      const { renderer, scene } = state;
      const skyCamera = state.assetRefs.skyCamera;
      if (!renderer || !scene || !skyCamera) return;
      const target = ensureSkyBackdropTarget();
      if (!target) return;

      const activeInterval = state.assetRefs.stars?.visible ? STAR_SKY_CACHE_INTERVAL_MS : (1000 / 60);
      const idleInterval = activeInterval;
      const lastRender = state.assetRefs.skyBackdropLastRender || 0;
      const needsAnimatedSky = isSkyCacheAnimated();
      const interval = needsAnimatedSky ? activeInterval : idleInterval;
      if (!state.assetRefs.skyBackdropDirty && !needsAnimatedSky) return;
      if (lastRender && now - lastRender < interval) return;

      const previousTarget = renderer.getRenderTarget();
      const previousBackground = scene.background;
      scene.background = null;
      renderer.setRenderTarget(target);
      renderer.clear();
      renderer.render(scene, skyCamera);
      SKY_RENDER_DIAG.skyTargetRenders += 1;
      renderer.setRenderTarget(previousTarget);
      scene.background = previousBackground || target.texture;
      state.assetRefs.skyBackdropLastRender = now;
      state.assetRefs.skyBackdropDirty = false;
    }

    function updateSkyCamera() {
      const { THREE, camera, stage } = state;
      const skyCamera = state.assetRefs.skyCamera;
      if (!THREE || !camera || !skyCamera) return;
      syncSkyCameraProjection();

      const freeCameraMode = state.assetRefs.cameraMode === 'free';
      const pitchAdjustment = state.assetRefs.skyPitchAdjustment || 0;
      if (freeCameraMode) {
        const worldPos = state.assetRefs.skyWorldPos || (state.assetRefs.skyWorldPos = new THREE.Vector3());
        camera.getWorldPosition(worldPos);
        skyCamera.position.copy(worldPos);
        skyCamera.quaternion.copy(camera.quaternion);
        if (pitchAdjustment !== 0) {
          const skyPitchAdjustEuler = state.assetRefs.skyPitchAdjustEuler || (state.assetRefs.skyPitchAdjustEuler = new THREE.Euler(0, 0, 0, 'YXZ'));
          const skyPitchAdjustQuat = state.assetRefs.skyPitchAdjustQuat || (state.assetRefs.skyPitchAdjustQuat = new THREE.Quaternion());
          skyPitchAdjustEuler.set(pitchAdjustment, 0, 0, 'YXZ');
          skyPitchAdjustQuat.setFromEuler(skyPitchAdjustEuler);
        skyCamera.quaternion.multiply(skyPitchAdjustQuat);
        }
        markSkyBackdropDirtyIfCameraMoved();
        return;
      }

      if (state.assetRefs.skyYawLocked && !Number.isFinite(state.assetRefs.skyYawLockValue)) {
        state.assetRefs.skyYawLockValue = stage ? stage.rotation.y : 0;
      }
      const rawYaw = stage ? stage.rotation.y : 0;
      const rawPitch = stage ? stage.rotation.x : 0;
      const yawFollow = Number.isFinite(state.assetRefs.skyYawFollow) ? state.assetRefs.skyYawFollow : 1;
      const pitchFollow = Number.isFinite(state.assetRefs.skyPitchFollow) ? state.assetRefs.skyPitchFollow : 1;
      const yaw = state.assetRefs.skyYawLocked
        ? (state.assetRefs.skyYawLockValue || 0)
        : -rawYaw * yawFollow;
      const pitch = (state.assetRefs.skyPitchOffset || 0) + pitchAdjustment - rawPitch * pitchFollow;

      const worldPos = state.assetRefs.skyWorldPos || (state.assetRefs.skyWorldPos = new THREE.Vector3());
      camera.getWorldPosition(worldPos);
      skyCamera.position.copy(worldPos);
      const skyEuler = state.assetRefs.skyEuler || (state.assetRefs.skyEuler = new THREE.Euler(0, 0, 0, 'YXZ'));
      skyEuler.set(pitch, yaw, 0, 'YXZ');
      skyCamera.quaternion.setFromEuler(skyEuler);
      markSkyBackdropDirtyIfCameraMoved();

      if (DEBUG_HELPERS_VISIBLE) {
        const debug = state.assetRefs.skyDebug || (state.assetRefs.skyDebug = { lastLog: 0 });
        const now = performance.now();
        if (now - debug.lastLog > 2500) {
          debug.lastLog = now;
          const sunUniform = state.assetRefs.sun;
          autoConsoleLog('[sky-debug]', {
            rawYaw: Number(rawYaw.toFixed(4)),
            rawPitch: Number(rawPitch.toFixed(4)),
            skyYaw: Number(yaw.toFixed(4)),
            skyYawFollow: Number(yawFollow.toFixed(2)),
            skyPitchFollow: Number(pitchFollow.toFixed(2)),
            skyPitchAdjustmentDeg: Number(THREE.MathUtils.radToDeg(pitchAdjustment).toFixed(2)),
            skyPitch: Number(skyCamera.rotation.x.toFixed(4)),
            sunY: Number(sunUniform?.y?.toFixed?.(4) ?? 0)
          });
        }
      }
    }

    function updateSkyExperimentPresentation() {
      const skyCamera = state.assetRefs.skyCamera;
      if (!skyCamera) return;
      const mode = getSkyRenderMode();
      const sky = state.assetRefs.sky;
      const stars = state.assetRefs.stars;
      const fullscreenSky = state.assetRefs.fullscreenSky;

      if (sky) {
        if (usesDirectSkyMesh(mode)) {
          sky.position.copy(skyCamera.position);
          sky.quaternion.copy(skyCamera.quaternion);
        } else {
          sky.position.set(0, 0, 0);
          sky.quaternion.identity();
        }
      }

      if (stars) {
        const elapsed = state.clock?.elapsedTime ?? 0;
        applyStarDomeTransform(stars, skyCamera, elapsed);
      }

      if (fullscreenSky?.material?.uniforms) {
        fullscreenSky.material.uniforms.cameraFov.value = state.camera?.fov ?? 50;
        fullscreenSky.material.uniforms.cameraAspect.value = state.camera?.aspect ?? 1;
        const skyRotationMatrix4 = state.assetRefs.skyRotationMatrix4 || (state.assetRefs.skyRotationMatrix4 = new state.THREE.Matrix4());
        skyRotationMatrix4.makeRotationFromQuaternion(skyCamera.quaternion);
        fullscreenSky.material.uniforms.skyRotation.value.setFromMatrix4(
          skyRotationMatrix4
        );
      }
    }

    function recordSkyRenderDiag(now = performance.now()) {
      const info = state.renderer?.info;
      const lastRenderAt = state.assetRefs.skyDiagLastRenderAt || 0;
      const frameMs = lastRenderAt ? now - lastRenderAt : 0;
      state.assetRefs.skyDiagLastRenderAt = now;

      SKY_RENDER_DIAG.mode = getSkyRenderMode();
      SKY_RENDER_DIAG.mainSceneRenders += 1;
      SKY_RENDER_DIAG.renderedFrames += 1;
      SKY_RENDER_DIAG.lastFrameMs = frameMs;
      if (frameMs > 0) {
        skyDiagFrameSamples += 1;
        skyDiagFrameTotalMs += frameMs;
        SKY_RENDER_DIAG.averageFrameMs = skyDiagFrameTotalMs / Math.max(skyDiagFrameSamples, 1);
      }
      SKY_RENDER_DIAG.drawCalls = info?.render?.calls ?? 0;
      SKY_RENDER_DIAG.triangles = info?.render?.triangles ?? 0;
      SKY_RENDER_DIAG.textures = info?.memory?.textures ?? 0;
    }

    function logHorizonMilestone(number, title, { regionsChanged = [], refsAdded = [], verify = '' } = {}) {

    function parseHorizonNumber(input, fallback, { min = -Infinity, max = Infinity } = {}) {
      const parsed = Number.parseFloat(input.value);
      const value = Number.isFinite(parsed) ? parsed : fallback;
      return Math.min(Math.max(value, min), max);
    }

    function getCurrentSunState() {
      const { THREE } = state;
      const sun = state.assetRefs.sun || state.assetRefs.sunBase;
      if (!THREE || !sun) {
        return { elevation: 0, azimuth: 0, direction: null };
      }
      const direction = (state.assetRefs.horizonSunDirection || (state.assetRefs.horizonSunDirection = new THREE.Vector3())).copy(sun).normalize();
      return {
        elevation: Math.asin(THREE.MathUtils.clamp(direction.y, -1, 1)),
        azimuth: Math.atan2(direction.x, direction.z),
        direction
      };
    }

      if (!stage || !group || group.parent === stage) return;

      const anim = state.assetRefs.skyPresetAnim;
      if (!anim) return null;
      const duration = Math.max(anim.duration || 0, 0.001);
      const t = Math.min(anim.timer / duration, 1);
      return {
        fromName: anim.fromName || state.assetRefs.skyPreset || 'sunset',
        toName: anim.targetName || state.assetRefs.skyPreset || 'sunset',
        progress: easeInOut(t)
      };

    function initVillageLights() {
      const { THREE, renderer } = state;
      const parentGroup = state.assetRefs.horizonGroup;
      if (!THREE || !renderer || !parentGroup) return;

      if (!state.assetRefs.villageLights) {
        state.assetRefs.villageLights = createVillageLightsController({
          THREE,
          renderer,
          parentGroup,
          targetLayerName: 'mountain_02',
          maskUrl: './images/lights_mask.png'
        });
      }

      const controller = state.assetRefs.villageLights;
      if (!controller || state.assetRefs.villageLightsInitPromise) return;

      state.assetRefs.villageLightsInitPromise = controller.init()
        .then(() => {
          if (!state.assetRefs.villageLightsUpdater) {
            let lastVillageLightUpdate = -Infinity;
            const updateVillageLights = ({ elapsed = 0 }) => {
              if (controller.needsUpdate && !controller.needsUpdate()) return;
              if (elapsed - lastVillageLightUpdate < 1 / 60) return;
              lastVillageLightUpdate = elapsed;
              controller.update(elapsed);
            };
            updateVillageLights.__tag = 'villageLights';
            state.assetRefs.villageLightsUpdater = registerUpdater(updateVillageLights, {
              tag: 'villageLights',
              isActive: () => controller.needsUpdate?.() ?? true
            });
          }
          updateHorizonBackdrop();
        })
        .catch(error => {
          console.warn('[VillageLights]', error);
          state.assetRefs.villageLightsInitPromise = null;
        });
    }

    function getCurrentMountainTintColors() {
      const { THREE } = state;
      const anim = state.assetRefs.skyPresetAnim;
      if (anim) {
        const fromStack = getMountainTintStack(anim.fromName || state.assetRefs.skyPreset || 'sunset');
        const toStack = getMountainTintStack(anim.targetName || 'sunset');
        const t = Math.min(anim.timer / anim.duration, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        return fromStack.map((fromColor, index) =>
          new THREE.Color(fromColor).lerp(new THREE.Color(toStack[index] || toStack[toStack.length - 1] || fromColor), eased)
        );
      }

      return getMountainTintStack(state.assetRefs.skyPreset || 'sunset').map(color => new THREE.Color(color));

    function getCurrentOceanColor() {
      const { THREE } = state;
      const anim = state.assetRefs.skyPresetAnim;
      if (anim) {
        const fromName = anim.fromName === 'fullsun' ? 'day' : (anim.fromName || 'sunset');

	    function isolateCrtFocusScene() {
	      const scene = state.scene;
	      const restore = { visibility: [] };
	      if (!scene) return restore;

	      const keepRoots = [
	        state.assetRefs.crtModelRoot,
	        state.assetRefs.crtDesk,
	        state.assetRefs.crtInteractiveMesh,
	        state.assetRefs.heatWall
	      ].filter(Boolean);

	      if (!keepRoots.length) return restore;

	      const keepRootSet = new Set(keepRoots);
	      const keepAncestorSet = new Set();
	      keepRoots.forEach(root => {
	        let current = root;
	        while (current) {
	          keepAncestorSet.add(current);
	          if (current === scene) break;
	          current = current.parent;
	        }
	      });

	      const isDescendantOfKeepRoot = object => {
	        let current = object;
	        while (current) {
	          if (keepRootSet.has(current)) return true;
	          if (current === scene) return false;
	          current = current.parent;
	        }
	        return false;
	      };

	      const setVisible = (object, visible) => {
	        if (!object || object.visible === visible) return;
	        restore.visibility.push({ object, visible: object.visible });
	        object.visible = visible;
	      };

	      const visit = object => {
	        if (!object) return;
	        if (object.isLight) {
	          return;
	        }
	        if (isDescendantOfKeepRoot(object)) {
	          setVisible(object, true);
	          return;
	        }
	        if (keepAncestorSet.has(object)) {
	          setVisible(object, true);
	          object.children.forEach(visit);
	          return;
	        }
	        setVisible(object, false);
	      };

	      scene.children.forEach(visit);
	      return restore;
	    }

    function computeMeshUvRect(mesh) {
      const uvAttr = mesh?.geometry?.attributes?.uv;
      if (!uvAttr || uvAttr.itemSize < 2 || uvAttr.count === 0) return null;

      let minU = Infinity;
      let minV = Infinity;
      let maxU = -Infinity;
      let maxV = -Infinity;

      for (let i = 0; i < uvAttr.count; i += 1) {
        const u = uvAttr.getX(i);
        const v = uvAttr.getY(i);
        if (u < minU) minU = u;
        if (u > maxU) maxU = u;
        if (v < minV) minV = v;
        if (v > maxV) maxV = v;
      }

      const rangeU = maxU - minU;
      const rangeV = maxV - minV;

      if (rangeU <= 1e-5 || rangeV <= 1e-5) return null;

      const isFullRange =
        minU <= 0.005 &&
        minV <= 0.005 &&
        maxU >= 0.995 &&
        maxV >= 0.995;

      return { minU, minV, maxU, maxV, rangeU, rangeV, isFullRange };
    }

    function getMeshWorldFrontDirection(mesh, fallbackAxis = null) {
      const { THREE } = state;
      if (!THREE || !mesh) return null;
      const geometry = mesh.geometry;
      const normalAttr = geometry?.attributes?.normal;
      const normalMatrix = new THREE.Matrix3().getNormalMatrix(mesh.matrixWorld);
      const localNormal = new THREE.Vector3();
      const worldNormal = new THREE.Vector3();
      const front = new THREE.Vector3();

      if (normalAttr && normalAttr.count > 0) {
        for (let i = 0; i < normalAttr.count; i += 1) {
          localNormal.fromBufferAttribute(normalAttr, i);
          if (localNormal.lengthSq() < 1e-10) continue;
          worldNormal.copy(localNormal).applyMatrix3(normalMatrix).normalize();
          if (worldNormal.lengthSq() > 1e-10) front.add(worldNormal);
        }
      }

      if (front.lengthSq() > 1e-10) {
        return front.normalize();
      }

      const axis = fallbackAxis || new THREE.Vector3(0, 0, 1);
      return axis.clone().transformDirection(mesh.matrixWorld).normalize();
    }

    function extractTopBoundaryLoopLocal(mesh, { topEpsilon = 0.003 } = {}) {
      const { THREE } = state;
      if (!THREE || !mesh?.isMesh) return null;
      const geometry = mesh.geometry;
      const positionAttr = geometry?.attributes?.position;
      if (!positionAttr || positionAttr.count < 3) return null;

      mesh.updateMatrix();
      const localVerts = [];
      const temp = new THREE.Vector3();
      let topY = -Infinity;
      for (let i = 0; i < positionAttr.count; i += 1) {
        temp.fromBufferAttribute(positionAttr, i).applyMatrix4(mesh.matrix);
        localVerts.push(temp.clone());
        if (temp.y > topY) topY = temp.y;
      }

      const indexAttr = geometry.index;
      const getIndex = indexAttr ? i => indexAttr.getX(i) : i => i;
      const triCount = indexAttr ? indexAttr.count : positionAttr.count;
      const edgeCounts = new Map();
      const pushEdge = (a, b) => {
        const lo = Math.min(a, b);
        const hi = Math.max(a, b);
        const key = `${lo}|${hi}`;
        const prev = edgeCounts.get(key);
        if (prev) {
          prev.count += 1;
        } else {
          edgeCounts.set(key, { a: lo, b: hi, count: 1 });
        }
      };

      for (let i = 0; i <= triCount - 3; i += 3) {
        const ia = getIndex(i);
        const ib = getIndex(i + 1);
        const ic = getIndex(i + 2);
        if (
          localVerts[ia].y < topY - topEpsilon ||
          localVerts[ib].y < topY - topEpsilon ||
          localVerts[ic].y < topY - topEpsilon
        ) {
          continue;
        }
        pushEdge(ia, ib);
        pushEdge(ib, ic);
        pushEdge(ic, ia);
      }

      const boundaryEdges = [];
      edgeCounts.forEach(edge => {
        if (edge.count === 1) {
          boundaryEdges.push(edge);
        }
      });
      if (boundaryEdges.length < 3) return null;

      const adjacency = new Map();
      boundaryEdges.forEach(({ a, b }) => {
        if (!adjacency.has(a)) adjacency.set(a, []);
        if (!adjacency.has(b)) adjacency.set(b, []);
        adjacency.get(a).push(b);
        adjacency.get(b).push(a);
      });

      let start = null;
      adjacency.forEach((neighbors, index) => {
        if (neighbors.length !== 2) return;
        if (!start || localVerts[index].x < localVerts[start].x) {
          start = index;
        }
      });
      if (start === null) return null;

      const loopIndices = [start];
      let previous = -1;
      let current = start;
      const maxSteps = adjacency.size + 5;
      for (let steps = 0; steps < maxSteps; steps += 1) {
        const neighbors = adjacency.get(current);
        if (!neighbors || neighbors.length < 2) break;
        const next = neighbors[0] !== previous ? neighbors[0] : neighbors[1];
        if (next === start) break;
        loopIndices.push(next);
        previous = current;
        current = next;
      }

      if (loopIndices.length < 3) return null;
      const orderedLoop = loopIndices.map(index => localVerts[index].clone());

      const rebaseTarget = new THREE.Vector3(-2.77, topY, 5.263);
      let rebaseIndex = 0;
      let rebaseDistSq = Infinity;
      for (let i = 0; i < orderedLoop.length; i += 1) {
        const distSq = orderedLoop[i].distanceToSquared(rebaseTarget);
        if (distSq < rebaseDistSq) {
          rebaseDistSq = distSq;
          rebaseIndex = i;
        }
      }

      const rotated = [];
      for (let i = 0; i < orderedLoop.length; i += 1) {
        const sourceIndex = (rebaseIndex + i) % orderedLoop.length;
        rotated.push({
          point: orderedLoop[sourceIndex].clone(),
          originalLoopIndex: sourceIndex
        });
      }

      const segmentLengths = [];
      for (let i = 0; i < rotated.length - 1; i += 1) {
        segmentLengths.push(rotated[i].point.distanceTo(rotated[i + 1].point));
      }
      const sortedLengths = segmentLengths.slice().sort((a, b) => a - b);
      const medianLength = sortedLengths.length
        ? sortedLengths[Math.floor(sortedLengths.length * 0.5)]
        : 0;
      const maxSegmentLength = Math.max(medianLength * 1.75, 0.18);

      const densified = [];
      const sourceIndexToIndex = new Array(orderedLoop.length).fill(-1);
      for (let i = 0; i < rotated.length; i += 1) {
        const current = rotated[i];
        sourceIndexToIndex[current.originalLoopIndex] = densified.length;
        densified.push(current.point.clone());
        if (i >= rotated.length - 1) continue;

        const next = rotated[i + 1];
        const segmentLength = current.point.distanceTo(next.point);
        const extraPoints = Math.max(0, Math.ceil(segmentLength / maxSegmentLength) - 1);
        for (let step = 1; step <= extraPoints; step += 1) {
          const t = step / (extraPoints + 1);
          densified.push(current.point.clone().lerp(next.point, t));
        }
      }

      densified.sourceIndexToIndex = sourceIndexToIndex;
      densified.rebaseSourceIndex = rebaseIndex;
      densified.maxSegmentLength = maxSegmentLength;
      return densified;
    }

    function selectBackEdgeSpan(loopPoints) {
      if (!Array.isArray(loopPoints) || loopPoints.length < 4) return null;
      const n = loopPoints.length;

      let xMin = Infinity;
      let xMax = -Infinity;
      let zMin = Infinity;
      let zMax = -Infinity;
      for (let i = 0; i < n; i += 1) {
        const point = loopPoints[i];
        if (point.x < xMin) xMin = point.x;
        if (point.x > xMax) xMax = point.x;
        if (point.z < zMin) zMin = point.z;
        if (point.z > zMax) zMax = point.z;
      }
      const xRange = Math.max(xMax - xMin, 1e-6);
      const zRange = Math.max(zMax - zMin, 1e-6);
      const nearestIndexTo = (targetX, targetZ) => {
        let bestIndex = -1;
        let bestScore = Infinity;
        for (let i = 0; i < n; i += 1) {
          const point = loopPoints[i];
          const dx = (point.x - targetX) / xRange;
          const dz = (point.z - targetZ) / zRange;
          const score = dx * dx + dz * dz;
          if (score < bestScore) {
            bestScore = score;
            bestIndex = i;
          }
        }
        return bestIndex;
      };

      // Use actual loop extrema so corner picks stay consistent with the mesh data.
      const corner1 = nearestIndexTo(xMin, zMin);
      const corner2 = nearestIndexTo(xMax, zMin);
      const corner3 = nearestIndexTo(xMax, zMax);
      if (corner1 < 0 || corner2 < 0 || corner3 < 0) return null;
      if (corner1 === corner2 || corner2 === corner3 || corner1 === corner3) return null;

      const buildArc = (start, end, step) => {
        const indices = [];
        let cursor = start;
        const guard = n + 4;
        for (let i = 0; i < guard; i += 1) {
          indices.push(cursor);
          if (cursor === end) break;
          cursor = (cursor + step + n) % n;
        }
        return indices;
      };

      const pickShortestArc = (start, end) => {
        const arcForward = buildArc(start, end, 1);
        const arcBackward = buildArc(start, end, -1);
        const forwardValid = arcForward.length >= 2 && arcForward[arcForward.length - 1] === end;
        const backwardValid = arcBackward.length >= 2 && arcBackward[arcBackward.length - 1] === end;
        if (!forwardValid && !backwardValid) return null;
        if (forwardValid && !backwardValid) return { arc: arcForward, step: 1 };
        if (!forwardValid && backwardValid) return { arc: arcBackward, step: -1 };
        return arcForward.length <= arcBackward.length
          ? { arc: arcForward, step: 1 }
          : { arc: arcBackward, step: -1 };
      };

      // Build explicit 3 -> 2 then 2 -> 1 so we always hit side + back.
      const segment32 = pickShortestArc(corner3, corner2);
      const segment21 = pickShortestArc(corner2, corner1);
      if (!segment32 || !segment21) return null;

      const combined = [...segment32.arc, ...segment21.arc.slice(1)];
      const deduped = [];
      for (let i = 0; i < combined.length; i += 1) {
        const index = combined[i];
        if (deduped.length === 0 || deduped[deduped.length - 1] !== index) deduped.push(index);
      }
      if (deduped.length < 2) return null;

      if (DEBUG_HELPERS_VISIBLE) {
        const clamp01 = value => Math.max(0, Math.min(1, value));

        const leftBandThreshold = xMin + xRange * 0.08;
        let notch6 = -1;
        for (let i = 0; i < n; i += 1) {
          const point = loopPoints[i];
          if (point.x > leftBandThreshold) continue;
          if (notch6 === -1 || point.z > loopPoints[notch6].z) notch6 = i;
        }
        const notchZ = notch6 === -1 ? zMin + zRange * 0.6 : loopPoints[notch6].z;
        let notch5 = -1;
        let notch4 = -1;
        for (let i = 0; i < n; i += 1) {
          const point = loopPoints[i];
          if (point.x <= leftBandThreshold) continue;
          const dzToNotch = Math.abs(point.z - notchZ) / zRange;
          const dzToFront = Math.abs(point.z - zMax) / zRange;
          if (notch5 === -1) {
            notch5 = i;
          } else {
            const current = loopPoints[notch5];
            const scoreCurrent = dzToNotch - (point.x - xMin) / xRange;
            const scoreBest =
              Math.abs(current.z - notchZ) / zRange - (current.x - xMin) / xRange;
            if (scoreCurrent < scoreBest) notch5 = i;
          }
          if (notch4 === -1) {
            notch4 = i;
          } else {
            const current = loopPoints[notch4];
            const scoreCurrent = dzToFront + (point.x - xMin) / xRange * 0.15;
            const scoreBest =
              Math.abs(current.z - zMax) / zRange + (current.x - xMin) / xRange * 0.15;
            if (scoreCurrent < scoreBest) notch4 = i;
          }
        }

        const turnCandidates = [];
        for (let i = 0; i < n; i += 1) {
          const prev = loopPoints[(i - 1 + n) % n];
          const curr = loopPoints[i];
          const next = loopPoints[(i + 1) % n];
          const v1x = prev.x - curr.x;
          const v1z = prev.z - curr.z;
          const v2x = next.x - curr.x;
          const v2z = next.z - curr.z;
          const len1 = Math.hypot(v1x, v1z);
          const len2 = Math.hypot(v2x, v2z);
          if (len1 < 1e-6 || len2 < 1e-6) continue;
          const dot = Math.max(-1, Math.min(1, (v1x * v2x + v1z * v2z) / (len1 * len2)));
          const angleDeg = Math.acos(dot) * (180 / Math.PI);
          const cornerness = clamp01((180 - angleDeg) / 180);
          turnCandidates.push({
            index: i,
            x: Number(curr.x.toFixed(3)),
            z: Number(curr.z.toFixed(3)),
            angleDeg: Number(angleDeg.toFixed(2)),
            cornerness: Number(cornerness.toFixed(4))
          });
        }
        turnCandidates.sort((a, b) => b.cornerness - a.cornerness);

        const cornerHints = [
          { name: '1_back_left', index: nearestIndexTo(xMin, zMin) },
          { name: '2_back_right', index: nearestIndexTo(xMax, zMin) },
          { name: '3_front_right', index: nearestIndexTo(xMax, zMax) },
          { name: '4_front_left_inner', index: notch4 === -1 ? nearestIndexTo(xMin + xRange * 0.35, zMax) : notch4 },
          { name: '5_notch_inner', index: notch5 === -1 ? nearestIndexTo(xMin + xRange * 0.35, notchZ) : notch5 },
          { name: '6_left_notch_outer', index: notch6 === -1 ? nearestIndexTo(xMin, notchZ) : notch6 }
        ].map(entry => {
          const point = loopPoints[entry.index];
          return {
            name: entry.name,
            index: entry.index,
            x: Number(point.x.toFixed(3)),
            z: Number(point.z.toFixed(3))
          };
        });

        const loopDump = loopPoints.map((point, index) => ({
          index,
          x: Number(point.x.toFixed(3)),
          z: Number(point.z.toFixed(3))
        }));

        autoConsoleLog('[HeatWallPath]', {
          topZ: Number(zMin.toFixed(3)),
          bottomZ: Number(zMax.toFixed(3)),
          widthAtZMin: Number(xRange.toFixed(3)),
          widthAtZMax: Number(xRange.toFixed(3)),
          corner1,
          corner2,
          corner3,
          scoreForward: Number(segment32.arc.length.toFixed(3)),
          scoreBackward: Number(segment21.arc.length.toFixed(3)),
          chosenStep: segment32.step,
          segment32Step: segment32.step,
          segment21Step: segment21.step,
          segment32Count: segment32.arc.length,
          segment21Count: segment21.arc.length,
          rebaseSourceIndex: loopPoints.rebaseSourceIndex ?? null,
          maxSegmentLength: Number((loopPoints.maxSegmentLength ?? 0).toFixed(3)),
          first: deduped[0],
          last: deduped[deduped.length - 1],
          count: deduped.length
        });
        autoConsoleLog('[HeatWallCornersHint]', cornerHints);
        autoConsoleLog('[HeatWallCornerCandidates]', turnCandidates.slice(0, 24));
        autoConsoleLog('[HeatWallLoopDump]', loopDump);
        autoConsoleLog('[HeatWallChosenPathIndices]', deduped);
      }

      const span = deduped.slice().reverse().map(index => loopPoints[index].clone());
      return span.length >= 2 ? span : null;
    }

    function buildHeatWallSpanFromIndices(loopPoints, index3, index2, index1) {
      if (!Array.isArray(loopPoints) || loopPoints.length < 2) return null;
      const n = loopPoints.length;
      const normalizeIndex = value => {
        const parsed = Number.parseInt(value, 10);
        if (!Number.isFinite(parsed)) return -1;
        return ((parsed % n) + n) % n;
      };
      const corner3 = normalizeIndex(index3);
      const corner2 = normalizeIndex(index2);
      const corner1 = normalizeIndex(index1);
      if (corner3 < 0 || corner2 < 0 || corner1 < 0) return null;

      const buildArc = (start, end, step) => {
        const indices = [];
        let cursor = start;
        const guard = n + 4;
        for (let i = 0; i < guard; i += 1) {
          indices.push(cursor);
          if (cursor === end) break;
          cursor = (cursor + step + n) % n;
        }
        return indices;
      };

      const pickShortestArc = (start, end) => {
        const arcForward = buildArc(start, end, 1);
        const arcBackward = buildArc(start, end, -1);
        const forwardValid = arcForward.length >= 2 && arcForward[arcForward.length - 1] === end;
        const backwardValid = arcBackward.length >= 2 && arcBackward[arcBackward.length - 1] === end;
        if (!forwardValid && !backwardValid) return null;
        if (forwardValid && !backwardValid) return { arc: arcForward, step: 1 };
        if (!forwardValid && backwardValid) return { arc: arcBackward, step: -1 };
        return arcForward.length <= arcBackward.length
          ? { arc: arcForward, step: 1 }
          : { arc: arcBackward, step: -1 };
      };

      const segment32 = pickShortestArc(corner3, corner2);
      const segment21 = pickShortestArc(corner2, corner1);
      if (!segment32 || !segment21) return null;

      const combined = [...segment32.arc, ...segment21.arc.slice(1)];
      const deduped = [];
      for (let i = 0; i < combined.length; i += 1) {
        const index = combined[i];
        if (deduped.length === 0 || deduped[deduped.length - 1] !== index) {
          deduped.push(index);
        }
      }
      return deduped.length >= 2 ? deduped.slice().reverse().map(index => loopPoints[index].clone()) : null;
    }

    function updateHeatWallDebugUI(loopPoints) {
      if (!loopPoints || !Array.isArray(loopPoints) || !loopPoints.length) {
        heatWallDebugInfo.textContent = 'loop: -';
        return;
      }
      const maxIndex = loopPoints.length - 1;
      [heatWallIndex3Input, heatWallIndex2Input, heatWallIndex1Input].forEach(input => {
        input.min = '0';
        input.max = String(maxIndex);
      });
      heatWallDebugInfo.textContent = `loop: 0-${maxIndex}`;
    }

    function rebuildHeatWallFromDebugSelection() {
      const ctx = state.assetRefs.heatWallBuildContext;
      if (!ctx?.loopPoints?.length || !ctx.heatU || !ctx.islandModel || !ctx.primaryIslandGroup) return;

      const heatPath = buildHeatWallSpanFromIndices(
        ctx.loopPoints,
        heatWallIndex3Input.value,
        heatWallIndex2Input.value,
        heatWallIndex1Input.value
      );

      const heatOptions = {
        THREE: ctx.THREE,
        width: 8.6,
        height: 3.4,
        scaleZ: 1,
        thickness: 0,
        slitCount: 9,
        slitWidth: 0.2,
        colorLow: 0x61b3ff,
        colorMid: 0xffffff,
        colorHigh: 0xff6633,
        toonBands: 11,
        colorMidPoint: Number.parseFloat(heatWallMidPointInput.value) || 0.5,
        colorLowPower: Number.parseFloat(heatWallLowPowerInput.value) || 0.86,
        colorHighPower: Number.parseFloat(heatWallHighPowerInput.value) || 0.9,
        name: 'HeatWall'
      };

      if (heatPath && heatPath.length >= 2) {
        heatOptions.pathPoints = resamplePolyline(heatPath, ctx.heatU.length + 1);
        heatOptions.pathNormalSign = 1;
      } else {
        heatOptions.curveAngleDeg = -78;
      }

      const heatWall = createHeatWallMesh(
        ctx.heatU,
        { ...ctx.heatParams, ...ctx.heatMeta },
        heatOptions
      );

      if (state.assetRefs.heatWall?.parent) {
        state.assetRefs.heatWall.parent.remove(state.assetRefs.heatWall);
      }

      if (heatPath && heatPath.length >= 2) {
        heatWall.position.set(0, 0, 0);
        heatWall.rotation.set(0, 0, 0);
        ctx.islandModel.add(heatWall);
      } else {
        heatWall.position.set(-3.1, 0, -0.2);
        heatWall.rotation.y = Math.PI / 2;
        ctx.primaryIslandGroup.add(heatWall);
      }

      state.assetRefs.heatWall = heatWall;
      autoConsoleLog('[HeatWallManualSelection]', {
        index3: Number.parseInt(heatWallIndex3Input.value, 10),
        index2: Number.parseInt(heatWallIndex2Input.value, 10),
        index1: Number.parseInt(heatWallIndex1Input.value, 10),
        colorMidPoint: Number.parseFloat(heatWallMidPointInput.value),
        colorLowPower: Number.parseFloat(heatWallLowPowerInput.value),
        colorHighPower: Number.parseFloat(heatWallHighPowerInput.value),
        pathPoints: heatPath ? heatPath.length : 0
      });
    }

    function resamplePolyline(points, sampleCount) {
      const { THREE } = state;
      if (!THREE) return null;
      if (!Array.isArray(points) || points.length < 2) return null;
      const count = Math.max(2, Math.floor(sampleCount || points.length));
      const cumulative = [0];
      for (let i = 1; i < points.length; i += 1) {
        cumulative.push(cumulative[i - 1] + points[i - 1].distanceTo(points[i]));
      }
      const total = cumulative[cumulative.length - 1];
      if (total <= 1e-6) return points.map(point => point.clone());

      const result = [];
      let segment = 0;
      for (let i = 0; i < count; i += 1) {
        const target = (total * i) / (count - 1);
        while (segment < cumulative.length - 2 && cumulative[segment + 1] < target) {
          segment += 1;
        }
        const start = points[segment];
        const end = points[segment + 1];
        const span = Math.max(cumulative[segment + 1] - cumulative[segment], 1e-8);
        const t = THREE.MathUtils.clamp((target - cumulative[segment]) / span, 0, 1);
        result.push(start.clone().lerp(end, t));
      }
      return result;
    }

    function createCrtScreenProxyPlane(screenMesh) {
      const { THREE } = state;
      if (!THREE || !screenMesh?.isMesh) return null;
      const geometry = screenMesh.geometry;
      const positions = geometry?.attributes?.position;
      if (!positions || positions.count < 3) return null;

      const solve3x3 = (m, b) => {
        const [
          m11, m12, m13,
          m21, m22, m23,
          m31, m32, m33
        ] = m;
        const det =
          m11 * (m22 * m33 - m23 * m32) -
          m12 * (m21 * m33 - m23 * m31) +
          m13 * (m21 * m32 - m22 * m31);
        if (Math.abs(det) < 1e-12) return null;
        const invDet = 1 / det;
        const i11 = (m22 * m33 - m23 * m32) * invDet;
        const i12 = (m13 * m32 - m12 * m33) * invDet;
        const i13 = (m12 * m23 - m13 * m22) * invDet;
        const i21 = (m23 * m31 - m21 * m33) * invDet;
        const i22 = (m11 * m33 - m13 * m31) * invDet;
        const i23 = (m13 * m21 - m11 * m23) * invDet;
        const i31 = (m21 * m32 - m22 * m31) * invDet;
        const i32 = (m12 * m31 - m11 * m32) * invDet;
        const i33 = (m11 * m22 - m12 * m21) * invDet;
        return new THREE.Vector3(
          i11 * b.x + i12 * b.y + i13 * b.z,
          i21 * b.x + i22 * b.y + i23 * b.z,
          i31 * b.x + i32 * b.y + i33 * b.z
        );
      };

      const createProxyPlane = (center, rightVector, upVector, label) => {
        const right = rightVector.clone();
        const up = upVector.clone();
        const width = right.length();
        const height = up.length();
        if (width < 1e-4 || height < 1e-4) return null;
        right.multiplyScalar(1 / width);
        up.multiplyScalar(1 / height);
        const front = new THREE.Vector3().crossVectors(right, up).normalize();
        if (front.lengthSq() < 1e-6) return null;

        if (state.camera) {
          const cameraLocal = screenMesh.worldToLocal(state.camera.position.clone());
          const toCamera = cameraLocal.sub(center);
          if (toCamera.dot(front) < 0) {
            front.multiplyScalar(-1);
            right.multiplyScalar(-1);
          }
        }

        // Keep orthonormal basis after possible axis flips.
        up.copy(new THREE.Vector3().crossVectors(front, right).normalize());
        const offset = Math.max(width, height) * 0.01;
        const planeCenter = center.clone().addScaledVector(front, offset);
        const planeGeo = new THREE.PlaneGeometry(width, height);
        const planeMat = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          roughness: 0.3,
          metalness: 0,
          side: THREE.DoubleSide
        });
        planeMat.polygonOffset = true;
        planeMat.polygonOffsetFactor = -1;
        planeMat.polygonOffsetUnits = -1;

        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.name = 'CRTTV_ScreenProxy';
        plane.position.copy(planeCenter);
        const basis = new THREE.Matrix4().makeBasis(right, up, front);
        plane.quaternion.setFromRotationMatrix(basis);
        plane.renderOrder = 20;
        plane.userData.crtPointerFlipY = false;

        screenMesh.add(plane);
        state.assetRefs.crtScreenPlane = plane;

        const hideScreenSourceMaterial = material => {
          if (!material) return;
          if ('map' in material) material.map = null;
          if ('emissiveMap' in material) material.emissiveMap = null;
          if ('color' in material && material.color) material.color.set(0x000000);
          if ('emissive' in material && material.emissive) material.emissive.set(0x000000);
          if ('transparent' in material) material.transparent = true;
          if ('opacity' in material) material.opacity = 0;
          if ('depthWrite' in material) material.depthWrite = false;
          if ('depthTest' in material) material.depthTest = false;
          material.needsUpdate = true;
        };
        if (Array.isArray(screenMesh.material)) {
          screenMesh.material.forEach(hideScreenSourceMaterial);
        } else {
          hideScreenSourceMaterial(screenMesh.material);
        }
        screenMesh.castShadow = false;
        screenMesh.receiveShadow = false;

        autoConsoleLog('[CRT] using proxy screen plane', {
          mode: label,
          width: Number(width.toFixed(3)),
          height: Number(height.toFixed(3))
        });
        return plane;
      };

      const uvAttr = geometry.attributes?.uv;
      if (uvAttr && uvAttr.count === positions.count) {
        let sumUU = 0;
        let sumUV = 0;
        let sumU = 0;
        let sumVV = 0;
        let sumV = 0;
        let sumX = 0;
        let sumY = 0;
        let sumZ = 0;
        let sumUX = 0;
        let sumUY = 0;
        let sumUZ = 0;
        let sumVX = 0;
        let sumVY = 0;
        let sumVZ = 0;
        let minU = Infinity;
        let maxU = -Infinity;
        let minV = Infinity;
        let maxV = -Infinity;
        const pos = new THREE.Vector3();
        const n = uvAttr.count;

        for (let i = 0; i < n; i += 1) {
          const u = uvAttr.getX(i);
          const v = uvAttr.getY(i);
          pos.fromBufferAttribute(positions, i);
          sumUU += u * u;
          sumUV += u * v;
          sumU += u;
          sumVV += v * v;
          sumV += v;
          sumX += pos.x;
          sumY += pos.y;
          sumZ += pos.z;
          sumUX += u * pos.x;
          sumUY += u * pos.y;
          sumUZ += u * pos.z;
          sumVX += v * pos.x;
          sumVY += v * pos.y;
          sumVZ += v * pos.z;
          if (u < minU) minU = u;
          if (u > maxU) maxU = u;
          if (v < minV) minV = v;
          if (v > maxV) maxV = v;
        }

        const m = [
          sumUU, sumUV, sumU,
          sumUV, sumVV, sumV,
          sumU, sumV, n
        ];
        const coeffX = solve3x3(m, new THREE.Vector3(sumUX, sumVX, sumX));
        const coeffY = solve3x3(m, new THREE.Vector3(sumUY, sumVY, sumY));
        const coeffZ = solve3x3(m, new THREE.Vector3(sumUZ, sumVZ, sumZ));

        if (coeffX && coeffY && coeffZ) {
          const sample = (u, v) => new THREE.Vector3(
            coeffX.x * u + coeffX.y * v + coeffX.z,
            coeffY.x * u + coeffY.y * v + coeffY.z,
            coeffZ.x * u + coeffZ.y * v + coeffZ.z
          );
          const uMid = (minU + maxU) * 0.5;
          const vMid = (minV + maxV) * 0.5;
          const center = sample(uMid, vMid);
          const rightVector = sample(maxU, vMid).sub(sample(minU, vMid));
          const upVector = sample(uMid, maxV).sub(sample(uMid, minV));
          const proxy = createProxyPlane(center, rightVector, upVector, 'uv-fit');
          if (proxy) return proxy;
        }
      }

      const getIndex = (() => {
        const indexAttr = geometry.index;
        if (!indexAttr) return i => i;
        return i => indexAttr.getX(i);
      })();
      const triCount = geometry.index ? geometry.index.count : positions.count;
      const a = new THREE.Vector3();
      const b = new THREE.Vector3();
      const c = new THREE.Vector3();
      const ab = new THREE.Vector3();
      const ac = new THREE.Vector3();
      const triNormal = new THREE.Vector3();
      const front = new THREE.Vector3();

      for (let i = 0; i <= triCount - 3; i += 3) {
        a.fromBufferAttribute(positions, getIndex(i));
        b.fromBufferAttribute(positions, getIndex(i + 1));
        c.fromBufferAttribute(positions, getIndex(i + 2));
        ab.subVectors(b, a);
        ac.subVectors(c, a);
        triNormal.crossVectors(ab, ac);
        const area2 = triNormal.length();
        if (area2 <= 1e-8) continue;
        triNormal.multiplyScalar(1 / area2);
        front.addScaledVector(triNormal, area2);
      }

      if (front.lengthSq() < 1e-7) return null;
      front.normalize();
      const upHint = Math.abs(front.y) > 0.92 ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0);
      const right = new THREE.Vector3().crossVectors(upHint, front).normalize();
      const up = new THREE.Vector3().crossVectors(front, right).normalize();
      const pos = new THREE.Vector3();

      let minU = Infinity;
      let maxU = -Infinity;
      let minV = Infinity;
      let maxV = -Infinity;
      let maxW = -Infinity;
      for (let i = 0; i < positions.count; i += 1) {
        pos.fromBufferAttribute(positions, i);
        const u = pos.dot(right);
        const v = pos.dot(up);
        const w = pos.dot(front);
        if (u < minU) minU = u;
        if (u > maxU) maxU = u;
        if (v < minV) minV = v;
        if (v > maxV) maxV = v;
        if (w > maxW) maxW = w;
      }

      const center = new THREE.Vector3()
        .addScaledVector(right, (minU + maxU) * 0.5)
        .addScaledVector(up, (minV + maxV) * 0.5)
        .addScaledVector(front, maxW);
      const rightVector = right.multiplyScalar(maxU - minU);
      const upVector = up.multiplyScalar(maxV - minV);
      return createProxyPlane(center, rightVector, upVector, 'projection-fallback');
    }

    function shouldUseCrtScreenProxy(screenMesh) {
      if (!screenMesh?.isMesh) return false;
      const geometry = screenMesh.geometry;
      const positions = geometry?.attributes?.position;
      if (!positions || positions.count < 3) return false;

      const { THREE } = state;
      if (!THREE) return true;

      const center = new THREE.Vector3();
      const point = new THREE.Vector3();
      for (let i = 0; i < positions.count; i += 1) {
        point.fromBufferAttribute(positions, i);
        center.add(point);
      }
      center.multiplyScalar(1 / positions.count);

      const normalAttr = geometry.attributes?.normal;
      const front = new THREE.Vector3();
      if (normalAttr && normalAttr.count === positions.count) {
        for (let i = 0; i < normalAttr.count; i += 1) {
          point.fromBufferAttribute(normalAttr, i);
          if (point.lengthSq() > 1e-8) {
            front.add(point.normalize());
          }
        }
      }

      if (front.lengthSq() < 1e-8) {
        // Unknown orientation: keep proxy path for safer fallback.
        return true;
      }
      front.normalize();

      let minDepth = Infinity;
      let maxDepth = -Infinity;
      const bounds = new THREE.Box3().setFromBufferAttribute(positions);
      const boundsSize = bounds.getSize(new THREE.Vector3());
      const maxDim = Math.max(boundsSize.x, boundsSize.y, boundsSize.z, 1e-5);
      for (let i = 0; i < positions.count; i += 1) {
        point.fromBufferAttribute(positions, i);
        const depth = point.sub(center).dot(front);
        if (depth < minDepth) minDepth = depth;
        if (depth > maxDepth) maxDepth = depth;
      }

      const depthRatio = (maxDepth - minDepth) / maxDim;
      return depthRatio > 0.06;
    }

    function applyCrtUvMapping(texture, uvRect, { rotate180 = false } = {}) {
      if (!texture) return;
      texture.flipY = false;
      texture.wrapS = state.THREE.RepeatWrapping;
      texture.wrapT = state.THREE.RepeatWrapping;
      if (uvRect && !uvRect.isFullRange) {
        texture.repeat.set(1 / uvRect.rangeU, 1 / uvRect.rangeV);
        texture.offset.set(-uvRect.minU / uvRect.rangeU, -uvRect.minV / uvRect.rangeV);
      } else {
        texture.repeat.set(1, 1);
        texture.offset.set(0, 0);
      }
      if (rotate180) {
        texture.repeat.set(-texture.repeat.x, -texture.repeat.y);
        texture.offset.set(1 - texture.offset.x, 1 - texture.offset.y);
      }
      texture.needsUpdate = true;
    }

    function setupCrtScreenTexture(screenMesh) {
      if (!screenMesh) return;
      if (state.assetRefs.crtIframe) return;
      const { THREE } = state;
      if (!THREE) return;
      const uvRect = screenMesh.userData?.crtUvRect || null;
      const rotate180 = screenMesh.userData?.crtRotate180 === true;
      const syncCrtRuntimeState = () => {
        const iframe = state.assetRefs.crtIframe;
        if (!iframe?.contentWindow) return;
        const paused = document.visibilityState !== 'visible' || state.assetRefs.focusMode !== 'crt';
        if (state.assetRefs.crtRuntimePaused === paused) return;
        state.assetRefs.crtRuntimePaused = paused;
        iframe.contentWindow.postMessage({ type: 'crt-runtime', paused }, '*');
      };

      const placeholderCanvas = document.createElement('canvas');
      placeholderCanvas.width = 512;
      placeholderCanvas.height = 512;
      const placeholderCtx = placeholderCanvas.getContext('2d');
      placeholderCtx.fillStyle = '#081225';
      placeholderCtx.fillRect(0, 0, placeholderCanvas.width, placeholderCanvas.height);
      placeholderCtx.fillStyle = '#cfe3ff';
      placeholderCtx.font = 'bold 38px system-ui, sans-serif';
      placeholderCtx.textAlign = 'center';
      placeholderCtx.textBaseline = 'middle';
      placeholderCtx.fillText('CRT DEMO', placeholderCanvas.width / 2, placeholderCanvas.height / 2);
      const placeholderTex = new THREE.CanvasTexture(placeholderCanvas);
      placeholderTex.colorSpace = THREE.SRGBColorSpace;
      applyCrtUvMapping(placeholderTex, uvRect, { rotate180 });

      const applyTextureToScreen = texture => {
        const createUnlitScreenMaterial = material => {
          const unlit = new THREE.MeshBasicMaterial({
            map: texture,
            color: 0xffffff,
            transparent: Boolean(material?.transparent),
            opacity: Number.isFinite(material?.opacity) ? material.opacity : 1,
            alphaTest: Number.isFinite(material?.alphaTest) ? material.alphaTest : 0,
            side: THREE.DoubleSide,
            depthWrite: material?.depthWrite ?? true,
            depthTest: material?.depthTest ?? true,
            fog: false,
            toneMapped: false
          });
          if ('blending' in unlit && material?.blending != null) {
            unlit.blending = material.blending;
          }
          return unlit;
        };

        const applyToMaterial = (material, index = 0) => {
          if (!material) return;
          let nextMaterial = null;
          if (Array.isArray(screenMesh.userData.crtUnlitMaterials)) {
            nextMaterial = screenMesh.userData.crtUnlitMaterials[index] || null;
          } else {
            nextMaterial = screenMesh.userData.crtUnlitMaterial || null;
          }

          if (!nextMaterial) {
            nextMaterial = createUnlitScreenMaterial(material);
            if (Array.isArray(screenMesh.material)) {
              const cached = Array.isArray(screenMesh.userData.crtUnlitMaterials)
                ? screenMesh.userData.crtUnlitMaterials.slice()
                : screenMesh.material.map(source => createUnlitScreenMaterial(source));
              cached[index] = nextMaterial;
              screenMesh.userData.crtUnlitMaterials = cached;
              screenMesh.material = cached;
            } else {
              screenMesh.userData.crtUnlitMaterial = nextMaterial;
              screenMesh.material = nextMaterial;
            }
          }

          nextMaterial.map = texture;
          nextMaterial.color.set(0xffffff);
          nextMaterial.side = THREE.DoubleSide;
          nextMaterial.toneMapped = false;
          nextMaterial.fog = false;
          nextMaterial.needsUpdate = true;
        };
        if (Array.isArray(screenMesh.material)) {
          screenMesh.material.forEach((material, index) => applyToMaterial(material, index));
        } else {
          applyToMaterial(screenMesh.material);
        }
      };

      applyTextureToScreen(placeholderTex);

      const frame = document.createElement('iframe');
      frame.src = '/research/crt-demo/index.html';
      frame.title = 'CRT Demo';
      frame.style.position = 'fixed';
      frame.style.left = '-9999px';
      frame.style.top = '-9999px';
      frame.style.width = '900px';
      frame.style.height = '700px';
      frame.style.border = '0';
      frame.style.opacity = '0';
      frame.style.pointerEvents = 'none';
      frame.setAttribute('aria-hidden', 'true');
      document.body.appendChild(frame);
      state.assetRefs.crtIframe = frame;
      state.assetRefs.syncCrtRuntimeState = syncCrtRuntimeState;
      state.assetRefs.crtRuntimePaused = true;

      const attachTexture = () => {
        const doc = frame.contentDocument;
        if (!doc) return false;
        const canvas = doc.getElementById('crt-canvas');
        if (!canvas || canvas.width === 0 || canvas.height === 0) return false;

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        applyCrtUvMapping(texture, uvRect, { rotate180 });
        applyTextureToScreen(texture);

        state.assetRefs.crtCanvas = canvas;
        state.assetRefs.crtTexture = texture;

        if (!state.assetRefs.crtTextureUpdater) {
          let lastCrtTextureUpload = 0;
          const updateCrtTexture = ({ elapsed = 0 }) => {
            const crtTexture = state.assetRefs.crtTexture;
            if (!crtTexture) return;
            if (state.assetRefs.crtRuntimePaused) return;
            const focused = state.assetRefs.focusMode === 'crt';
            const interval = focused ? (1 / 60) : (1 / 15);
            if (elapsed - lastCrtTextureUpload < interval) return;
            lastCrtTextureUpload = elapsed;
            crtTexture.needsUpdate = true;
          };
          updateCrtTexture.__tag = 'CRTTextureUpload';
          state.assetRefs.crtTextureUpdater = registerUpdater(updateCrtTexture, {
            tag: 'CRTTextureUpload',
            isActive: () => Boolean(state.assetRefs.crtTexture && !state.assetRefs.crtRuntimePaused)
          });
        }
        return true;
      };

      frame.addEventListener('load', () => {
        let tries = 0;
        const tryAttach = () => {
          tries += 1;
          if (attachTexture()) {
            syncCrtRuntimeState();
            autoConsoleLog('[CRT] attached iframe canvas texture');
            return;
          }
          if (tries > 120) {
            autoConsoleWarn('[CRT] failed to attach iframe canvas texture');
            return;
          }
          requestAnimationFrame(tryAttach);
        };
        tryAttach();
      });
      document.addEventListener('visibilitychange', syncCrtRuntimeState);
    }

    function forwardCrtPointer(kind, event, hit) {
      const { THREE } = state;
      if (!THREE) return;
      const iframe = state.assetRefs.crtIframe;
      if (!iframe?.contentWindow || !hit?.uv) return;
      const uv = hit.uv;
      const uvRect = hit?.object?.userData?.crtUvRect || state.assetRefs.crtInteractiveMesh?.userData?.crtUvRect || null;
      const rangeU = uvRect ? Math.max(uvRect.rangeU, 1e-5) : 1;
      const rangeV = uvRect ? Math.max(uvRect.rangeV, 1e-5) : 1;
      const mappedU = uvRect ? (uv.x - uvRect.minU) / rangeU : uv.x;
      const mappedV = uvRect ? (uv.y - uvRect.minV) / rangeV : uv.y;
      const x = THREE.MathUtils.clamp(mappedU, 0, 1);
      const y = THREE.MathUtils.clamp(mappedV, 0, 1);
      const flipY = hit?.object?.userData?.crtPointerFlipY
        ?? state.assetRefs.crtInteractiveMesh?.userData?.crtPointerFlipY
        ?? true;
      const rotate180 = hit?.object?.userData?.crtPointerRotate180
        ?? state.assetRefs.crtInteractiveMesh?.userData?.crtPointerRotate180
        ?? false;
      let outX = x;
      let outY = THREE.MathUtils.clamp(flipY ? (1 - y) : y, 0, 1);
      if (rotate180) {
        outX = 1 - outX;
        outY = 1 - outY;
      }
      iframe.contentWindow.postMessage(
        {
          type: 'crt-pointer',
          kind,
          x: THREE.MathUtils.clamp(outX, 0, 1),
          y: THREE.MathUtils.clamp(outY, 0, 1),
          button: event?.button ?? 0,
          buttons: event?.buttons ?? 0,
          pointerId: event?.pointerId ?? 1,
          pointerType: event?.pointerType || 'mouse',
          deltaY: event?.deltaY ?? 0
        },
        '*'
      );
    }

    function buildPerfReport() {

      const now = new Date();

          toneMappingExposure: renderer.toneMappingExposure
        } : null,

        },
