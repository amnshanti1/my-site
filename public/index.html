    document.body.appendChild(skyToggleButton);

    const state = {
      THREE: null,
      renderer: null,
      scene: null,
      camera: null,
      stage: null,
      islands: [],
      interactives: [],
      updaters: [],
      assetRefs: {},
      pointer: { x: 0, y: 0 },
      pointerTarget: { x: 0, y: 0 },
      pointerActive: false,
      scroll: { target: 0, current: 0 },
      hovered: null,
      clock: null,
      ImprovedNoise: null,
      sharedMaterials: {},
      aim120Launch: null,
      qf01Maneuver: null,
      qf01PitchPending: null,
      profiler: null
    };
    window.__STATE__ = state;
    window.dumpUpdaters = () => {
      const arr = window.__STATE__?.updaters || [];
      console.log('[dumpUpdaters]', {
        count: arr.length,
        names: arr.map(fn => fn?.name || fn?.__tag || 'anon')
      });
    };

    const FPS_DIAG = {
      enabled: true,
      sampleIntervalMs: 2000,
      lastLogMs: performance.now(),
      frameCount: 0,
      fps: 0,
      lastT: performance.now()
    };

    window.__FPS_DIAG = FPS_DIAG;

    const updaterProfiler = {
      enabled: true,
      sampleIntervalMs: 1000,
      lastSampleMs: performance.now(),
      entries: new Map(),
      logToConsole: true
    };
    state.profiler = updaterProfiler;

    function collectUpdaterStats() {
      const rows = [];
      updaterProfiler.entries.forEach(entry => {
        if (entry.count === 0) return;
        const avg = entry.total / entry.count;
        rows.push({ name: entry.name, avgMs: Number(avg.toFixed(3)), maxMs: Number(entry.max.toFixed(3)) });
      });
      rows.sort((a, b) => b.avgMs - a.avgMs);
      return rows;
    }

    function setSkyPreset(name) {
      const preset = SKY_PRESETS[name] || SKY_PRESETS.sunset;
      const { THREE, renderer } = state;
      const sky = state.assetRefs.sky;
      if (!preset || !THREE || !renderer || !sky) return;

      const uniforms = sky.material.uniforms;
      uniforms.turbidity.value = preset.turbidity;
      uniforms.rayleigh.value = preset.rayleigh;
      uniforms.mieCoefficient.value = preset.mieCoefficient;
      uniforms.mieDirectionalG.value = preset.mieDirectionalG;

      const sunBase = state.assetRefs.sunBase || new THREE.Vector3();
      if (preset.direction) {
        if (Array.isArray(preset.direction)) {
          sunBase.set(preset.direction[0], preset.direction[1], preset.direction[2]);
        } else {
          sunBase.copy(preset.direction);
        }
        sunBase.normalize();
      } else {
        const phi = THREE.MathUtils.degToRad(90 - preset.elevation);
        const theta = THREE.MathUtils.degToRad(preset.azimuth);
        sunBase.setFromSphericalCoords(1, phi, theta);
      }
      uniforms.sunPosition.value.copy(sunBase);
      renderer.toneMappingExposure = preset.exposure;

      state.assetRefs.sun = uniforms.sunPosition.value;
      state.assetRefs.sunBase = sunBase;
      state.assetRefs.skyPreset = name;
      skyToggleButton.textContent = `Sky: ${name.charAt(0).toUpperCase()}${name.slice(1)}`;
    }

    function updateSkyYawFromCamera() {
      const { THREE, camera } = state;
      const sky = state.assetRefs.sky;
      if (!THREE || !camera || !sky) return;

      const forward = state.assetRefs.skyForward || (state.assetRefs.skyForward = new THREE.Vector3());
      forward.set(0, 0, -1).applyQuaternion(camera.quaternion);
      forward.y = 0;
      if (forward.lengthSq() < 1e-6) return;
      forward.normalize();

      const yaw = Math.atan2(forward.x, forward.z);
      sky.rotation.set(0, yaw, 0);
      sky.position.copy(camera.position);

      if (DEBUG_HELPERS_VISIBLE) {
        const debug = state.assetRefs.skyDebug || (state.assetRefs.skyDebug = { lastLog: 0 });
        const now = performance.now();
        if (now - debug.lastLog > 2500) {
          debug.lastLog = now;
          const sunUniform = state.assetRefs.sun;
          console.log('[sky-debug]', {
            sunY: Number(sunUniform?.y?.toFixed?.(4) ?? 0),
            skyRotX: Number(sky.rotation.x.toFixed(4))
          });
        }
      }
    }

    function toggleSkyPreset() {
      const current = state.assetRefs.skyPreset || SKY_PRESET_ORDER[0];
      const idx = SKY_PRESET_ORDER.indexOf(current);
      const next = SKY_PRESET_ORDER[(idx + 1) % SKY_PRESET_ORDER.length];
      setSkyPreset(next);
    }

    function buildPerfReport() {
      const renderer = state.renderer;
      const info = renderer?.info;
      const memory = info?.memory || {};
      const render = info?.render || {};
      const now = new Date();
      return {
        timestamp: now.toISOString(),
        userAgent: navigator.userAgent,
        hardware: {
          deviceMemoryGB: navigator.deviceMemory || null,
          cores: navigator.hardwareConcurrency || null
        },
        renderer: renderer ? {
          pixelRatio: renderer.getPixelRatio?.(),
          outputColorSpace: renderer.outputColorSpace,
          toneMapping: renderer.toneMapping,
          toneMappingExposure: renderer.toneMappingExposure
        } : null,
        memory: {
          geometries: memory.geometries,
          textures: memory.textures
        },
        render: {
          calls: render.calls,
          triangles: render.triangles,
          points: render.points,
          lines: render.lines
        },
        updaters: {
          count: state.updaters.length,
          top: collectUpdaterStats().slice(0, 12)
        }
      };
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'F3') {
        FPS_DIAG.enabled = !FPS_DIAG.enabled;
        console.log('[fps_diag] enabled:', FPS_DIAG.enabled);
      }
      if (e.key === 'F4') {
        updaterProfiler.enabled = !updaterProfiler.enabled;
        profilerOverlay.style.display = updaterProfiler.enabled ? 'block' : 'none';
        console.log('[profiler] enabled:', updaterProfiler.enabled);
      }
      if (e.key === 'F5') {
        updaterProfiler.logToConsole = !updaterProfiler.logToConsole;
        console.log('[profiler] console logs:', updaterProfiler.logToConsole);
      }
    });

    perfDumpButton.addEventListener('click', () => {
      const report = buildPerfReport();
      console.log('[perf-report]', report);
      try {
        const serialized = JSON.stringify(report, null, 2);
        navigator.clipboard?.writeText?.(serialized).then(() => {
          perfDumpButton.textContent = 'Perf Report Copied';
          setTimeout(() => {
            perfDumpButton.textContent = 'Dump Perf Report';
          }, 1400);
        }).catch(() => {
          perfDumpButton.textContent = 'Perf Report Logged';
          setTimeout(() => {
            perfDumpButton.textContent = 'Dump Perf Report';
          }, 1400);
        });
      } catch (err) {
        console.warn('Failed to serialize perf report', err);
      }
    });

    skyToggleButton.addEventListener('click', toggleSkyPreset);

    function tickFpsDiag(now = performance.now()) {
      if (!FPS_DIAG.enabled) return;

      FPS_DIAG.frameCount += 1;

      const dt = now - FPS_DIAG.lastT;

      if (dt > 3000) {
        FPS_DIAG.lastT = now;
        FPS_DIAG.lastLogMs = now;
        FPS_DIAG.frameCount = 0;
        return;
      }

      const sinceLog = now - FPS_DIAG.lastLogMs;
      if (sinceLog >= FPS_DIAG.sampleIntervalMs) {
        const fps = (FPS_DIAG.frameCount * 1000) / Math.max(sinceLog, 1);
        FPS_DIAG.fps = fps;

        FPS_DIAG.frameCount = 0;
        FPS_DIAG.lastLogMs = now;

        const hoveredName = state.hovered?.name || null;
        const calls = state.renderer?.info?.render?.calls ?? 0;
        const tris = state.renderer?.info?.render?.triangles ?? 0;

        console.log('[fps]', {
          fps: Number(fps.toFixed(1)),
          t: Number(now.toFixed(1)),
          hovered: hoveredName,
          updaters: state.updaters.length,
          calls,
          triangles: tris
        });
        console.log('gfx', {
          dpr: window.devicePixelRatio,
          pixelRatio: state.renderer?.getPixelRatio?.(),
          buf: state.renderer?.getContext?.().drawingBufferWidth + 'x' + state.renderer?.getContext?.().drawingBufferHeight,
          canvas: state.renderer?.domElement?.width + 'x' + state.renderer?.domElement?.height
        });
      }
    }

    function registerUpdater(callback) {
      if (typeof callback !== 'function') {
        return () => {};
      }
      state.updaters.push(callback);
      return () => {
        const index = state.updaters.indexOf(callback);
        if (index >= 0) {
          state.updaters.splice(index, 1);
        }
      };
    }

    const DEBUG_HELPERS_VISIBLE = true;
    const ISLAND_SPOTLIGHT_INTENSITY = 100;
    const jetscale =0.12;
    const labelCache = new Map();
    const QF01_RAW_BOUNDS = {
      min: [-5.0528846, -1.777488, -6.2814317],
      max: [5.0528846, 1.7774872, 6.2814302]
    };
    const AIM_QF01_SYNC_DURATION = 2.8;
    const QF01_PITCH_DELAY = 0.2;
    const QF01_MANEUVER_DURATION = Math.max(AIM_QF01_SYNC_DURATION - QF01_PITCH_DELAY, 0.6);
    const AIM120_EXPLOSION_TRIGGER = 0.72;
    const AIM120_RESET_DELAY = 3.1;

    function getLaunchMotionFactor() {
      if (!isIslandAnimationActive('island:east')) return 0;
      const launch = state.aim120Launch;
      if (!launch) return 1;
      if (launch.completed) return 0;
      if (launch.active) {
        const duration = Math.max(launch.duration || AIM_QF01_SYNC_DURATION, 0.001);
        const t = Math.min(launch.timer / duration, 1);
        return Math.pow(Math.max(1 - t, 0), 2);
      }
      return typeof launch.motionFactor === 'number' ? launch.motionFactor : 1;
    }

    function ensureCameraAnimator() {
      if (state.assetRefs.cameraAnimator) return;
      state.assetRefs.cameraAnimator = registerUpdater(({ delta = 0 }) => {
        const move = state.assetRefs.cameraMove;
        if (!move?.active || !state.camera) return;
        move.timer += delta;
        const t = Math.min(move.timer / move.duration, 1);
        const eased = easeOutCubic(t);
        state.camera.position.copy(move.fromPosition).lerp(move.toPosition, eased);
        state.camera.quaternion.copy(move.fromQuaternion).slerp(move.toQuaternion, eased);
        if (t >= 1) {
          move.active = false;
          state.assetRefs.cameraFocus = move.focus || null;
        }
      });
    }

    function startCameraMove({ position, quaternion, duration = 1.2, focus = null }) {
      if (!state.camera || !position || !quaternion) return;
      ensureCameraAnimator();
      state.assetRefs.cameraMove = {
        active: true,
        timer: 0,
        duration: Math.max(duration, 0.001),
        fromPosition: state.camera.position.clone(),
        toPosition: position.clone(),
        fromQuaternion: state.camera.quaternion.clone(),
        toQuaternion: quaternion.clone(),
        focus
      };
      state.assetRefs.cameraFocus = focus;
    }

    function disposeExplosionMesh(mesh) {
      if (!mesh) return;
      mesh.parent?.remove(mesh);
      mesh.geometry?.dispose?.();
      const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
      materials.forEach(mat => mat?.dispose?.());
    }

    function resetAimSequence() {
      const { THREE, assetRefs } = state;
      const explosion = assetRefs.aim120Explosion;
      if (explosion) {
        explosion.fragments?.forEach(fragment => {
          disposeExplosionMesh(fragment.mesh);
        });
        explosion.group?.parent?.remove(explosion.group);
        explosion.fragments = [];
      }
      assetRefs.aim120Explosion = null;

      const aim120Right = assetRefs.aim120Right || assetRefs.aim120;
      const aim120Left = assetRefs.aim120Left;
      const hardpointRight = assetRefs.aimHardpointRight || assetRefs.aimHardpoint;
      const hardpointLeft = assetRefs.aimHardpointLeft;

      assetRefs.qf01Settle = null;

      if (aim120Right) {
        aim120Right.visible = true;
        if (hardpointRight && aim120Right.parent !== hardpointRight) {
          hardpointRight.add(aim120Right);
        }
      }
      if (aim120Left && hardpointLeft && aim120Left.parent !== hardpointLeft) {
        hardpointLeft.add(aim120Left);
      }

      const baseRightOffset =
        assetRefs._aimRightOffset ||
        (assetRefs._aimRightOffset = THREE ? new THREE.Vector3(0.02, -0.02, -0.18) : null);
      const restRight = assetRefs._aimRestQuaternionRight;
      if (aim120Right) {
        if (baseRightOffset && aim120Right.position.copy) {
          aim120Right.position.copy(baseRightOffset);
        } else if (THREE) {
          aim120Right.position.set(0.02, -0.02, -0.18);
        }
        if (restRight) {
          aim120Right.quaternion.copy(restRight);
        }
        aim120Right.scale.set(1.5, 1.5, 1);
      }

      state.aim120Launch = null;

      const qf01 = assetRefs.qf01;
      const basePose = assetRefs.qf01BasePose;
      const last = assetRefs.qf01LastManeuver || {};
      state.qf01Maneuver = null;
      state.qf01PitchPending = null;
      if (qf01 && basePose) {
        const THREERef = state.THREE;
        const pitch = last.pitch ?? (THREERef ? THREERef.MathUtils.degToRad(-120) : -Math.PI / 1.5);
        const roll = last.roll ?? 0;
        const yaw = last.yaw ?? 0;
        const distance = last.distance ?? 2;
        const duration = last.duration ?? QF01_MANEUVER_DURATION;
        state.qf01Reset = {
          active: true,
          timer: 0,
          duration,
          pitch,
          roll,
          yaw,
          distance,
          basePosition: basePose.position.clone(),
          baseRotation: basePose.rotation.clone()
        };
      } else {
        state.qf01Reset = null;
      }

      Aim120.attachToJet();
    }

    function prepareAim120Fragments(root, { fragmentsPerMesh = 28 } = {}) {
      const { THREE } = state;
      if (!THREE || !root) return;
      const fragmentTemplates = [];
      const tempMatrix = new THREE.Matrix4();

      root.updateMatrixWorld(true);
      root.traverse(node => {
        if (!node.isMesh || !node.geometry) return;
        const baseGeometry = node.geometry.clone();
        node.updateWorldMatrix(false, false);
        tempMatrix.copy(node.matrix);
        baseGeometry.applyMatrix4(tempMatrix);

        const workingGeometry = baseGeometry.index ? baseGeometry.toNonIndexed() : baseGeometry;
        const positions = workingGeometry.getAttribute('position');
        const normals = workingGeometry.getAttribute('normal');
        const uvs = workingGeometry.getAttribute('uv');
        if (!positions) return;

        const fragmentBuckets = Array.from({ length: fragmentsPerMesh }, () => ({
          positions: [],
          normals: normals ? [] : null,
          uvs: uvs ? [] : null,
          centroid: new THREE.Vector3(),
          vertexCount: 0
        }));

        const triangleCount = positions.count / 3;
        for (let tri = 0; tri < triangleCount; tri += 1) {
          const bucketIndex = Math.floor(Math.random() * fragmentsPerMesh);
          const bucket = fragmentBuckets[bucketIndex];
          for (let v = 0; v < 3; v += 1) {
            const idx = tri * 3 + v;
            const px = positions.getX(idx);
            const py = positions.getY(idx);
            const pz = positions.getZ(idx);
            bucket.positions.push(px, py, pz);
            bucket.centroid.x += px;
            bucket.centroid.y += py;
            bucket.centroid.z += pz;
            bucket.vertexCount += 1;
            if (bucket.normals) {
              bucket.normals.push(normals.getX(idx), normals.getY(idx), normals.getZ(idx));
            }
            if (bucket.uvs) {
              bucket.uvs.push(uvs.getX(idx), uvs.getY(idx));
            }
          }
        }

        fragmentBuckets.forEach(bucket => {
          if (!bucket.vertexCount) return;
          const centroid = bucket.centroid.multiplyScalar(1 / bucket.vertexCount);
          for (let i = 0; i < bucket.positions.length; i += 3) {
            bucket.positions[i] -= centroid.x;
            bucket.positions[i + 1] -= centroid.y;
            bucket.positions[i + 2] -= centroid.z;
          }
          const fragmentGeometry = new THREE.BufferGeometry();
          fragmentGeometry.setAttribute('position', new THREE.Float32BufferAttribute(bucket.positions, 3));
          if (bucket.normals) {
            fragmentGeometry.setAttribute('normal', new THREE.Float32BufferAttribute(bucket.normals, 3));
          } else {
            fragmentGeometry.computeVertexNormals();
          }
          if (bucket.uvs) {
            fragmentGeometry.setAttribute('uv', new THREE.Float32BufferAttribute(bucket.uvs, 2));
          }
          fragmentGeometry.computeBoundingSphere();

          const createMaterialClone = material => {
            if (!material) return null;
            const clone = material.clone ? material.clone() : material;
            if (!clone.userData) clone.userData = {};
            clone.userData.baseOpacity = clone.opacity !== undefined ? clone.opacity : 1;
            clone.transparent = true;
            clone.depthWrite = false;
            return clone;
          };

          let fragmentMaterial;
          if (Array.isArray(node.material)) {
            fragmentMaterial = node.material.map(createMaterialClone);
          } else {
            fragmentMaterial = createMaterialClone(node.material);
          }

          const templateMesh = new THREE.Mesh(fragmentGeometry, fragmentMaterial);
          templateMesh.position.copy(centroid);
          templateMesh.quaternion.identity();
          templateMesh.scale.setScalar(1);
          templateMesh.castShadow = node.castShadow;
          templateMesh.receiveShadow = node.receiveShadow;
          fragmentTemplates.push(templateMesh);
        });
      });

      state.assetRefs.aim120FragmentTemplates = fragmentTemplates;

    function ensureAim120ExplosionUpdater() {
      if (state.assetRefs.aim120ExplosionUpdater) return;

    }

    function startAim120Explosion(aimMesh) {
      const { THREE } = state;
      const templates = state.assetRefs.aim120FragmentTemplates;
      if (!THREE || !aimMesh || !templates || !templates.length) return;
      const parent = aimMesh.parent;
      if (!parent) return;

      if (state.assetRefs.aim120Explosion?.group) {
        state.assetRefs.aim120Explosion.group.parent?.remove(state.assetRefs.aim120Explosion.group);
        state.assetRefs.aim120Explosion = null;
      }

      const explosionGroup = new THREE.Group();
      explosionGroup.name = 'Aim120ExplosionGroup';
      explosionGroup.position.copy(aimMesh.position);
      explosionGroup.quaternion.copy(aimMesh.quaternion);
      explosionGroup.scale.copy(aimMesh.scale);
      parent.add(explosionGroup);

      const explosion = {
        group: explosionGroup,
        fragments: [],
        timer: 0,
        duration: 4.2,
        active: true,
        finished: false,
        settleTimer: 0,
        delayAfter: AIM120_RESET_DELAY,
        resetTriggered: false
      };

      templates.forEach(template => {
        const fragment = template.clone();
        fragment.geometry = fragment.geometry.clone();
        if (Array.isArray(fragment.material)) {
          fragment.material = fragment.material.map(mat => (mat && mat.clone ? mat.clone() : mat));
        } else if (fragment.material && fragment.material.clone) {
          fragment.material = fragment.material.clone();
        }
        const materials = Array.isArray(fragment.material) ? fragment.material : [fragment.material];
        materials.forEach(mat => {
          if (!mat) return;
          if (!mat.userData) mat.userData = {};
          const baseOpacity = mat.userData.baseOpacity ?? (mat.opacity !== undefined ? mat.opacity : 1);
          mat.userData.baseOpacity = baseOpacity;
          mat.opacity = baseOpacity;
          mat.transparent = true;
          mat.depthWrite = false;
        });

        fragment.position.copy(template.position);
        fragment.quaternion.copy(template.quaternion);
        fragment.scale.copy(template.scale);
        fragment.castShadow = template.castShadow;
        fragment.receiveShadow = template.receiveShadow;

        explosion.fragments.push({
          mesh: fragment,
          origin: fragment.position.clone(),
          velocity: new THREE.Vector3(
            (Math.random() - 0.5) * 2.2,
            Math.random() * 1.6 + 0.2,
            (Math.random() - 0.5) * 2.2
          ),
          axis: new THREE.Vector3(
            Math.random() - 0.5,
            Math.random() + 0.2,
            Math.random() - 0.5
          ).normalize(),
          angularSpeed: THREE.MathUtils.degToRad(80 + Math.random() * 180),
          scaleBoost: 0.4 + Math.random() * 0.5,
          delay: Math.random() * 0.4,
          baseQuaternion: fragment.quaternion.clone(),
          tempQuat: new THREE.Quaternion()
        });
        explosionGroup.add(fragment);
      });

      state.assetRefs.aim120Explosion = explosion;
      ensureAim120ExplosionUpdater();
    }

    function updateAim120Explosion({ delta = 0 }) {
      if (!isIslandAnimationActive('island:east')) return;
      const { THREE } = state;
      const explosion = state.assetRefs.aim120Explosion;
      if (!THREE || !explosion) return;

      if (explosion.active) {
        explosion.timer += delta;
        const totalDuration = Math.max(explosion.duration, 0.001);
        const tempVec = state._tempVector3B || (state._tempVector3B = new THREE.Vector3());

        let anyActive = false;
        explosion.fragments?.forEach(fragment => {
          const mesh = fragment.mesh;
          if (!mesh?.parent) return;
          const timeSinceDelay = explosion.timer - fragment.delay;
          if (timeSinceDelay <= 0) {
            mesh.position.copy(fragment.origin);
            mesh.quaternion.copy(fragment.baseQuaternion);
            mesh.scale.setScalar(1);
            return;
          }

          const t = THREE.MathUtils.clamp(timeSinceDelay / (totalDuration - fragment.delay * 0.5), 0, 1);
          const eased = easeOutCubic(t);
          tempVec.copy(fragment.velocity).multiplyScalar(eased * 0.8);
          mesh.position.set(
            fragment.origin.x + tempVec.x,
            fragment.origin.y + tempVec.y,
            fragment.origin.z + tempVec.z
          );
          mesh.quaternion.copy(fragment.baseQuaternion);
          fragment.tempQuat.setFromAxisAngle(fragment.axis, fragment.angularSpeed * eased);
          mesh.quaternion.multiply(fragment.tempQuat);
          const scale = 1 + fragment.scaleBoost * eased * 0.6;
          mesh.scale.setScalar(scale);

          const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
          materials.forEach(mat => {
            if (!mat) return;
            const baseOpacity = mat.userData?.baseOpacity ?? 1;
            mat.opacity = baseOpacity * (1 - eased * 0.7);
          });

          if (t < 1) {
            anyActive = true;
          }
        });

        if (!anyActive || explosion.timer >= totalDuration) {
          explosion.active = false;
          explosion.finished = true;
          explosion.settleTimer = 0;
        }
      } else if (explosion.finished) {
        explosion.settleTimer = (explosion.settleTimer || 0) + delta;
        if (!explosion.resetTriggered && explosion.settleTimer >= (explosion.delayAfter ?? AIM120_RESET_DELAY)) {
          explosion.resetTriggered = true;
          Aim120.reset();
          return;
        }
      }
    }

    function completeAim120Launch({
      launch,

      stage,
      basePosition = null,
      baseQuaternion = null,

      if (!launch || !aim120Mesh) return;

      launch.active = false;
      launch.completed = true;
      launch.currentSpeed = 0;
      if (basePosition) {
        aim120Mesh.position.copy(basePosition);

      if (baseQuaternion) {
        aim120Mesh.quaternion.copy(baseQuaternion);
      }
      if (baseScale) {
        aim120Mesh.scale.copy(baseScale);
      }
      launch.finalPosition = aim120Mesh.position.clone();
      launch.finalQuaternion = aim120Mesh.quaternion.clone();
      launch.finalScale = aim120Mesh.scale.clone();
      launch.freezeParent = stage;
      launch.motionFactor = 0;
      if (!launch.explosionTriggered) {

    function createButtonLabel(text, {
      color = '#eaf2ff',
      fontSize = 56,
      fontWeight = 800,
      paddingX = 18,
      paddingY = 12,
      background = 'rgba(0,0,0,0.0)'
    } = {}) {
      const measureCanvas = document.createElement('canvas');
      const measureCtx = measureCanvas.getContext('2d');
      measureCtx.font = `${fontWeight} ${fontSize}px "Inter", system-ui, sans-serif`;
      const textWidth = Math.ceil(measureCtx.measureText(text).width);

      const width = Math.max(64, textWidth + paddingX * 2);
      const height = Math.max(48, fontSize + paddingY * 2);

      const canvasEl = document.createElement('canvas');
      canvasEl.width = width;
      canvasEl.height = height;

      const ctx = canvasEl.getContext('2d');
      ctx.clearRect(0, 0, width, height);

      if (background && background !== 'rgba(0,0,0,0.0)') {
        ctx.fillStyle = background;
        const r = Math.min(18, height / 2);
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.lineTo(width - r, 0);
        ctx.quadraticCurveTo(width, 0, width, r);
        ctx.lineTo(width, height - r);
        ctx.quadraticCurveTo(width, height, width - r, height);
        ctx.lineTo(r, height);
        ctx.quadraticCurveTo(0, height, 0, height - r);
        ctx.lineTo(0, r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.closePath();
        ctx.fill();
    }

  ctx.fillStyle = color;
  ctx.font = `${fontWeight} ${fontSize}px "Inter", system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, width / 2, height / 2);

  const texture = new state.THREE.CanvasTexture(canvasEl);
  texture.anisotropy = 4;
  texture.needsUpdate = true;

  const material = new state.THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthTest: false,
    depthWrite: false
  });

  const sprite = new state.THREE.Sprite(material);

  // tuned for your scene scale
  const scaleFactor = 0.0012;
  sprite.scale.set(width * scaleFactor, height * scaleFactor, 1);

  return sprite;
}

    function reparentPreserveWorld(object, newParent) {
      const { THREE } = state;
      if (!THREE || !object || !newParent) return;
      object.updateMatrixWorld(true);
      newParent.updateMatrixWorld(true);
      const worldMatrix = object.matrixWorld.clone();
      const parentInverse = new THREE.Matrix4().copy(newParent.matrixWorld).invert();
      const localMatrix = parentInverse.multiply(worldMatrix);
      newParent.add(object);
      localMatrix.decompose(object.position, object.quaternion, object.scale);
    }

    function updateAim120Attachment({ delta = 0, elapsed } = {}) {
      if (!isIslandAnimationActive('island:east')) return;
      const { THREE, assetRefs } = state;
      if (!THREE || !assetRefs) return;
      if (elapsed === undefined) {
        elapsed = state.clock ? state.clock.elapsedTime : 0;
      }

      const qf01 = assetRefs.qf01;
      const reference = assetRefs.qf01Reference;
      const hardpointRight = assetRefs.aimHardpointRight || assetRefs.aimHardpoint;
      const hardpointLeft = assetRefs.aimHardpointLeft;
      if (!qf01 || !reference || !hardpointRight) return;

      const localCenter = assetRefs._aimLocalCenter || (assetRefs._aimLocalCenter = new THREE.Vector3());
      const localSize = assetRefs._aimLocalSize || (assetRefs._aimLocalSize = new THREE.Vector3());

      localCenter.set(
        (QF01_RAW_BOUNDS.min[0] + QF01_RAW_BOUNDS.max[0]) * 0.5,
        (QF01_RAW_BOUNDS.min[1] + QF01_RAW_BOUNDS.max[1]) * 0.5,
        (QF01_RAW_BOUNDS.min[2] + QF01_RAW_BOUNDS.max[2]) * 0.5
      );
      localSize.set(
        QF01_RAW_BOUNDS.max[0] - QF01_RAW_BOUNDS.min[0],
        QF01_RAW_BOUNDS.max[1] - QF01_RAW_BOUNDS.min[1],
        QF01_RAW_BOUNDS.max[2] - QF01_RAW_BOUNDS.min[2]
      );

      reference.position.copy(localCenter);
      reference.rotation.set(0, 0, 0);
      reference.scale.set(1, 1, 1);
      reference.visible = true;

      const marker = assetRefs.qf01ReferenceMarker;
      if (marker) {
        marker.visible = DEBUG_HELPERS_VISIBLE;
        marker.position.set(0, localSize.y * 0.55, 0);
        marker.rotation.set(0, 0, 0);
      }

      const helperRight = assetRefs.aimHelperRight || assetRefs.aimHelper;
      const helperLeft = assetRefs.aimHelperLeft;
      if (helperRight) {
        helperRight.visible = DEBUG_HELPERS_VISIBLE;
        helperRight.position.set(0, 0, 0);
      }
      if (helperLeft) {
        helperLeft.visible = DEBUG_HELPERS_VISIBLE;
        helperLeft.position.set(0, 0, 0);
      }

      const boundingHelper = assetRefs.aimBoundingHelper;
      if (boundingHelper) {
        if (boundingHelper.parent !== reference) {
          boundingHelper.parent?.remove(boundingHelper);
          reference.add(boundingHelper);
        }
        boundingHelper.visible = DEBUG_HELPERS_VISIBLE;
        boundingHelper.position.set(0, 0, 0);
        boundingHelper.scale.set(
          Math.max(localSize.x, 0.001),
          Math.max(localSize.y, 0.001),
          Math.max(localSize.z, 0.001)
        );
        boundingHelper.rotation.set(0, 0, 0);
      }

      const rightX = localSize.x * 0.5 + 0.1;
      const sharedY = -1.05;
      const sharedZ = -0.9;

      hardpointRight.position.set(rightX, sharedY, sharedZ);
      hardpointRight.rotation.set(
        THREE.MathUtils.degToRad(1),
        THREE.MathUtils.degToRad(90),
        0
      );
      if (hardpointLeft) {
        hardpointLeft.position.set(
          -rightX,
          sharedY,
          sharedZ
        );
        hardpointLeft.rotation.set(
          THREE.MathUtils.degToRad(1),
          THREE.MathUtils.degToRad(-90),
          0
        );
      }

      const aim120Right = assetRefs.aim120Right || assetRefs.aim120;
      const aim120Left = assetRefs.aim120Left;

      const baseRightOffset = assetRefs._aimRightOffset || (assetRefs._aimRightOffset = new THREE.Vector3(0.02, -0.02, -0.18));
      const baseLeftOffset = assetRefs._aimLeftOffset || (assetRefs._aimLeftOffset = new THREE.Vector3(-0.02, -0.02, -0.18));

        const baseRight = assetRefs._aimBaseQuaternionRight || (assetRefs._aimBaseQuaternionRight = new THREE.Quaternion());
        const adjustRight = assetRefs._aimAdjustQuaternionRight || (assetRefs._aimAdjustQuaternionRight = new THREE.Quaternion());
        const restRight = assetRefs._aimRestQuaternionRight || (assetRefs._aimRestQuaternionRight = new THREE.Quaternion());
        baseRight.setFromEuler(new THREE.Euler(0, THREE.MathUtils.degToRad(-90), 0));
        adjustRight.setFromEuler(new THREE.Euler(
          THREE.MathUtils.degToRad(-2),
          THREE.MathUtils.degToRad(4),
          THREE.MathUtils.degToRad(-2)
        ));
        restRight.copy(baseRight).multiply(adjustRight);

        const launch = state.aim120Launch;
        let launching = !!launch?.active;

        if (launching) {
          // Detach missile to stage space so QF01 attitude changes do not affect the launch path.
          const stage = state.stage || launch.stage || state.scene;
          if (!stage) {
            if (launch?.smokeGroup?.parent) {
              launch.smokeTrail.forEach(segment => segment.mesh?.material.dispose?.());
              launch.smokeGroup.parent.remove(launch.smokeGroup);
              launch.smokeTrail = [];
            }
            launching = false;
            state.aim120Launch = null;
          } else {
            if (!launch.initialized) {
              launch.stage = stage;
              stage.updateMatrixWorld(true);
              hardpointRight.updateMatrixWorld(true);
              const stageInverseAtLaunch = new THREE.Matrix4().copy(stage.matrixWorld).invert();
              // Freeze the hardpoint transform relative to the stage at launch so later QF01 motion is ignored.
              launch.frozenParentMatrix = new THREE.Matrix4().copy(stageInverseAtLaunch).multiply(hardpointRight.matrixWorld.clone());
              launch.stageInverseMatrix = new THREE.Matrix4();
              launch.parentMatrix = new THREE.Matrix4();
              launch.missileLocalMatrix = new THREE.Matrix4();
              launch.missileWorldMatrix = new THREE.Matrix4();
              launch.stageLocalMatrix = new THREE.Matrix4();
              launch.parentMatrix3 = new THREE.Matrix3();
              launch.stageInverseMatrix3 = new THREE.Matrix3();
              launch.localPosition = new THREE.Vector3();
              launch.nextLocalPosition = new THREE.Vector3();
              launch.directionLocal = new THREE.Vector3();
              launch.directionWorld = new THREE.Vector3();
              launch.directionStage = new THREE.Vector3();
              launch.localScale = new THREE.Vector3(1.5, 1.5, 1);
              launch.alignQuat = new THREE.Quaternion();
              launch.spinQuat = new THREE.Quaternion();
              launch.finalLocalQuat = new THREE.Quaternion();
              launch.spinAxis = new THREE.Vector3(0, 0, 1);
              launch.restRight = restRight.clone();
              launch.restForward = new THREE.Vector3(0, 0, 1).applyQuaternion(launch.restRight).normalize();
              launch.baseOffset = baseRightOffset.clone();
              launch.prevLocalPosition = launch.baseOffset.clone();
              launch.prevProgress = 0;
              launch.progress = 0;
              launch.lastDirectionLocal = new THREE.Vector3(0, 0, -1);
              launch.freezeParent = stage;
              reparentPreserveWorld(aim120Right, stage);
              if (launch.smokeGroup && launch.smokeGroup.parent !== stage) {

              }
              launch.initialized = true;
            }

            launch.stage = stage;
            stage.updateMatrixWorld(true);

            const computeLocalPosition = (progressValue, target) => {
              target.copy(launch.baseOffset);
              target.x -= launch.maxDistance * progressValue;
              target.y += launch.verticalAmp * Math.sin(progressValue * Math.PI * launch.verticalFreq + launch.verticalPhase);
              target.z += launch.lateralAmp * Math.sin(progressValue * Math.PI * launch.lateralFreq);
              return target;
            };

            launch.timer += delta;
            launch.smokeSpawnTimer += delta;
            const duration = Math.max(launch.duration || AIM_QF01_SYNC_DURATION, 0.001);
            const timeT = Math.min(launch.timer / duration, 1);
            const progress = easeOutCubic(timeT);
            launch.motionFactor = Math.pow(Math.max(1 - timeT, 0), 2);
            computeLocalPosition(progress, launch.localPosition);

            const nextProgress = progress >= 1 ? progress : Math.min(progress + 0.002, 1);
            computeLocalPosition(nextProgress, launch.nextLocalPosition);
            launch.directionLocal.copy(launch.nextLocalPosition).sub(launch.localPosition);
            if (launch.directionLocal.lengthSq() > 1e-6) {
              launch.directionLocal.normalize();
              if (launch.lastDirectionLocal) {

              }
            } else if (launch.lastDirectionLocal) {
              launch.directionLocal.copy(launch.lastDirectionLocal);
            } else {
              launch.directionLocal.set(0, 0, -1);
            }

            launch.alignQuat.setFromUnitVectors(launch.restForward, launch.directionLocal);
            launch.finalLocalQuat.copy(launch.restRight);
            launch.finalLocalQuat.premultiply(launch.alignQuat);
            launch.spinQuat.setFromAxisAngle(launch.spinAxis, launch.spinSpeed * launch.timer);
            launch.finalLocalQuat.multiply(launch.spinQuat);

            const stageMatrix = stage.matrixWorld;
            launch.stageInverseMatrix.copy(stageMatrix).invert();
            launch.parentMatrix.multiplyMatrices(stageMatrix, launch.frozenParentMatrix);
            launch.parentMatrix3.setFromMatrix4(launch.parentMatrix);

            launch.missileLocalMatrix.compose(launch.localPosition, launch.finalLocalQuat, launch.localScale);
            launch.missileWorldMatrix.multiplyMatrices(launch.parentMatrix, launch.missileLocalMatrix);
            launch.stageLocalMatrix.multiplyMatrices(launch.stageInverseMatrix, launch.missileWorldMatrix);
            launch.stageLocalMatrix.decompose(aim120Right.position, aim120Right.quaternion, aim120Right.scale);

            launch.directionWorld.copy(launch.directionLocal).applyMatrix3(launch.parentMatrix3).normalize();
            launch.stageInverseMatrix3.setFromMatrix4(launch.stageInverseMatrix);
            launch.directionStage.copy(launch.directionWorld).applyMatrix3(launch.stageInverseMatrix3).normalize();

            const deltaProgress = Math.max(progress - launch.prevProgress, 0);
            launch.currentSpeed = delta > 1e-5 ? (deltaProgress * launch.maxDistance) / delta : 0;
            launch.prevProgress = progress;
            launch.prevLocalPosition.copy(launch.localPosition);
            launch.progress = progress;

            const explosionThreshold = launch.explosionTrigger ?? AIM120_EXPLOSION_TRIGGER;
            if (!launch.explosionTriggered && timeT >= explosionThreshold) {
              completeAim120Launch({
                launch,
                aim120Mesh: aim120Right,
                stage,
                basePosition: aim120Right.position,
                baseQuaternion: aim120Right.quaternion,
                baseScale: aim120Right.scale
              });
              launching = false;
            }

            if (launch.active) {
              if (launch.smokeGroup) {
                if (launch.smokeGroup.parent !== stage) {
                  stage.add(launch.smokeGroup);
                }
                if (launch.smokeSpawnTimer >= launch.smokeInterval) {
                  launch.smokeSpawnTimer = 0;
                  const geometry = state.sharedMaterials.smokeVoxelGeometry || (state.sharedMaterials.smokeVoxelGeometry = new THREE.BoxGeometry(0.26, 0.26, 0.26));
                  const material = new THREE.MeshStandardMaterial({
                    color: 0xbac4cf,
                    transparent: true,
                    opacity: 0.42,
                    metalness: 0,
                    roughness: 1
                  });
                  const voxel = new THREE.Mesh(geometry, material);
                  voxel.scale.setScalar(0.28);
                  voxel.position.copy(aim120Right.position);
                  voxel.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                  launch.smokeGroup.add(voxel);
                  launch.smokeTrail.push({ mesh: voxel, age: 0, direction: launch.directionStage.clone() });
                }
                const lifetime = launch.smokeLifetime;
                launch.smokeTrail = launch.smokeTrail.filter(segment => {
                  const mesh = segment.mesh;
                  segment.age += delta;
                  const lifeT = segment.age / lifetime;
                  if (lifeT >= 1 || !mesh) {
                    mesh?.material.dispose?.();
                    launch.smokeGroup.remove(mesh);
                    return false;
                  }
                  const scale = 0.28 + lifeT * 0.65;
                  mesh.scale.setScalar(scale);
                  mesh.material.opacity = 0.42 * (1 - lifeT);
                  mesh.position.addScaledVector(segment.direction, -launch.currentSpeed * delta * 0.35);
                  return true;
                });
              }

              if (timeT >= 1) {
                completeAim120Launch({
                  launch,
                  aim120Mesh: aim120Right,
                  stage,
                  basePosition: aim120Right.position,
                  baseQuaternion: aim120Right.quaternion,
                  baseScale: aim120Right.scale
                });
                launching = false;
              }
            }
          }
        }

        if (!launching) {
          if (state.aim120Launch?.completed) {
            aim120Right.visible = false;
          } else {
            if (aim120Right.parent !== hardpointRight) {
              aim120Right.parent?.remove(aim120Right);
              hardpointRight.add(aim120Right);
            }
            assetRefs._aimRestForwardRight = assetRefs._aimRestForwardRight || new THREE.Vector3(0, 0, 1).applyQuaternion(restRight).normalize();
            aim120Right.position.copy(baseRightOffset);
            aim120Right.quaternion.copy(restRight);
            aim120Right.scale.set(1.5, 1.5, 1);
            aim120Right.visible = true;
          }
          if (state.aim120Launch && !state.aim120Launch.completed) {
            state.aim120Launch.motionFactor = 1;
          }
        }
      }

      if (aim120Left && hardpointLeft) {
        if (aim120Left.parent !== hardpointLeft) {
          aim120Left.parent?.remove(aim120Left);
          hardpointLeft.add(aim120Left);
        }
        aim120Left.position.copy(baseLeftOffset);
        const baseLeft = assetRefs._aimBaseQuaternionLeft || (assetRefs._aimBaseQuaternionLeft = new THREE.Quaternion());
        const adjustLeft = assetRefs._aimAdjustQuaternionLeft || (assetRefs._aimAdjustQuaternionLeft = new THREE.Quaternion());
        const finalLeft = assetRefs._aimFinalQuaternionLeft || (assetRefs._aimFinalQuaternionLeft = new THREE.Quaternion());
        baseLeft.setFromEuler(new THREE.Euler(0, THREE.MathUtils.degToRad(90), 0));
        adjustLeft.setFromEuler(new THREE.Euler(
          THREE.MathUtils.degToRad(-2),
          THREE.MathUtils.degToRad(-4),
          THREE.MathUtils.degToRad(2)
        ));
        finalLeft.copy(baseLeft).multiply(adjustLeft);
        aim120Left.quaternion.copy(finalLeft);
        aim120Left.scale.set(1.5, 1.5, 1);
      }

    }

    const Aim120 = {
      disposeExplosionMesh,
      reset: resetAimSequence,
      prepareFragments: prepareAim120Fragments,
      ensureExplosionUpdater: ensureAim120ExplosionUpdater,
      attachToJet: attachAim120ToJet,
      launchForward: launchAim120Forward,
      updateAttachment: updateAim120Attachment
    };

    const Jet = {
      triggerPitch: triggerQf01Pitch
    };

    function ensureBatteryPalette() {
      const { THREE } = state;
      if (!THREE) return null;
      if (!state.assetRefs.batteryPalette) {
        state.assetRefs.batteryPalette = {
          inactiveColor: new THREE.Color(0x2d0c0e),
          inactiveEmissive: new THREE.Color(0x140203),
          tiers: [
            { min: 0.8, color: new THREE.Color(0x12FF29), emissive: new THREE.Color(0x12FF29), intensity: 2.2 },
            { min: 0.65, color: new THREE.Color(0xcfff6a), emissive: new THREE.Color(0xc0f55d), intensity: 2.0 },
            { min: 0.5, color: new THREE.Color(0xffa14a), emissive: new THREE.Color(0xff8a34), intensity: 1.8 },
            { min: 0.25, color: new THREE.Color(0xffa14a), emissive: new THREE.Color(0xff8a34), intensity: 1.6 },
            { min: 0, color: new THREE.Color(0xff4d4d), emissive: new THREE.Color(0xff3a3a), intensity: 1.4 }
          ]
        };
      }
      return state.assetRefs.batteryPalette;
    }

    function ensureBatteryChargeState() {
      if (!state.assetRefs.batteryCharge) {
        state.assetRefs.batteryCharge = { current: 1, target: 1, transition: null };
      }
      return state.assetRefs.batteryCharge;
    }

    function getBatteryTier(charge = 0) {
      const palette = ensureBatteryPalette();
      if (!palette?.tiers) return null;
      const clamped = Math.min(Math.max(charge, 0), 1);
      const tier = palette.tiers.find(entry => clamped >= entry.min) || palette.tiers[palette.tiers.length - 1];
      return tier;
    }

    function getBatteryCellIndex(name) {
      if (!name) return 0;
      if (/^\d+$/.test(name)) return Number(name);
      const match = name.match(/Battery_Cell(\d+)/i);
      return match ? Number(match[1]) : 0;
    }

    function getActiveCountFromCharge(chargeValue, totalCells) {
      if (!totalCells) return 0;
      const clamped = Math.min(Math.max(chargeValue, 0), 1);
      if (clamped <= 0) return 0;
      return Math.min(totalCells, Math.floor(clamped * totalCells + 1e-6));
    }

    function easeInOutPow(t, power = 3) {
      const clamped = Math.min(Math.max(t, 0), 1);
      if (clamped === 0 || clamped === 1) return clamped;
      if (clamped < 0.5) {
        return 0.5 * Math.pow(clamped * 2, power);
      }
      return 1 - 0.5 * Math.pow((1 - clamped) * 2, power);
    }

    function applyBatteryState(activeCount, { edgeIndex = null, edgeFade = 0, direction = -1 } = {}) {
      const cells = state.assetRefs.batteryCells;
      if (!cells || !cells.length) return;
      const palette = ensureBatteryPalette();
      if (!palette) return;
      const totalCells = cells.length;
      const tier = getBatteryTier(activeCount / totalCells);
      const activeColor = tier?.color;
      const activeEmissive = tier?.emissive;
      const activeIntensity = tier?.intensity ?? 1.6;

      cells.forEach(cell => {
        const material = Array.isArray(cell.material) ? cell.material[0] : cell.material;
        if (!material) return;
        const index = getBatteryCellIndex(cell.name);
        if (!index) return;
        const isActive = index <= activeCount;
        const isEdge = edgeIndex && index === edgeIndex;

        if (isEdge) {
          const fade = Math.min(Math.max(edgeFade, 0), 1);
          const turningOff = direction < 0;
          if (material.color) {
            material.color.copy(turningOff ? activeColor ?? palette.inactiveColor : palette.inactiveColor);
            if (activeColor) {
              material.color.lerp(turningOff ? palette.inactiveColor : activeColor, fade);
            }
          }
          if (material.emissive) {
            material.emissive.copy(turningOff ? activeEmissive ?? palette.inactiveEmissive : palette.inactiveEmissive);
            if (activeEmissive) {
              material.emissive.lerp(turningOff ? palette.inactiveEmissive : activeEmissive, fade);
            }
            const fromIntensity = turningOff ? activeIntensity : 0.06;
            const toIntensity = turningOff ? 0.06 : activeIntensity;
            material.emissiveIntensity = state.THREE
              ? state.THREE.MathUtils.lerp(fromIntensity, toIntensity, fade)
              : (fromIntensity + (toIntensity - fromIntensity) * fade);
          }
          return;
        }

        if (material.color) {
          if (isActive && activeColor) {
            material.color.copy(activeColor);
          } else {
            material.color.copy(palette.inactiveColor);
          }
        }
        if (material.emissive) {
          if (isActive && activeEmissive) {
            material.emissive.copy(activeEmissive);
            material.emissiveIntensity = activeIntensity;
          } else {
            material.emissive.copy(palette.inactiveEmissive);
            material.emissiveIntensity = 0.06;
          }
        }
      });
    }

    function applyBatteryCharge(chargeValue = 0) {
      const { THREE } = state;
      if (!THREE) return;
      const cells = state.assetRefs.batteryCells;
      if (!cells || !cells.length) return;
      const clamped = THREE.MathUtils.clamp(chargeValue, 0, 1);
      const activeCount = getActiveCountFromCharge(clamped, cells.length);
      applyBatteryState(activeCount);
    }

    function ensureBatteryUpdater() {
      if (state.assetRefs.batteryUpdaterCleanup) return state.assetRefs.batteryUpdaterCleanup;
      const update = ({ delta = 0 }) => {
        const { THREE } = state;
        if (!THREE) return;
        const charge = ensureBatteryChargeState();
        const pendingDelta = state.assetRefs.batteryDelta || 0;
        if (pendingDelta) {
          const next = THREE.MathUtils.clamp(
            (Number.isFinite(charge.current) ? charge.current : charge.target) + pendingDelta,
            0,
            1
          );
          charge.current = next;
          charge.target = next;
          charge.transition = null;
          state.assetRefs.batteryDelta = 0;
          applyBatteryCharge(next);
        }
        if (!charge.transition) {
          applyBatteryCharge(charge.current);
          return;
        }
        const transition = charge.transition;
        transition.elapsed += delta;
        const progress = Math.min(Math.max(transition.elapsed / transition.totalDuration, 0), 1);
        const easedProgress = easeInOutPow(progress, transition.power);
        const stepFloat = easedProgress * transition.totalSteps;
        const stepIndex = Math.min(transition.totalSteps, Math.floor(stepFloat));
        const stepT = Math.min(Math.max(stepFloat - stepIndex, 0), 1);
        const easedStep = easeInOutPow(stepT, transition.power);
        const currentCount = transition.startCount + transition.direction * stepIndex;
        const edgeIndex = transition.direction < 0
          ? currentCount
          : currentCount + 1;

        applyBatteryState(currentCount, {
          edgeIndex,
          edgeFade: easedStep,
          direction: transition.direction
        });

        charge.current = transition.totalCells ? currentCount / transition.totalCells : charge.current;

        if (progress >= 1) {
          charge.current = transition.targetCount / transition.totalCells;
          charge.transition = null;
          applyBatteryState(transition.targetCount);
        }
      };
      update.__tag = 'BatteryCharge';
      const cleanup = registerUpdater(update);
      state.assetRefs.batteryUpdaterCleanup = cleanup;
      return cleanup;
    }

    function setBatteryChargeTarget(value, { immediate = false } = {}) {
      const charge = ensureBatteryChargeState();
      const next = Math.min(Math.max(Number.isFinite(value) ? value : 0, 0), 1);
      charge.target = next;
      if (immediate) {
        charge.current = next;
        charge.transition = null;
        applyBatteryCharge(next);
      }
      if (!immediate) {
        const cellCount = state.assetRefs.batteryCells?.length || 0;
        if (!cellCount) {
          charge.current = next;
          applyBatteryCharge(next);
        } else {
          if (charge.transition) {
            const targetCount = getActiveCountFromCharge(next, cellCount);
            const transition = charge.transition;
            transition.targetCount = targetCount;
            transition.direction = Math.sign(targetCount - transition.startCount);
            transition.totalSteps = Math.abs(targetCount - transition.startCount);
            transition.totalDuration = Math.min(Math.max(0.6 + transition.totalSteps * 0.12, 0.6), 5.0);
            transition.elapsed = Math.min(transition.elapsed, transition.totalDuration);
            if (transition.totalSteps === 0) {
              charge.transition = null;
              applyBatteryCharge(next);
            }
            ensureBatteryUpdater();
            return next;
          }
          const startCount = charge.transition?.startCount ?? getActiveCountFromCharge(charge.current, cellCount);
          const targetCount = getActiveCountFromCharge(next, cellCount);
          if (startCount === targetCount) {
            charge.current = next;
            charge.transition = null;
            applyBatteryCharge(next);
          } else {
            const deltaCells = Math.abs(targetCount - startCount);
            const totalDuration = Math.min(Math.max(0.6 + deltaCells * 0.12, 0.6), 5.0);
            charge.transition = {
              startCount,
              targetCount,
              direction: Math.sign(targetCount - startCount),
              totalSteps: deltaCells,
              totalDuration,
              elapsed: 0,
              power: 2,
              totalCells: cellCount
            };
          }
        }
      }
      ensureBatteryUpdater();
      return next;
    }

    function addBatteryDelta(delta = 0) {
      if (!Number.isFinite(delta) || delta === 0) return;
      state.assetRefs.batteryDelta = (state.assetRefs.batteryDelta || 0) + delta;
      ensureBatteryUpdater();
    }

    function setupBatteryCells(root) {
      if (!root) return;
      const cells = [];
      root.traverse(node => {
        if (!node.isMesh) return;
        if (node.name && (/^\d+$/.test(node.name) || /^Battery_Cell\d+$/i.test(node.name))) {
          const baseMaterial = Array.isArray(node.material) ? node.material[0] : node.material;
          if (baseMaterial?.clone) {
            const cloned = baseMaterial.clone();
            cloned.toneMapped = false;
            if (cloned.emissive) {
              cloned.emissiveIntensity = cloned.emissiveIntensity ?? 0.4;
            }
            node.material = cloned;
          } else if (baseMaterial) {
            baseMaterial.toneMapped = false;
          }
          cells.push(node);
        }
      });

      cells.sort((a, b) => getBatteryCellIndex(b.name) - getBatteryCellIndex(a.name));
      state.assetRefs.batteryCells = cells;
      const charge = ensureBatteryChargeState();
      if (!state.assetRefs.batteryChargeInitialized) {
        const initial = Math.min(1, 1 / Math.max(cells.length, 1));
        charge.current = initial;
        charge.target = initial;
        state.assetRefs.batteryChargeInitialized = true;
      }
      applyBatteryCharge(charge.current ?? 1);
      ensureBatteryUpdater();
    }

    const Battery = {
      setCharge: setBatteryChargeTarget,
      getCharge: () => ensureBatteryChargeState().target,
      addDelta: addBatteryDelta
    };

    state.modules = { Aim120, Jet, Battery };

    function ensureAnimationActivityStore() {
      if (!state.assetRefs.animationActivity) {
        state.assetRefs.animationActivity = Object.create(null);
      }
      return state.assetRefs.animationActivity;
    }

    function setIslandAnimationActive(key, active) {
      if (!key) return;
      const store = ensureAnimationActivityStore();
      const next = !!active;
      store[key] = next;
    }

    function isIslandAnimationActive(key) {
      if (!key) return true;
      const store = state.assetRefs.animationActivity;
      return !!(store && store[key]);
    }

    function syncIslandHoverStates(intersections) {
      const prev = state.assetRefs.hoveredActivityKeys || new Set();
      const next = new Set();
      intersections?.forEach(({ object }) => {
        const key = object.userData?.hoverActivityKey;
        if (key) next.add(key);
      });
      prev.forEach(key => {
        if (!next.has(key)) setIslandAnimationActive(key, false);
      });
      next.forEach(key => {
        if (!prev.has(key)) setIslandAnimationActive(key, true);
      });
      state.assetRefs.hoveredActivityKeys = next;
    }


    const ISLAND_DIMENSIONS = {
      outerRadius: 0.9,
      longLeg: 6.6,
      shortLeg: 4.8,
      notchDepth: 2.6,
      notchWidth: 2.8
    };

    const ISLAND_SHAPE_BUILDERS = {
      default: ({ THREE, options }) => {
        const dims = { ...ISLAND_DIMENSIONS, ...(options.dimensions || {}) };
        const { outerRadius, longLeg, shortLeg, notchDepth, notchWidth } = dims;
        const flipX = value => -value;
        const shape = new THREE.Shape();
        shape.moveTo(flipX(-shortLeg / 2 + notchWidth + outerRadius), -longLeg / 2);
        shape.lineTo(flipX(shortLeg / 2 - outerRadius), -longLeg / 2);
        shape.quadraticCurveTo(flipX(shortLeg / 2), -longLeg / 2, flipX(shortLeg / 2), -longLeg / 2 + outerRadius);
        shape.lineTo(flipX(shortLeg / 2), longLeg / 2 - outerRadius);
        shape.quadraticCurveTo(flipX(shortLeg / 2), longLeg / 2, flipX(shortLeg / 2 - outerRadius), longLeg / 2);
        shape.lineTo(flipX(-shortLeg / 2 + outerRadius), longLeg / 2);
        shape.quadraticCurveTo(flipX(-shortLeg / 2), longLeg / 2, flipX(-shortLeg / 2), longLeg / 2 - outerRadius);
        shape.lineTo(flipX(-shortLeg / 2), -longLeg / 2 + notchDepth + outerRadius);
        shape.quadraticCurveTo(flipX(-shortLeg / 2), -longLeg / 2 + notchDepth, flipX(-shortLeg / 2 + outerRadius), -longLeg / 2 + notchDepth);
        shape.lineTo(flipX(-shortLeg / 2 + notchWidth - outerRadius), -longLeg / 2 + notchDepth);
        shape.quadraticCurveTo(flipX(-shortLeg / 2 + notchWidth), -longLeg / 2 + notchDepth, flipX(-shortLeg / 2 + notchWidth), -longLeg / 2 + notchDepth - outerRadius);
        shape.lineTo(flipX(-shortLeg / 2 + notchWidth), -longLeg / 2 + outerRadius);
        shape.quadraticCurveTo(flipX(-shortLeg / 2 + notchWidth), -longLeg / 2, flipX(-shortLeg / 2 + notchWidth + outerRadius), -longLeg / 2);
        shape.closePath();
        return shape;
      },
      crescent: ({ THREE, options }) => {
        const { width = 6.2, depth = 4.8, innerArc = 1.6, pinch = 0.55 } = options.dimensions || {};
        const shape = new THREE.Shape();
        shape.moveTo(-width / 2, -depth / 2);
        shape.quadraticCurveTo(-width * (0.55 + pinch), 0, -width / 2, depth / 2);
        shape.quadraticCurveTo(-width * 0.12, depth / 2 + innerArc, width / 2, depth / 2);
        shape.quadraticCurveTo(width * (0.55 + pinch), 0, width / 2 - innerArc * 0.6, -depth / 2);
        shape.quadraticCurveTo(width * 0.14, -depth / 2 - innerArc * 0.72, -width / 2, -depth / 2);
        shape.closePath();
        return shape;
      },
      delta: ({ THREE, options }) => {
        const { width = 5.6, depth = 5.8, tip = 1.6, waist = 1.1, radius = 0.8 } = options.dimensions || {};
        const shape = new THREE.Shape();
        shape.moveTo(0, depth / 2);
        shape.quadraticCurveTo(width / 2, depth / 2 - radius, width / 2, depth / 2 - waist);
        shape.lineTo(width / 2, -depth / 4);
        shape.quadraticCurveTo(width / 2, -depth / 2, 0, -depth / 2 - tip);
        shape.quadraticCurveTo(-width / 2, -depth / 2, -width / 2, -depth / 4);
        shape.lineTo(-width / 2, depth / 2 - waist);
        shape.quadraticCurveTo(-width / 2, depth / 2 - radius, 0, depth / 2);
        shape.closePath();
        return shape;
      },
      oval: ({ THREE, options }) => {
        const { width = 5.4, depth = 4.4, wobble = 0.18 } = options.dimensions || {};
        const shape = new THREE.Shape();
        const steps = 48;
        for (let i = 0; i <= steps; i += 1) {
          const theta = (i / steps) * Math.PI * 2;
          const wobbleFactor = 1 + Math.sin(theta * 2) * wobble;
          const x = (width / 2) * Math.cos(theta) * wobbleFactor;
          const y = (depth / 2) * Math.sin(theta);
          if (i === 0) {
            shape.moveTo(x, y);
          } else {
            shape.lineTo(x, y);
          }
        }
        shape.closePath();
        return shape;
      },
      roundedRect: ({ THREE, options }) => {
        const { width = 5.6, depth = 4.2, radius = 0.9 } = options.dimensions || {};
        const halfW = width / 2;
        const halfD = depth / 2;
        const r = Math.min(radius, halfW, halfD);
        const shape = new THREE.Shape();
        shape.moveTo(-halfW + r, -halfD);
        shape.lineTo(halfW - r, -halfD);
        shape.quadraticCurveTo(halfW, -halfD, halfW, -halfD + r);
        shape.lineTo(halfW, halfD - r);
        shape.quadraticCurveTo(halfW, halfD, halfW - r, halfD);
        shape.lineTo(-halfW + r, halfD);
        shape.quadraticCurveTo(-halfW, halfD, -halfW, halfD - r);
        shape.lineTo(-halfW, -halfD + r);
        shape.quadraticCurveTo(-halfW, -halfD, -halfW + r, -halfD);
        shape.closePath();
        return shape;
      },
      semiCircle: ({ THREE, options }) => {
        const {
          radius = 3.2,
          baseHeight = 2.2,
          corner = 0.6
        } = options.dimensions || {};

        const halfHeight = baseHeight / 2;
        const clampedCorner = Math.min(corner, halfHeight, radius * 0.85);
        const bottomY = -halfHeight;
        const shape = new THREE.Shape();

        const effectiveRadius = radius - clampedCorner;
        const theta = Math.acos(THREE.MathUtils.clamp(effectiveRadius / radius, 0, 1));
        const startX = radius * Math.cos(theta);
        const startY = bottomY + radius * Math.sin(theta);

        shape.moveTo(-startX, bottomY);
        shape.quadraticCurveTo(-radius, bottomY, -radius, bottomY + clampedCorner);
        shape.absarc(0, bottomY, radius, Math.PI - theta, theta, true);
        shape.quadraticCurveTo(radius, bottomY, startX, bottomY);
        shape.lineTo(-startX, bottomY);
        shape.closePath();
        return shape;
      },
      trapezoid: ({ THREE, options }) => {
        const { topWidth = 4.6, bottomWidth = 6.6, depth = 5.2, corner = 0.6 } = options.dimensions || {};
        const halfDepth = depth / 2;
        const topHalf = topWidth / 2;
        const bottomHalf = bottomWidth / 2;
        const r = Math.min(corner, halfDepth, topHalf, bottomHalf);
        const shape = new THREE.Shape();
        shape.moveTo(-bottomHalf + r, -halfDepth);
        shape.lineTo(bottomHalf - r, -halfDepth);
        shape.quadraticCurveTo(bottomHalf, -halfDepth, bottomHalf, -halfDepth + r);
        shape.lineTo(topHalf, halfDepth - r);
        shape.quadraticCurveTo(topHalf, halfDepth, topHalf - r, halfDepth);
        shape.lineTo(-topHalf + r, halfDepth);

    function createDebugLabel(text, { color = '#c6daff' } = {}) {
      const paddingX = 64;
      const paddingY = 80;
      const maxWidth = 960;
      const minWidth = 280;
      const minHeight = 200;
      let fontSize = 138;
      const minFont = 96;

      const measureCanvas = document.createElement('canvas');
      const measureCtx = measureCanvas.getContext('2d');
      measureCtx.font = `600 ${fontSize}px "Inter", sans-serif`;
      let textWidth = measureCtx.measureText(text).width;
      while ((textWidth + paddingX * 2 > maxWidth) && fontSize > minFont) {
        fontSize -= 4;
        measureCtx.font = `600 ${fontSize}px "Inter", sans-serif`;
        textWidth = measureCtx.measureText(text).width;
      }

      const width = Math.max(minWidth, Math.ceil(textWidth + paddingX * 2));
      const height = Math.max(minHeight, Math.ceil(fontSize + paddingY * 2));

      const canvasEl = document.createElement('canvas');
      canvasEl.width = width;
      canvasEl.height = height;
      const ctx = canvasEl.getContext('2d');
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(12, 19, 38, 0.78)';
      const boxX = 36;
      const boxY = 48;
      const boxW = width - boxX * 2;
      const boxH = height - boxY * 2;
      const radius = Math.min(48, boxH / 2.1);
      ctx.beginPath();
      ctx.moveTo(boxX + radius, boxY);
      ctx.lineTo(boxX + boxW - radius, boxY);
      ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + radius);
      ctx.lineTo(boxX + boxW, boxY + boxH - radius);
      ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - radius, boxY + boxH);
      ctx.lineTo(boxX + radius, boxY + boxH);
      ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - radius);
      ctx.lineTo(boxX, boxY + radius);
      ctx.quadraticCurveTo(boxX, boxY, boxX + radius, boxY);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = color;
      ctx.font = `600 ${fontSize}px "Inter", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, width / 2, height / 2);

      const texture = new state.THREE.CanvasTexture(canvasEl);
      texture.anisotropy = 4;
      texture.needsUpdate = true;

      const material = new state.THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
      const sprite = new state.THREE.Sprite(material);
      const scaleFactor = 0.0019;
      sprite.scale.set(width * scaleFactor, height * scaleFactor, 1);

    function createAnchorMarker(label) {

    function buildIslandShape(footprint = {}) {

    const noiseUtils = (() => {
      const fract = value => value - Math.floor(value);
      const fade = t => t * t * (3 - 2 * t);
      const lerp = (a, b, t) => a + (b - a) * t;
      const rand3 = (x, y, z) => fract(Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453);

      function valueNoise3(x, y, z) {
        const xi = Math.floor(x);
        const yi = Math.floor(y);
        const zi = Math.floor(z);
        const xf = x - xi;
        const yf = y - yi;
        const zf = z - zi;
        const u = fade(xf);
        const v = fade(yf);
        const w = fade(zf);

        const c000 = rand3(xi, yi, zi);
        const c100 = rand3(xi + 1, yi, zi);
        const c010 = rand3(xi, yi + 1, zi);
        const c110 = rand3(xi + 1, yi + 1, zi);
        const c001 = rand3(xi, yi, zi + 1);
        const c101 = rand3(xi + 1, yi, zi + 1);
        const c011 = rand3(xi, yi + 1, zi + 1);
        const c111 = rand3(xi + 1, yi + 1, zi + 1);

        const x00 = lerp(c000, c100, u);
        const x10 = lerp(c010, c110, u);
        const x01 = lerp(c001, c101, u);
        const x11 = lerp(c011, c111, u);
        const y0 = lerp(x00, x10, v);
        const y1 = lerp(x01, x11, v);
        return lerp(y0, y1, w);
      }

      function fbm3(x, y, z, octaves = 5, lacunarity = 2, gain = 0.5) {
        let sum = 0;
        let amp = 1;
        let freq = 1;
        let norm = 0;
        for (let i = 0; i < octaves; i += 1) {
          sum += valueNoise3(x * freq, y * freq, z * freq) * amp;
          norm += amp;
          freq *= lacunarity;
          amp *= gain;
        }
        return sum / norm;
      }

      function fbm2(x, z, octaves = 5, lacunarity = 2, gain = 0.5) {
        return fbm3(x, 0, z, octaves, lacunarity, gain);
      }

      return { fbm2, fbm3 };

    function createTerrainMesh({
      width = 4,
      depth = 4,
      segments = 24,
      amplitude = 0.6,
      blockHeight = 1.2,
      crestColor = 0x6fb4ff,
      troughColor = 0x0b1e36,
      sideColor = 0x050b14,
      highlightBias = 0.58,
      scrollSpeed = [0, 0],
      cornerRadius = 0.45,
      noiseOffset = [50, 90],
      noiseScale = 3.6,
      activityKey = null
    } = {}) {
      const { THREE } = state;
      const shared = state.sharedMaterials || (state.sharedMaterials = {});

      const geometry = new THREE.BoxGeometry(width, blockHeight, depth, segments, Math.max(1, Math.ceil(segments * 0.4)), segments);
      const positions = geometry.attributes.position;
      const vertexCount = positions.count;
      const baseCoordinates = new Float32Array(vertexCount * 2);
      const baseHeights = new Float32Array(vertexCount);
      const topMask = new Uint8Array(vertexCount);
      const halfHeight = blockHeight / 2;
      const epsilon = 1e-4;
      const radius = Math.max(0, Math.min(cornerRadius, Math.min(width, depth) * 0.5));
      const minX = -width / 2 + radius;
      const maxX = width / 2 - radius;
      const minZ = -depth / 2 + radius;
      const maxZ = depth / 2 - radius;

      for (let i = 0; i < vertexCount; i += 1) {
        const originalX = positions.getX(i);
        const originalY = positions.getY(i);
        const originalZ = positions.getZ(i);

        let adjustedX = originalX;
        let adjustedZ = originalZ;
        if (radius > 0) {
          const clampedX = THREE.MathUtils.clamp(originalX, minX, maxX);
          const clampedZ = THREE.MathUtils.clamp(originalZ, minZ, maxZ);
          const dx = originalX - clampedX;
          const dz = originalZ - clampedZ;
          const distance = Math.hypot(dx, dz);
          if (distance > 0) {
            const scale = Math.min(radius, distance);
            const directionX = dx / distance;
            const directionZ = dz / distance;
            adjustedX = clampedX + directionX * scale;
            adjustedZ = clampedZ + directionZ * scale;
          } else {
            adjustedX = clampedX;
            adjustedZ = clampedZ;
          }
        }

        positions.setX(i, adjustedX);
        positions.setZ(i, adjustedZ);

        baseCoordinates[i * 2] = adjustedX;
        baseCoordinates[i * 2 + 1] = adjustedZ;
        baseHeights[i] = originalY;
        if (originalY >= halfHeight - epsilon) {
          topMask[i] = 1;
        }
      }

      const sampleSpeed = Array.isArray(scrollSpeed)
        ? { x: scrollSpeed[0] || 0, z: scrollSpeed[1] || 0 }
        : { x: scrollSpeed.x || 0, z: scrollSpeed.z || 0 };

      const sampleOffset = Array.isArray(noiseOffset)
        ? { x: noiseOffset[0] || 0, z: noiseOffset[1] || 0 }
        : { x: noiseOffset.x || 0, z: noiseOffset.z || 0 };

      const colors = new Float32Array(vertexCount * 3);
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const colorAttribute = geometry.attributes.color;
      const crest = crestColor instanceof THREE.Color ? crestColor.clone() : new THREE.Color(crestColor);
      const trough = troughColor instanceof THREE.Color ? troughColor.clone() : new THREE.Color(troughColor);
      const sideColorValue = sideColor instanceof THREE.Color ? sideColor.clone() : new THREE.Color(sideColor);
      const scrollState = {
        target: new THREE.Vector2(0, 0),
        current: new THREE.Vector2(0, 0)
      };

      const applyHeightField = (offsetX = 0, offsetZ = 0) => {
        for (let i = 0; i < vertexCount; i += 1) {
          const baseY = baseHeights[i];
          if (topMask[i]) {
            const x = baseCoordinates[i * 2];
            const z = baseCoordinates[i * 2 + 1];
            const nx = (x / width) * noiseScale + sampleOffset.x + offsetX;
            const nz = (z / depth) * noiseScale + sampleOffset.z + offsetZ;
            const elevation = (noiseUtils.fbm3(nx, 0, nz, 4, 2, 0.48) - 0.5) * amplitude;
            positions.setY(i, baseY + elevation);
            const normalizedHeight = amplitude !== 0
              ? THREE.MathUtils.clamp(elevation / amplitude + 0.5, 0, 1)
              : 0.5;
            const foamWeight = Math.pow(THREE.MathUtils.clamp(normalizedHeight - highlightBias, 0, 1), 1.4);
            const r = trough.r + (crest.r - trough.r) * foamWeight;
            const g = trough.g + (crest.g - trough.g) * foamWeight;
            const b = trough.b + (crest.b - trough.b) * foamWeight;
            colorAttribute.setXYZ(i, r, g, b);
          } else {
            positions.setY(i, baseY);
            colorAttribute.setXYZ(i, sideColorValue.r, sideColorValue.g, sideColorValue.b);
          }
        }
        positions.needsUpdate = true;
        colorAttribute.needsUpdate = true;
      };

      applyHeightField();
      scrollState.target.set(0, 0);
      scrollState.current.set(0, 0);
      geometry.computeVertexNormals();
      if (geometry.attributes.normal) {
        geometry.attributes.normal.needsUpdate = true;
      }

      let material = shared.terrain;
      if (!material) {
        material = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          metalness: 0.65,
          roughness: 0.22,
          envMapIntensity: 1.1,
          vertexColors: true,
          flatShading: true
        });
        shared.terrain = material;
      }
      const terrain = new THREE.Mesh(geometry, material);
      terrain.castShadow = true;
      terrain.receiveShadow = true;
      terrain.position.y = -blockHeight / 2;
      terrain.frustumCulled = true;
      terrain.userData.scrollState = scrollState;

      if (Math.hypot(sampleSpeed.x, sampleSpeed.z) > 0) {
        let normalAccumulator = 0;
        let lastAppliedOffset = null;
        registerUpdater(({ delta = 0 }) => {
          if (!terrain.parent) return;
          if (activityKey && !isIslandAnimationActive(activityKey)) return;
          const { target, current } = scrollState;
          const motionFactor = getLaunchMotionFactor();
          if (motionFactor > 0) {
            target.x += sampleSpeed.x * delta * motionFactor;
            target.y += sampleSpeed.z * delta * motionFactor;
          }
          const lambda = 2.2;
          current.x = THREE.MathUtils.damp(current.x, target.x, lambda, delta);
          current.y = THREE.MathUtils.damp(current.y, target.y, lambda, delta);

          const changed = !lastAppliedOffset
            || Math.abs(current.x - lastAppliedOffset.x) > 1e-5
            || Math.abs(current.y - lastAppliedOffset.y) > 1e-5;

          if (changed) {
            applyHeightField(current.x, current.y);
            if (!lastAppliedOffset) {
              lastAppliedOffset = new THREE.Vector2();
            }
            lastAppliedOffset.set(current.x, current.y);
            normalAccumulator += delta;
            if (normalAccumulator >= 0.14) {
              geometry.computeVertexNormals();
              if (geometry.attributes.normal) {
                geometry.attributes.normal.needsUpdate = true;
              }
              normalAccumulator = 0;
            }
          }
        });
      }

      return terrain;
    }


function createCloudVolume({
  size = [4, 2, 3],
  spacing = 0.45,
  threshold = 0.72,
  radiusRange = [0.28, 0.62],
  seed = 42,
  color = 0xf2f6ff
} = {}) {
  const { THREE } = state;
  const shared = state.sharedMaterials || (state.sharedMaterials = {});

  if (!shared.cloudMaterials) {
    shared.cloudMaterials = {
      light: new THREE.MeshBasicMaterial({ color, toneMapped: false, side: THREE.DoubleSide, transparent: true, opacity: 0.95, depthWrite: false }),
      shadow: new THREE.MeshBasicMaterial({ color: 0x1a2133, toneMapped: false, side: THREE.DoubleSide, transparent: true, opacity: 0.78, depthWrite: false })
    };
  } else {
    shared.cloudMaterials.light.color.set(color);
  }

  const geometry = new THREE.SphereGeometry(0.5, 10, 8);
  const [width, height, depth] = size;
  const group = new THREE.Group();
  let puffCount = 0;
  const band = 0.1;
  const freq = 0.38;

  for (let x = -width / 2; x <= width / 2; x += spacing) {
    for (let y = 0; y <= height; y += spacing) {
      for (let z = -depth / 2; z <= depth / 2; z += spacing) {
        const sample = noiseUtils.fbm3(
          (x + seed * 1.7) * freq,
          (y + seed * 0.9) * freq,
          (z - seed * 1.3) * freq,
          5, 2.05, 0.52
        );

        if (sample > threshold) {
          const material = sample > threshold + band ? shared.cloudMaterials.light : shared.cloudMaterials.shadow;
          const puff = new THREE.Mesh(geometry, material);
          const scale = THREE.MathUtils.lerp(radiusRange[0], radiusRange[1], Math.random());
          puff.scale.set(scale, scale, scale);
          puff.position.set(
            x + (Math.random() - 0.5) * spacing * 0.35,
            y * 0.55 + Math.random() * 0.25,
            z + (Math.random() - 0.5) * spacing * 0.35
          );
          puff.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2);
          puff.castShadow = false;
          puff.receiveShadow = false;
          group.add(puff);
          puffCount += 1;
        }
      }
    }
  }

  if (puffCount === 0) {
    for (let i = 0; i < 24; i += 1) {
      const puff = new THREE.Mesh(geometry, shared.cloudMaterials.light);
      const scale = THREE.MathUtils.lerp(radiusRange[0], radiusRange[1], Math.random());
          puff.scale.set(scale, scale, scale);
      puff.position.set((Math.random() - 0.5) * width, Math.random() * height, (Math.random() - 0.5) * depth);
      puff.castShadow = false;
      puff.receiveShadow = false;
      group.add(puff);
    }
  }

  return group;
}

function createVolumetricCloud({
  dimensions = [4.6, 2.4, 3.4],
  resolution = 96,
  threshold = 0.25,
  range = 0.1,
  opacity = 0.25,
  steps = 80,
  seed = 42,
  scrollSpeed = [0.006, 0.002, 0.008],
  activityKey = null
} = {}) {
  const { THREE, ImprovedNoise } = state;
  const supportsWebGL2 = state.renderer?.capabilities?.isWebGL2;
  if (!THREE || !ImprovedNoise || !supportsWebGL2) {
    return createCloudVolume({ size: dimensions, spacing: 0.5, threshold: 0.45, radiusRange: [0.32, 0.58], seed });

        data[i] = (128 + 128 * perlin.noise(x * scale / 1.5, y * scale, z * scale / 1.5)) * d * d;

  texture.magFilter = THREE.LinearFilter;

    in vec3 position;

    uniform mat4 modelMatrix;
    uniform mat4 modelViewMatrix;
    uniform mat4 projectionMatrix;
    uniform vec3 cameraPos;

    out vec3 vOrigin;
    out vec3 vDirection;

    void main() {
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      vOrigin = vec3(inverse(modelMatrix) * vec4(cameraPos, 1.0));
      vDirection = position - vOrigin;
      gl_Position = projectionMatrix * mvPosition;

    precision highp float;
    precision highp sampler3D;

    in vec3 vOrigin;
    in vec3 vDirection;

    out vec4 color;

    uniform vec3 base;
    uniform sampler3D map;
    uniform float threshold;
    uniform float range;
    uniform float opacity;
    uniform float steps;
    uniform float frame;
    uniform vec3 scroll;

    uint wang_hash(uint seed) {
      seed = (seed ^ 61u) ^ (seed >> 16u);
      seed *= 9u;
      seed = seed ^ (seed >> 4u);
      seed *= 0x27d4eb2du;
      seed = seed ^ (seed >> 15u);
      return seed;
    }

    float randomFloat(inout uint seed) {
      return float(wang_hash(seed)) / 4294967296.0;
    }

    vec2 hitBox(vec3 orig, vec3 dir) {
      const vec3 box_min = vec3(-0.5);
      const vec3 box_max = vec3(0.5);
      vec3 inv_dir = 1.0 / dir;
      vec3 tmin_tmp = (box_min - orig) * inv_dir;
      vec3 tmax_tmp = (box_max - orig) * inv_dir;
      vec3 tmin = min(tmin_tmp, tmax_tmp);
      vec3 tmax = max(tmin_tmp, tmax_tmp);
      float t0 = max(tmin.x, max(tmin.y, tmin.z));
      float t1 = min(tmax.x, min(tmax.y, tmax.z));
      return vec2(t0, t1);
    }

    float sample1(vec3 p) { return texture(map, p).r; }

    float shading(vec3 coord) {
      float step = 0.01;
      return sample1(coord + vec3(-step)) - sample1(coord + vec3(step));
    }

    vec4 linearToSRGB(vec4 value) {
      return vec4(
        mix(
          pow(value.rgb, vec3(0.41666)) * 1.055 - vec3(0.055),
          value.rgb * 12.92,
          vec3(lessThanEqual(value.rgb, vec3(0.0031308)))

        value.a

    void main(){

      vec2 bounds = hitBox(vOrigin, rayDir);
      if (bounds.x > bounds.y) discard;
      bounds.x = max(bounds.x, 0.0);

      vec3 p = vOrigin + bounds.x * rayDir;

      float delta = min(inc.x, min(inc.y, inc.z));

      uint seed = uint(gl_FragCoord.x) * uint(1973) + uint(gl_FragCoord.y) * uint(9277) + uint(frame) * uint(26699);
      vec3 size = vec3(textureSize(map, 0));
      float randNum = randomFloat(seed) * 2.0 - 1.0;
      p += rayDir * randNum * (1.0 / size);

      vec4 acc = vec4(base, 0.0);

      for (float t = bounds.x; t < bounds.y; t += delta) {
        vec3 samplePoint = fract(p + scroll + 0.5);
        float d = sample1(samplePoint);
        d = smoothstep(threshold - range, threshold + range, d) * opacity;

        float col = shading(samplePoint) * 3.0 + ((samplePoint.x + samplePoint.y) * 0.25) + 0.2;

        acc.rgb += (1.0 - acc.a) * d * col;
        acc.a += (1.0 - acc.a) * d;

        if (acc.a >= 0.95) break;

        p += rayDir * delta;

      float finalAlpha = clamp(acc.a * 1.6, 0.0, 1.0);
      color = linearToSRGB(vec4(acc.rgb, finalAlpha));
      if (finalAlpha <= 0.001) discard;
