    function createFullscreenSkyMesh(sharedUniforms) {
      const { THREE } = state;
      if (!THREE || !sharedUniforms) return null;

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute([
        -1, -1, 0,
         3, -1, 0,
        -1,  3, 0
      ], 3));

      const material = new THREE.ShaderMaterial({
        uniforms: {
          turbidity: sharedUniforms.turbidity,
          rayleigh: sharedUniforms.rayleigh,
          mieCoefficient: sharedUniforms.mieCoefficient,
          mieDirectionalG: sharedUniforms.mieDirectionalG,
          sunPosition: sharedUniforms.sunPosition,
          up: sharedUniforms.up,
          cloudScale: sharedUniforms.cloudScale,
          cloudSpeed: sharedUniforms.cloudSpeed,
          cloudCoverage: sharedUniforms.cloudCoverage,
          cloudDensity: sharedUniforms.cloudDensity,
          cloudElevation: sharedUniforms.cloudElevation,
          cloudQuality: sharedUniforms.cloudQuality,
          showSunDisc: sharedUniforms.showSunDisc,
          time: sharedUniforms.time,
          skyRotation: { value: new THREE.Matrix3() },
          cameraFov: { value: state.camera?.fov ?? 50 },
          cameraAspect: { value: state.camera?.aspect ?? 1 }
        },
        vertexShader: `
          varying vec2 vUv;

          void main() {
            vUv = position.xy * 0.5 + 0.5;
            gl_Position = vec4(position.xy, 0.0, 1.0);
          }
        `,
        fragmentShader: `
          varying vec2 vUv;

          uniform float turbidity;
          uniform float rayleigh;
          uniform float mieCoefficient;
          uniform float mieDirectionalG;
          uniform vec3 sunPosition;
          uniform vec3 up;
          uniform float cloudScale;
          uniform float cloudSpeed;
          uniform float cloudCoverage;
          uniform float cloudDensity;
          uniform float cloudElevation;
          uniform float cloudQuality;
          uniform float showSunDisc;
          uniform float time;
          uniform mat3 skyRotation;
          uniform float cameraFov;
          uniform float cameraAspect;

          const float e = 2.71828182845904523536028747135266249775724709369995957;
          const float pi = 3.141592653589793238462643383279502884197169;
          const vec3 totalRayleigh = vec3(5.804542996261093E-6, 1.3562911419845635E-5, 3.0265902468824876E-5);
          const vec3 K = vec3(0.686, 0.678, 0.666);
          const vec3 MieConst = vec3(1.8399918514433978E14, 2.7798023919660528E14, 4.0790479543861094E14);
          const float cutoffAngle = 1.6110731556870734;
          const float steepness = 1.5;
          const float EE = 1000.0;
          const float rayleighZenithLength = 8.4E3;
          const float mieZenithLength = 1.25E3;
          const float sunAngularDiameterCos = 0.999956676946448443553574619906976478926848692873900859324;
          const float THREE_OVER_SIXTEENPI = 0.05968310365946075;
          const float ONE_OVER_FOURPI = 0.07957747154594767;

          float sunIntensity(float zenithAngleCos) {
            zenithAngleCos = clamp(zenithAngleCos, -1.0, 1.0);
            return EE * max(0.0, 1.0 - pow(e, -((cutoffAngle - acos(zenithAngleCos)) / steepness)));
          }

          vec3 totalMie(float T) {
            float c = (0.2 * T) * 10E-18;
            return 0.434 * c * MieConst;
          }

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
          }

          float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            float a = hash(i);
            float b = hash(i + vec2(1.0, 0.0));
            float c = hash(i + vec2(0.0, 1.0));
            float d = hash(i + vec2(1.0, 1.0));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
          }

          float fbm(vec2 p) {
            float value = 0.0;
            float amplitude = 0.5;
            for (int i = 0; i < 5; i++) {
              value += amplitude * noise(p);
              p *= 2.0;
              amplitude *= 0.5;
            }
            return value;
          }

          float fbmFast(vec2 p) {
            float value = 0.0;
            float amplitude = 0.5;
            for (int i = 0; i < 3; i++) {
              value += amplitude * noise(p);
              p *= 2.0;
              amplitude *= 0.5;
            }
            return value;
          }

          float rayleighPhase(float cosTheta) {
            return THREE_OVER_SIXTEENPI * (1.0 + pow(cosTheta, 2.0));
          }

          float hgPhase(float cosTheta, float g) {
            float g2 = pow(g, 2.0);
            float inverse = 1.0 / pow(1.0 - 2.0 * g * cosTheta + g2, 1.5);
            return ONE_OVER_FOURPI * ((1.0 - g2) * inverse);
          }

          void main() {
            vec2 ndc = vUv * 2.0 - 1.0;
            float tanHalfFov = tan(radians(cameraFov) * 0.5);
            vec3 cameraDirection = normalize(vec3(
              ndc.x * cameraAspect * tanHalfFov,
              ndc.y * tanHalfFov,
              -1.0
            ));
            vec3 direction = normalize(skyRotation * cameraDirection);

            vec3 sunDirection = normalize(sunPosition);
            float sunE = sunIntensity(dot(sunDirection, up));
            float sunfade = 1.0 - clamp(1.0 - exp((sunPosition.y / 450000.0)), 0.0, 1.0);
            float rayleighCoefficient = rayleigh - (1.0 * (1.0 - sunfade));
            vec3 betaR = totalRayleigh * rayleighCoefficient;
            vec3 betaM = totalMie(turbidity) * mieCoefficient;

            float zenithAngle = acos(max(0.0, dot(up, direction)));
            float inverse = 1.0 / (cos(zenithAngle) + 0.15 * pow(93.885 - ((zenithAngle * 180.0) / pi), -1.253));
            float sR = rayleighZenithLength * inverse;
            float sM = mieZenithLength * inverse;

            vec3 Fex = exp(-(betaR * sR + betaM * sM));
            float cosTheta = dot(direction, sunDirection);
            float rPhase = rayleighPhase(cosTheta * 0.5 + 0.5);
            vec3 betaRTheta = betaR * rPhase;
            float mPhase = hgPhase(cosTheta, mieDirectionalG);
            vec3 betaMTheta = betaM * mPhase;

            vec3 Lin = pow(sunE * ((betaRTheta + betaMTheta) / (betaR + betaM)) * (1.0 - Fex), vec3(1.5));
            Lin *= mix(
              vec3(1.0),
              pow(sunE * ((betaRTheta + betaMTheta) / (betaR + betaM)) * Fex, vec3(1.0 / 2.0)),
              clamp(pow(1.0 - dot(up, sunDirection), 5.0), 0.0, 1.0)
            );

            vec3 L0 = vec3(0.1) * Fex;
            float sundisc = smoothstep(sunAngularDiameterCos, sunAngularDiameterCos + 0.00002, cosTheta) * showSunDisc;
            L0 += (sunE * 19000.0 * Fex) * sundisc;

            vec3 texColor = (Lin + L0) * 0.04 + vec3(0.0, 0.0003, 0.00075);

            if (direction.y > 0.0 && cloudCoverage > 0.0) {
              float elevation = mix(1.0, 0.1, cloudElevation);
              vec2 cloudUV = direction.xz / max(direction.y * elevation, 0.001);
              cloudUV *= cloudScale;
              cloudUV += time * cloudSpeed;

              float cloudNoise = fbmFast(cloudUV * 1000.0);
              if (cloudQuality > 0.5) {
                cloudNoise = (cloudNoise + 0.35 * fbmFast(cloudUV * 2000.0 + 3.7)) / 1.35;
              }
              if (cloudQuality > 0.85) {
                cloudNoise = mix(cloudNoise, fbm(cloudUV * 1600.0 + 9.1), 0.3);
              }

              float cloudMask = smoothstep(1.0 - cloudCoverage, 1.0 - cloudCoverage + 0.3, cloudNoise);
              float horizonFade = smoothstep(0.0, 0.1 + 0.2 * cloudElevation, direction.y);
              cloudMask *= horizonFade;

              float sunInfluence = dot(direction, sunDirection) * 0.5 + 0.5;
              float daylight = max(0.0, sunDirection.y * 2.0);
              vec3 atmosphereColor = Lin * 0.04;
              vec3 cloudColor = mix(vec3(0.3), vec3(1.0), daylight);
              cloudColor = mix(cloudColor, atmosphereColor + vec3(1.0), sunInfluence * 0.5);
              cloudColor *= sunE * 0.00002;

              texColor = mix(texColor, cloudColor, cloudMask * cloudDensity);
            }

            gl_FragColor = vec4(texColor, 1.0);

            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }
        `,
        depthWrite: false,
        depthTest: false
      });

      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = 'FullscreenSky';
      mesh.frustumCulled = false;
      mesh.renderOrder = -100001;
      mesh.visible = false;
      return mesh;
    }

    function createStarField() {
      const { THREE } = state;
      const starCount = 520;
      const starGeometry = new THREE.BufferGeometry();
      const starPositions = new Float32Array(starCount * 3);
      const twinklePhase = new Float32Array(starCount);
      const twinkleSpeed = new Float32Array(starCount);
      const twinkleBase = new Float32Array(starCount);
      const twinkleStrength = new Float32Array(starCount);
      const radius = Math.min(80, (state.camera?.far || 120) * 0.72);
      for (let i = 0; i < starCount; i += 1) {
        const azimuth = Math.random() * Math.PI * 2;
        const elevation = THREE.MathUtils.degToRad(8 + Math.random() * 74);
        const distance = radius * (0.82 + Math.random() * 0.18);
        const horizonFlatten = Math.cos(elevation);
        starPositions[i * 3] = Math.cos(azimuth) * horizonFlatten * distance;
        starPositions[i * 3 + 1] = Math.sin(elevation) * distance;
        starPositions[i * 3 + 2] = Math.sin(azimuth) * horizonFlatten * distance;
        twinklePhase[i] = Math.random() * Math.PI * 2;
        twinkleSpeed[i] = 0.15 + Math.random() * 0.9;
        twinkleBase[i] = 0.12 + Math.random() * 0.25;
        twinkleStrength[i] = 0.35 + Math.random() * 0.65;
      }
      starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      starGeometry.setAttribute('aPhase', new THREE.BufferAttribute(twinklePhase, 1));
      starGeometry.setAttribute('aSpeed', new THREE.BufferAttribute(twinkleSpeed, 1));
      starGeometry.setAttribute('aBase', new THREE.BufferAttribute(twinkleBase, 1));
      starGeometry.setAttribute('aStrength', new THREE.BufferAttribute(twinkleStrength, 1));
      const starMaterial = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uOpacity: { value: 0 },
          uPointSize: { value: 3.8 }
        },
        vertexShader: `
          attribute float aPhase;
          attribute float aSpeed;
          attribute float aBase;
          attribute float aStrength;
          uniform float uTime;
          uniform float uOpacity;
          uniform float uPointSize;
          varying float vBrightness;
          varying float vDomeY;

          void main() {
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            vec3 domeOrigin = (modelMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
            vec3 domePoint = (modelMatrix * vec4(position, 1.0)).xyz;
            vDomeY = normalize(domePoint - domeOrigin).y;
            float waveA = sin(uTime * aSpeed + aPhase) * 0.5 + 0.5;
            float waveB = sin(uTime * (aSpeed * 2.37) + aPhase * 1.91) * 0.5 + 0.5;
            float sparkle = pow(waveB, 10.0) * 0.55;
            vBrightness = clamp((aBase + waveA * aStrength * 0.55 + sparkle) * uOpacity, 0.0, 1.0);
            gl_PointSize = uPointSize;
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          varying float vBrightness;
          varying float vDomeY;

          void main() {
            if (vDomeY <= 0.0) discard;
            vec2 uv = gl_PointCoord * 2.0 - 1.0;
            float dist = length(uv);
            float alpha = smoothstep(1.0, 0.18, dist) * vBrightness;
            if (alpha < 0.01) discard;
            gl_FragColor = vec4(vec3(1.0), alpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        depthTest: false,
        blending: THREE.AdditiveBlending,
        toneMapped: false
      });
      const stars = new THREE.Points(starGeometry, starMaterial);
      stars.layers.set(1);
      stars.frustumCulled = false;
      stars.renderOrder = -99999;
      return stars;
    }

    function getStarDomeBaseQuaternion() {
      const { THREE } = state;
      if (!THREE) return null;
      const cached = state.assetRefs.starDomeBaseQuaternion;
      if (cached) return cached;
      const latitude = THREE.MathUtils.degToRad(STAR_DOME_LATITUDE_DEG);
      const celestialPole = new THREE.Vector3(0, Math.sin(latitude), -Math.cos(latitude)).normalize();
      const baseQuaternion = new THREE.Quaternion().setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        celestialPole
      );
      state.assetRefs.starDomeBaseQuaternion = baseQuaternion;
      return baseQuaternion;
    }

    function applyStarDomeTransform(stars, skyCamera, nowSeconds = 0) {
      const { THREE } = state;
      if (!THREE || !stars || !skyCamera) return;
      stars.position.copy(skyCamera.position);
      const baseQuaternion = getStarDomeBaseQuaternion();
      const spinQuaternion = state.assetRefs.starDomeSpinQuaternion || (state.assetRefs.starDomeSpinQuaternion = new THREE.Quaternion());
      const domeQuaternion = state.assetRefs.starDomeQuaternion || (state.assetRefs.starDomeQuaternion = new THREE.Quaternion());
      const spinAxis = state.assetRefs.starDomeSpinAxis || (state.assetRefs.starDomeSpinAxis = new THREE.Vector3(0, 1, 0));
      spinQuaternion.setFromAxisAngle(spinAxis, nowSeconds * STAR_SIDEREAL_ROTATION_RATE);
      stars.quaternion.copy(domeQuaternion.copy(baseQuaternion).multiply(spinQuaternion));
    }

    function updateStarField(nowSeconds = 0) {
      const stars = state.assetRefs.stars;
      if (!stars?.material?.uniforms) return;
      const opacity = getCurrentStarOpacity();
      stars.visible = opacity > 0.001;
      if (!stars.visible) return;
      const skyCamera = state.assetRefs.skyCamera;
      if (skyCamera) {
        applyStarDomeTransform(stars, skyCamera, nowSeconds);
      }
      stars.material.uniforms.uOpacity.value = Math.min(1.4, opacity * 1.35);
      stars.material.uniforms.uTime.value = nowSeconds;
    }

    function addIslandSpotlight(islandData, options = {}) {
      const { THREE, stage } = state;
      if (!THREE || !stage || !islandData?.group) return null;

      const {
        offset = new THREE.Vector3(3, 6, 3),
        color = 0xffffff,
        intensity = ISLAND_SPOTLIGHT_INTENSITY,
        distance = 24,
        angle = Math.PI / 6,
        penumbra = 0.45,
        decay = 2
      } = options;

      const light = new THREE.SpotLight(color, intensity, distance, angle, penumbra, decay);
      light.name = `Spot_${islandData.id}`;
      light.castShadow = false;

      const target = new THREE.Object3D();
      target.name = `SpotTarget_${islandData.id}`;
      target.position.copy(islandData.group.position);
      stage.add(target);

      const offsetWorld = offset.clone();
      offsetWorld.applyEuler(islandData.group.rotation);
      light.position.copy(islandData.group.position).add(offsetWorld);
      light.target = target;
      stage.add(light);

      if (!state.assetRefs.islandSpotlights) {
        state.assetRefs.islandSpotlights = {};
      }
      state.assetRefs.islandSpotlights[islandData.id] = { light, target };
      return light;
    }

    function initSky() {
      const { THREE, renderer, scene, camera } = state;
      if (!THREE || !renderer || !scene || !camera) return;

      const sky = new Sky();
      sky.scale.setScalar(camera.far * 0.9);
      sky.layers.set(1);
      sky.renderOrder = -100000;
      sky.material.depthWrite = false;
      sky.material.depthTest = false;
      scene.add(sky);
      state.assetRefs.sky = sky;
      const fullscreenSky = createFullscreenSkyMesh(sky.material.uniforms);
      if (fullscreenSky) {
        scene.add(fullscreenSky);
        state.assetRefs.fullscreenSky = fullscreenSky;
      }
      state.assetRefs.sunBase = new THREE.Vector3();
      initHorizonBackdrop();
      setSkyPresetSmooth('sunset', { duration: 0.6 });
    }

    function easeInOut(t) {
      return t * t * (3 - 2 * t);
    }

    function markViewportDirty() {
      if (!state.layout) return;
      state.layout.viewportDirty = true;
    }

    function markScrollDirty() {
      if (!state.layout) return;
      state.layout.scrollDirty = true;
    }

    function updateScroll({ force = false } = {}) {
      if (!force && !state.layout?.scrollDirty) return false;
      const { THREE } = state;
      const rect = sceneWrap.getBoundingClientRect();
      const total = Math.max(sceneWrap.offsetHeight - window.innerHeight * 0.6, 1);
      const offset = THREE.MathUtils.clamp((headerEl ? headerEl.offsetHeight : 0) - rect.top, 0, total);
      state.scroll.target = offset / total;
      state.layout.scrollDirty = false;
      return true;
    }

    function resizeRenderer({ force = false } = {}) {
      const { renderer, camera } = state;
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const renderScale = document.hasFocus() ? MAIN_RENDER_SCALE_FOCUSED : MAIN_RENDER_SCALE_UNFOCUSED;
      const layout = state.layout;
      if (
        !force &&
        layout &&
        !layout.viewportDirty &&
        layout.lastCanvasWidth === width &&
        layout.lastCanvasHeight === height &&
        layout.lastRenderScale === renderScale
      ) {
        return false;
      }
      const scaledWidth = Math.max(1, width * renderScale);
      const scaledHeight = Math.max(1, height * renderScale);
      let resized = false;
      if (canvas.width !== Math.floor(scaledWidth) || canvas.height !== Math.floor(scaledHeight)) {
        renderer.setPixelRatio(1);
        renderer.setSize(scaledWidth, scaledHeight, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        syncSkyCameraProjection();
        resized = true;
      }
      if (resized) {
        updateHorizonBackdrop();
      }
      if (layout) {
        layout.viewportDirty = false;
        layout.lastCanvasWidth = width;
        layout.lastCanvasHeight = height;
        layout.lastRenderScale = renderScale;
      }
      return resized;
    }

    function resetHoveredInteractive() {
      if (!state.hovered) return;
      const hovered = state.hovered;
      if (hovered.userData?.onLeave) {
        hovered.userData.onLeave(hovered, state.assetRefs?.lastPointerHit || null);
      }
      const material = Array.isArray(hovered.material) ? hovered.material[0] : hovered.material;
      if (material?.emissive) {
        material.emissiveIntensity = hovered.userData.baseEmissive ?? material.emissiveIntensity;
      }
      if (hovered.userData.glowEdge) {
        hovered.userData.glowEdge.material.opacity = 0.25;
      }
      state.hovered = null;
    }

    function setHoveredInteractive(mesh, hitInfo = null) {
      if (state.hovered === mesh) {
        if (mesh?.userData?.onPointerMove && hitInfo) {
          mesh.userData.onPointerMove(mesh, hitInfo);
        }
        return;
      }
      resetHoveredInteractive();
      if (!mesh) return;
      state.hovered = mesh;
      if (mesh.userData?.onHover) {
        mesh.userData.onHover(mesh, hitInfo);
      }
      const material = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
      if (material?.emissive) {
        mesh.userData.baseEmissive = mesh.userData.baseEmissive ?? material.emissiveIntensity ?? 0;
        material.emissiveIntensity = (mesh.userData.baseEmissive ?? 0) + 0.25;
      }

          const target = state.assetRefs.crtInteractiveMesh;
          if (!target || state.assetRefs.cameraMode === 'free') return null;
          rayPointer.set(state.pointerTarget.x, -state.pointerTarget.y);
          raycaster.setFromCamera(rayPointer, state.camera);
          return raycaster.intersectObject(target, false)[0] || null;
        };

        const getForwardableCrtPointerHit = () => {
          const immediateHit = getImmediateCrtPointerHit();
          if (immediateHit?.object === state.assetRefs.crtInteractiveMesh) {
            crtPointerLastHit = immediateHit;
            return immediateHit;
          }
          const previousHit = state.assetRefs.lastPointerHit;
          if (previousHit?.object === state.assetRefs.crtInteractiveMesh) {
            crtPointerLastHit = previousHit;
            return previousHit;
          }
          return null;
        };

        const updatePointer = event => {
          const rect = sceneWrap.getBoundingClientRect();
          state.pointerTarget.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          state.pointerTarget.y = ((event.clientY - rect.top) / rect.height) * 2 - 1;
          state.pointerActive = true;
          requestPointerRender();
          if (state.assetRefs.focusMode === 'crt') {
            const hit = getForwardableCrtPointerHit();
            if (hit) {
              forwardCrtPointer('pointermove', event, hit);
            }
          }
        };

        sceneWrap.addEventListener('pointerenter', () => {
          state.pointerActive = true;
          scheduleNextRender();
        });
        sceneWrap.addEventListener('pointermove', updatePointer);
        sceneWrap.addEventListener('pointerdown', event => {
          updatePointer(event);
          requestRenderHold(900);
          if (state.assetRefs.focusMode === 'crt') {
            const hit = getForwardableCrtPointerHit();
            if (hit) {
              crtPointerDragActive = true;
              crtPointerId = event.pointerId ?? 1;
              sceneWrap.setPointerCapture?.(crtPointerId);
              forwardCrtPointer('pointerdown', event, hit);
            }
          }
        });
        sceneWrap.addEventListener('pointerup', event => {
          scheduleNextRender();
          if (state.assetRefs.focusMode === 'crt') {
            const hit = getForwardableCrtPointerHit() || crtPointerLastHit;
            if (hit) {
              forwardCrtPointer('pointerup', event, hit);
            }
          }
          if (crtPointerDragActive) {
            if (sceneWrap.hasPointerCapture?.(crtPointerId)) {
              sceneWrap.releasePointerCapture?.(crtPointerId);
            }
          }
          crtPointerDragActive = false;
        });
        sceneWrap.addEventListener('pointerleave', event => {
          if (state.assetRefs.focusMode === 'crt' && crtPointerDragActive && crtPointerLastHit) {
            forwardCrtPointer('pointerup', event, crtPointerLastHit);
          }
          state.pointerActive = false;
          state.pointerTarget.x = 0;
          state.pointerTarget.y = 0;
          if (crtPointerDragActive) {
            if (sceneWrap.hasPointerCapture?.(crtPointerId)) {
              sceneWrap.releasePointerCapture?.(crtPointerId);
            }
          }
          crtPointerDragActive = false;
          crtPointerLastHit = null;
          setHoveredInteractive(null);
          state.assetRefs.lastPointerHit = null;
          syncIslandHoverStates([]);
          scheduleNextRender();
        });

        sceneWrap.addEventListener('click', event => {
          requestRenderHold(900);
          if (state.assetRefs.cameraMode === 'free') {
            return;
          }
          if (state.assetRefs.focusMode === 'crt') {
            const hit = state.assetRefs.lastPointerHit;
            if (hit?.object && hit.object === state.assetRefs.crtInteractiveMesh) {
              forwardCrtPointer('click', event, hit);
              return;
            }
            exitCrtFocus();
            return;
          }
          if (state.hovered && state.hovered.userData?.onClick) {
            state.hovered.userData.onClick(state.assetRefs?.lastPointerHit || null);
            return;
          }
        });

        sceneWrap.addEventListener('wheel', event => {
          if (state.assetRefs.focusMode === 'crt') {
            const hit = state.assetRefs.lastPointerHit;
            if (hit?.object && hit.object === state.assetRefs.crtInteractiveMesh) {
              forwardCrtPointer('wheel', event, hit);
              event.preventDefault();
            }
          }
          requestRenderHold(900);
        }, { passive: false });

        window.addEventListener('scroll', () => {
          markScrollDirty();
          requestRenderHold(1200);
        }, { passive: true });
        window.addEventListener('resize', () => {
          markViewportDirty();
          markScrollDirty();
          requestRenderHold(1500);
        });
        window.addEventListener('focus', () => {
          markViewportDirty();
          requestRenderHold(1500);
        });
        window.addEventListener('blur', () => {
          markViewportDirty();
          requestRenderHold(500);
        });

        function renderFrame() {
          state.assetRefs.renderFrameHandle = 0;
          const now = performance.now();
          tickFpsDiag(now);
          resizeRenderer();

          const delta = state.clock ? state.clock.getDelta() : 0;
          const elapsed = state.clock ? state.clock.elapsedTime : 0;
          const skyUniforms = state.assetRefs.sky?.material?.uniforms;
          if (skyUniforms?.time) {
            skyUniforms.time.value = (skyControlState.animateTime ? elapsed * skyControlState.timeScale : skyControlState.manualTime) + skyControlState.timeOffset;
            if (skyControlState.animateTime) {
              state.assetRefs.skyBackdropDirty = true;
            }
          }

          if (state.updaters.length) {
            const updaterContext = { delta, elapsed, now };
            state.updaters.forEach(update => {
              if (update.__isActive && !update.__isActive(updaterContext)) return;
              update(updaterContext);
            });
          }

          const freeCameraControls = state.assetRefs.freeCameraControls;
          if (state.assetRefs.cameraMode === 'free' && freeCameraControls?.enabled) {
            freeCameraControls.update();
          }

          state.pointer.x += (state.pointerTarget.x - state.pointer.x) * 0.85;
          state.pointer.y += (state.pointerTarget.y - state.pointer.y) * 0.45;

          const freeCameraMode = state.assetRefs.cameraMode === 'free';
          if (freeCameraMode) {
            setHoveredInteractive(null);
            state.assetRefs.lastPointerHit = null;
            syncIslandHoverStates([]);
          } else if (state.pointerActive) {
            const lastRaycastTime = state.assetRefs.lastRaycastTime || 0;
            const lastRaycastX = state.assetRefs.lastRaycastPointerX ?? Infinity;
            const lastRaycastY = state.assetRefs.lastRaycastPointerY ?? Infinity;
            const raycastPointerMoved = Math.abs(state.pointer.x - lastRaycastX) > 0.002 || Math.abs(state.pointer.y - lastRaycastY) > 0.002;
            const shouldRaycast = raycastPointerMoved || now - lastRaycastTime > 33;
            if (shouldRaycast) {
              state.assetRefs.lastRaycastTime = now;
              state.assetRefs.lastRaycastPointerX = state.pointer.x;
              state.assetRefs.lastRaycastPointerY = state.pointer.y;
              rayPointer.set(state.pointer.x, -state.pointer.y);
              raycaster.setFromCamera(rayPointer, state.camera);
              const broadTargets = state.raycast?.broad || [];
              const broadHits = state.raycast?.broadHits || [];
              broadHits.length = 0;
              const broadIntersections = broadTargets.length
                ? raycaster.intersectObjects(broadTargets, false, broadHits)
                : [];
              syncIslandHoverStates(broadIntersections);
              const activeKeys = state.assetRefs.hoveredActivityKeys;
              const candidates = getRaycastCandidateArray(activeKeys);
              const detailHits = state.raycast?.detailHits || [];
              detailHits.length = 0;
              const intersections = candidates.length
                ? raycaster.intersectObjects(candidates, false, detailHits)
                : [];
              const hitEntry =
                intersections.find(intersection => !intersection.object.userData?.pointerPassthrough) ||
                broadIntersections[0] ||
                intersections[0] ||
                null;
              state.assetRefs.lastPointerHit = hitEntry;
              setHoveredInteractive(hitEntry ? hitEntry.object : null, hitEntry);
            }
          } else {
            setHoveredInteractive(null);
            state.assetRefs.lastPointerHit = null;
            syncIslandHoverStates([]);
          }
          const hoverSet = state.assetRefs.hoveredActivityKeys;
          const pointerOverNorth = !!(state.pointerActive && hoverSet && hoverSet.has('island:north'));

          updateScroll();
          state.scroll.current += (state.scroll.target - state.scroll.current) * 0.08;
          const easedScroll = easeInOut(state.scroll.current);

          const focusMode = state.assetRefs.focusMode;
          const targetY = focusMode || freeCameraMode
            ? state.stage.rotation.y
            : -state.pointer.x * 0.2 * (1 - easedScroll);
          const targetX = focusMode || freeCameraMode
            ? state.stage.rotation.x
            : THREE.MathUtils.clamp(state.pointer.y * 0.08, -0.18, 0.18) * (1 - easedScroll);
          state.stage.rotation.y += (targetY - state.stage.rotation.y) * 0.05;
          state.stage.rotation.x += (targetX - state.stage.rotation.x) * 0.05;
          updateSkyCamera();
          updateSkyExperimentPresentation();

          state.stage.position.y = 1.55 + easedScroll * 2.8;
          state.stage.position.z = -4.8 - easedScroll * 2.2;
          state.stage.scale.setScalar(1 - easedScroll * 0.16);

          const backdrop = state.stage.userData?.backdrop;
          if (stats) stats.update();
          updatePerfOverlay(now);

          if (backdrop) {
            const targetQuat = state.assetRefs.backdropTargetQuat || (state.assetRefs.backdropTargetQuat = new THREE.Quaternion());
            targetQuat.copy(state.stage.quaternion).invert().multiply(state.camera.quaternion);
            backdrop.quaternion.copy(targetQuat);
          }

          if (bgTitleEl) {
            const opacity = Math.max(0.25, 1 - easedScroll * 1.1);
            const translateY = -easedScroll * 180;
            if (Math.abs((state.assetRefs.bgTitleOpacity ?? -1) - opacity) > 0.001) {
              state.assetRefs.bgTitleOpacity = opacity;
              bgTitleEl.style.opacity = opacity.toFixed(3);
            }
            if (Math.abs((state.assetRefs.bgTitleTranslateY ?? Infinity) - translateY) > 0.05) {
              state.assetRefs.bgTitleTranslateY = translateY;
              bgTitleEl.style.transform = `translate3d(0, ${translateY}px, 0)`;
            }
          }

          if (projectsSection) {
            const projectEase = THREE.MathUtils.clamp((state.scroll.current - 0.2) / 0.6, 0, 1);
            const translateY = 36 * (1 - projectEase);
            if (Math.abs((state.assetRefs.projectsOpacity ?? -1) - projectEase) > 0.001) {
              state.assetRefs.projectsOpacity = projectEase;
              projectsSection.style.opacity = projectEase.toFixed(3);
            }
            if (Math.abs((state.assetRefs.projectsTranslateY ?? Infinity) - translateY) > 0.05) {
              state.assetRefs.projectsTranslateY = translateY;
              projectsSection.style.transform = `translateY(${translateY}px)`;
            }
          }
          updateStarField(elapsed);

          const nowTime = now;
          const pointerMotion = Math.abs(state.pointer.x - state.pointerTarget.x) > 0.0008 || Math.abs(state.pointer.y - state.pointerTarget.y) > 0.0008;
          const scrollMotion = Math.abs(state.scroll.target - state.scroll.current) > 0.0005;
          const hoverActive = Boolean(hoverSet && hoverSet.size);
          const shouldRenderActive =
            pointerOverNorth ||
            hoverActive ||
            pointerMotion ||
            scrollMotion ||
            state.assetRefs.focusMode === 'crt' ||
            freeCameraMode;
          if (shouldRenderActive) {
            const activeKey = [
              pointerOverNorth ? 'north' : '',
              hoverActive ? 'hover' : '',
              pointerMotion ? 'pointer' : '',
              scrollMotion ? 'scroll' : '',
              state.assetRefs.focusMode === 'crt' ? 'crt' : '',
              freeCameraMode ? 'free' : ''
            ].filter(Boolean).join('|');
            const holdRemaining = (state.renderHoldUntil || 0) - nowTime;
            if (!state.assetRefs.renderActiveLast || state.assetRefs.renderActiveKey !== activeKey || holdRemaining < 240) {
              requestRenderHold(850);
            }
            state.assetRefs.renderActiveKey = activeKey;
          }
          state.assetRefs.renderActiveLast = shouldRenderActive;
          const mode = getSkyRenderMode();
          const skyBackdropDue = usesSkyBackdropCache(mode) &&
            isSkyCacheAnimated(mode) &&
            document.hasFocus() &&
            nowTime - (state.assetRefs.skyBackdropLastRender || 0) > (
              state.assetRefs.stars?.visible ? STAR_SKY_CACHE_INTERVAL_MS : (1000 / 60)
            );
          const skyVisualInterval = shouldRenderActive ? (1000 / 60) : IDLE_SKY_VISUAL_INTERVAL_MS;
          const skyVisualDue = isSkyVisualAnimating(mode) &&
            nowTime - (state.assetRefs.skyVisualLastRender || 0) > skyVisualInterval;
          const shouldRenderFrame = shouldRenderActive || skyBackdropDue || skyVisualDue || Boolean(state.assetRefs.skyBackdropDirty) || (state.renderHoldUntil || 0) > nowTime;

          if (shouldRenderFrame) {
            updateSkyBackdropCache(nowTime);
            state.renderer.render(state.scene, state.camera);
            state.assetRefs.skyVisualLastRender = nowTime;
            recordSkyRenderDiag(nowTime);
            state.lastIdleRender = nowTime;
          } else if (!state.lastIdleRender || nowTime - state.lastIdleRender > (document.hasFocus() ? IDLE_RENDER_INTERVAL_FOCUSED_MS : IDLE_RENDER_INTERVAL_UNFOCUSED_MS)) {
            updateSkyBackdropCache(nowTime);
            state.renderer.render(state.scene, state.camera);
            state.assetRefs.skyVisualLastRender = nowTime;
            recordSkyRenderDiag(nowTime);
            state.lastIdleRender = nowTime;
          }
          const nextDelay = shouldRenderFrame
            ? 0
            : (document.hasFocus() ? IDLE_RENDER_INTERVAL_FOCUSED_MS : IDLE_RENDER_INTERVAL_UNFOCUSED_MS);
          scheduleNextRender(nextDelay);
        }

        state.assetRefs.renderFrameFn = renderFrame;
        scheduleNextRender();
        resizeRenderer({ force: true });
        updateScroll({ force: true });
      } catch (error) {
        root.classList.remove('has-webgl');
        root.classList.add('no-webgl');
        console.error('Failed to start Three.js scene:', error);
      }
    }
  </script>
