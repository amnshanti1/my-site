  const material = new THREE.RawShaderMaterial({
    glslVersion: THREE.GLSL3,
    uniforms: {
      base: { value: new THREE.Color(0x798aa0) },
      map: { value: texture },
      cameraPos: { value: new THREE.Vector3() },
      threshold: { value: threshold },
      opacity: { value: opacity },
      range: { value: range },
      steps: { value: steps },
      frame: { value: 0 },
      scroll: { value: new THREE.Vector3() }
    },
    vertexShader,
    fragmentShader,
    side: THREE.BackSide,
    transparent: true,
    depthWrite: true,
    depthTest: true,
    blending: THREE.NormalBlending
  });

  const geometry = new THREE.BoxGeometry(1, 1, 1);
  geometry.computeBoundingBox();
  const mesh = new THREE.Mesh(geometry, material);
  const [scaleX, scaleY, scaleZ] = dimensions;
  mesh.scale.set(scaleX, scaleY, scaleZ);
  mesh.castShadow = false;
  mesh.receiveShadow = false;

  const scrollVector = new THREE.Vector3(...scrollSpeed);
  const accumulatedScroll = new THREE.Vector3();
  const wrapScalar = value => {
    const mod = value % 1;
    return mod < 0 ? mod + 1 : mod;
  };

  registerUpdater(({ delta = 0 }) => {
    if (!mesh.parent) return;
    if (activityKey && !isIslandAnimationActive(activityKey)) return;
    material.uniforms.cameraPos.value.copy(state.camera.position);
    const motionFactor = getLaunchMotionFactor();
    material.uniforms.frame.value += motionFactor;
    if (motionFactor > 0) {
      accumulatedScroll.addScaledVector(scrollVector, delta * motionFactor);
    }
    const scroll = material.uniforms.scroll.value;
    scroll.set(
      wrapScalar(accumulatedScroll.x),
      wrapScalar(accumulatedScroll.y),
      wrapScalar(accumulatedScroll.z)
    );
  });

  return mesh;

      const materials = Array.isArray(material) ? material : [material];
      materials.forEach(mat => {
        mat.opacity = opacity;
        mat.transparent = true;
        mat.depthWrite = false;
      });
    }

    function createStage() {
      const { THREE } = state;
      const stage = new THREE.Group();
      stage.position.set(-0.6, 1.55, -4.8);

      const islandsGroup = new THREE.Group();
      islandsGroup.name = 'Islands';
      stage.add(islandsGroup);
      stage.userData.islandsGroup = islandsGroup;

      if (DEBUG_HELPERS_VISIBLE) {
        const grid = new THREE.GridHelper(40, 40, 0x6ec5ff, 0x3e7dff);
        grid.position.y = 0;
        grid.renderOrder = -1;
        applyLineOpacity(grid.material, 0.55);
        const gridMaterials = Array.isArray(grid.material) ? grid.material : [grid.material];
        gridMaterials.forEach((mat, index) => {
          mat.color.setHex(index === 0 ? 0xa3d9ff : 0x4c9dff);
        });
        stage.add(grid);

        const axes = new THREE.AxesHelper(3.6);
        axes.material.depthTest = false;
        axes.material.transparent = true;
        axes.material.opacity = 0.6;
        axes.renderOrder = 1;
        stage.add(axes);

        const axisLabels = {
          x: createDebugLabel('X', { color: '#ff8e76' }),
          y: createDebugLabel('Y', { color: '#9bff86' }),
          z: createDebugLabel('Z', { color: '#76b6ff' })
        };
        axisLabels.x.scale.multiplyScalar(0.6);
        axisLabels.y.scale.multiplyScalar(0.6);
        axisLabels.z.scale.multiplyScalar(0.6);
        axisLabels.x.position.set(3.9, 0.1, 0);
        axisLabels.y.position.set(0, 3.9, 0);
        axisLabels.z.position.set(0, 0.1, 3.9);
        Object.values(axisLabels).forEach(label => {
          label.material.depthTest = false;
          stage.add(label);
        });

        const originMarker = new THREE.Mesh(
          new THREE.SphereGeometry(0.12, 22, 22),
          new THREE.MeshBasicMaterial({ color: 0xff86bd })
        );
        originMarker.position.set(0, 0.06, 0);
        stage.add(originMarker);

        const originRing = new THREE.Mesh(
          new THREE.RingGeometry(0.48, 0.52, 48),
          new THREE.MeshBasicMaterial({ color: 0xff86bd, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
        );
        originRing.rotation.x = -Math.PI / 2;
        stage.add(originRing);

        const labels = [];
        const labelExtent = 5;
        const labelStep = 1;
        for (let x = -labelExtent; x <= labelExtent; x += labelStep) {
          if (x === 0) continue;
          const xLabel = createDebugLabel(`${x}`);
          xLabel.position.set(x, 0.04, 0);
          stage.add(xLabel);
          labels.push(xLabel);
        }
        for (let z = -labelExtent; z <= labelExtent; z += labelStep) {
          if (z === 0) continue;
          const zLabel = createDebugLabel(`${z}`);
          zLabel.position.set(0, 0.04, z);
          stage.add(zLabel);
          labels.push(zLabel);
        }

        stage.userData.debugHelpers = { grid, axes, originMarker, originRing, labels, axisLabels };
      }

      return stage;
    }

    function createIsland({
      id,
      position = [0, 0, 0],
      rotation = [0, 0, 0],
      scale = 1,
      footprint = {},
      anchors: anchorOverrides = {}
    }) {
      const { THREE } = state;
      const islandRoot = new THREE.Group();
      islandRoot.name = `Island_${id}`;

      const rawScale = Array.isArray(scale) ? scale : [scale, scale, scale];
      const mirrorVector = rawScale.map(value => (value < 0 ? -1 : 1));
      const magnitudeVector = rawScale.map(value => Math.abs(value));

      const platform = new THREE.Group();
      platform.name = 'IslandPlatform';
      islandRoot.add(platform);

      const islandShape = buildIslandShape(footprint);
      const extrudeSettings = { depth: 0.42, bevelEnabled: false, curveSegments: 48, steps: 1 };
      const baseGeometry = new THREE.ExtrudeGeometry(islandShape, extrudeSettings);
      baseGeometry.scale(mirrorVector[0], mirrorVector[1], mirrorVector[2]);
      baseGeometry.computeVertexNormals();

      const base = new THREE.Mesh(
        baseGeometry,
        new THREE.MeshStandardMaterial({ color: 0x1d2f53, metalness: 0.3, roughness: 0.64, side: THREE.DoubleSide })
      );
      base.rotation.x = -Math.PI / 2;
      base.receiveShadow = true;
      platform.add(base);

      const anchors = {
        deckTop: new THREE.Group(),
        frontWall: new THREE.Group()
      };

      anchors.deckTop.position.set(0, 0, 0);
      const mirroredFrontWallPosition = [1.4, 0, -1.2].map((value, index) => value * mirrorVector[index]);
      anchors.frontWall.position.set(...mirroredFrontWallPosition);
      anchors.frontWall.rotation.set(0, 0, 0);

      const anchorGlobalPositionOverrides = {};
      if (anchorOverrides.deckTop?.position) {
        const [gx, gy, gz] = anchorOverrides.deckTop.position;
        anchorGlobalPositionOverrides.deckTop = new THREE.Vector3(gx, gy, gz);
      }
      if (anchorOverrides.deckTop?.rotation) {
        anchors.deckTop.rotation.set(...anchorOverrides.deckTop.rotation);
      }
      if (anchorOverrides.frontWall?.position) {
        const [gx, gy, gz] = anchorOverrides.frontWall.position;
        anchorGlobalPositionOverrides.frontWall = new THREE.Vector3(gx, gy, gz);
      }
      if (anchorOverrides.frontWall?.rotation) {
        anchors.frontWall.rotation.set(...anchorOverrides.frontWall.rotation);
      }

      islandRoot.add(anchors.deckTop);
      islandRoot.add(anchors.frontWall);

      let debugMarker = null;
      const anchorMarkers = {};
      if (DEBUG_HELPERS_VISIBLE) {
        const debugGroup = new THREE.Group();
        debugGroup.name = `IslandCenter_${id}`;

        const orb = new THREE.Mesh(
          new THREE.SphereGeometry(0.08, 26, 26),
          new THREE.MeshBasicMaterial({ color: 0xfff1c7, transparent: true, opacity: 0.92, depthTest: false, depthWrite: false })
        );
        orb.position.set(0, 0, 0);
        debugGroup.add(orb);

        const idLabel = createDebugLabel(id.toUpperCase(), { color: '#ffe59a' });
        idLabel.position.set(0, 0.42, 0);
        debugGroup.add(idLabel);

        islandRoot.add(debugGroup);
        islandRoot.userData.debugCenter = debugGroup;
        debugMarker = debugGroup;

        Object.keys(anchors).forEach(key => {
          anchorMarkers[key] = null;
        });
      }

      islandRoot.updateMatrixWorld(true);
      const baseBox = new THREE.Box3().setFromObject(base);
      const baseTop = baseBox.max.y;
      const baseCenter = baseBox.getCenter(new THREE.Vector3());
      platform.position.x -= baseCenter.x;
      platform.position.y -= baseTop;
      platform.position.z -= baseCenter.z;

      if (debugMarker) {
        const size = baseBox.getSize(new THREE.Vector3());
        debugMarker.position.set(0, 0, 0);
        const labelSprite = debugMarker.children.find(child => child.isSprite);
        if (labelSprite) {
          labelSprite.position.set(0, size.y + 0.35, 0);
        }
      }
      islandRoot.updateMatrixWorld(true);

      islandRoot.position.set(...position);
      islandRoot.rotation.set(...rotation);
      islandRoot.scale.set(...magnitudeVector);

      const debugScaleInverse = {
        x: magnitudeVector[0] !== 0 ? 1 / magnitudeVector[0] : 1,
        y: magnitudeVector[1] !== 0 ? 1 / magnitudeVector[1] : 1,
        z: magnitudeVector[2] !== 0 ? 1 / magnitudeVector[2] : 1
      };

      if (debugMarker) {
        debugMarker.scale.set(debugScaleInverse.x, debugScaleInverse.y, debugScaleInverse.z);
      }

      if (Object.keys(anchorGlobalPositionOverrides).length > 0) {
        islandRoot.updateMatrixWorld(true);
        Object.entries(anchorGlobalPositionOverrides).forEach(([key, globalVec]) => {
          const local = globalVec.clone();
          islandRoot.worldToLocal(local);
          anchors[key]?.position.copy(local);
        });
      }

      const islandsGroup = state.stage?.userData?.islandsGroup || state.stage;
      islandsGroup.add(islandRoot);

      const islandData = {
        id,
        group: islandRoot,
        platform,
        baseMesh: base,
        anchors,
        marker: debugMarker,
        anchorMarkers,
        footprint,
        position: islandRoot.position,
        rotation: islandRoot.rotation,
        scale: islandRoot.scale,
        debugScaleInverse,
        createAnchor(name, { position: localPos = [0, 0, 0], rotation: localRot = [0, 0, 0], globalPosition = null } = {}) {
          if (!name) return null;
          let anchorGroup = anchors[name];
          if (!anchorGroup) {
            anchorGroup = new state.THREE.Group();
            anchorGroup.name = `Anchor_${id}_${name}`;
            anchors[name] = anchorGroup;
            islandRoot.add(anchorGroup);
            if (anchorMarkers[name] === undefined) {
              anchorMarkers[name] = null;
            }
          }

          if (globalPosition) {
            const vec = Array.isArray(globalPosition)
              ? new state.THREE.Vector3(globalPosition[0], globalPosition[1], globalPosition[2])
              : globalPosition.clone();
            islandRoot.updateMatrixWorld(true);
            const local = vec.clone();
            islandRoot.worldToLocal(local);
            anchorGroup.position.copy(local);
          } else if (localPos) {
            anchorGroup.position.set(localPos[0], localPos[1], localPos[2]);
          }

          if (localRot) {
            anchorGroup.rotation.set(localRot[0], localRot[1], localRot[2]);
          }

          if (DEBUG_HELPERS_VISIBLE && anchorMarkers[name]) {
            anchorMarkers[name].scale.set(debugScaleInverse.x, debugScaleInverse.y, debugScaleInverse.z);
          }

          return anchorGroup;
        },
        getAnchor(name) {
          return anchors[name] || null;
        },
        setAnchorGlobalPosition(name, target) {
          if (!name || !target) return;
          let anchorGroup = anchors[name];
          if (!anchorGroup) {
            anchorGroup = this.createAnchor(name);
          }
          if (!anchorGroup) return;
          const vec = Array.isArray(target)
            ? new state.THREE.Vector3(target[0], target[1], target[2])
            : target.clone();
          if (state.stage) {
            islandRoot.updateMatrixWorld(true);
            const stageWorld = state.stage.localToWorld(new state.THREE.Vector3(0, 0, 0));
            vec.add(stageWorld);
          }
          islandRoot.updateMatrixWorld(true);
          const local = vec.clone();
          islandRoot.worldToLocal(local);
          anchorGroup.position.copy(local);
          ensureAnchorMarker(anchorGroup);
        },
        getAnchorGlobalPosition(name) {
          if (!name) return null;
          let anchorGroup = anchors[name];
          if (!anchorGroup) {
            anchorGroup = this.createAnchor(name);
          }
          if (!anchorGroup) return null;
          const world = new state.THREE.Vector3();
          anchorGroup.getWorldPosition(world);
          return world;
        }
      };
      state.islands.push(islandData);
      return islandData;
    }

      if (labelCache.has(text)) return labelCache.get(text);
      const canvasEl = document.createElement('canvas');

      ctx.fillStyle = 'rgba(255, 255, 255, 0)';

      ctx.fillStyle = '#0b1326';

      ctx.fillText(text, canvasEl.width / 2, canvasEl.height / 2);

      texture.anisotropy = 8;
      labelCache.set(text, texture);
      return texture;

    function createBlankWall(anchor) {
      const { THREE } = state;
      const wallGroup = new THREE.Group();
      anchor.add(wallGroup);
      ensureAnchorMarker(anchor);

      const holeRadius = 0.62;
      const width = 3.1;
      const height = 2.1;
      const halfW = width / 2;
      const halfH = height / 2;

      const doorHole = new THREE.Path();
      const doorBottom = -halfH + 0.02;
      doorHole.moveTo(-holeRadius, doorBottom);
      doorHole.lineTo(-holeRadius, 0);
      doorHole.absarc(0, 0, holeRadius, Math.PI, 0, true);
      doorHole.lineTo(holeRadius, doorBottom);
      doorHole.lineTo(-holeRadius, doorBottom);
      doorHole.closePath();

      const panelShape = new THREE.Shape();
      panelShape.moveTo(-halfW, -halfH);
      panelShape.lineTo(halfW, -halfH);
      panelShape.lineTo(halfW, halfH);
      panelShape.lineTo(-halfW, halfH);
      panelShape.lineTo(-halfW, -halfH);
      panelShape.holes.push(doorHole);

      const panelGeometry = new THREE.ExtrudeGeometry(panelShape, {
        depth: 0.12,
        bevelEnabled: false,
        curveSegments: 32,
        steps: 1
      });
      panelGeometry.translate(0, 0, -0.06);
      const panelMaterial = new THREE.MeshStandardMaterial({

    function createBillboardTexture({ heading, subheading }) {
      const canvasEl = document.createElement('canvas');
      canvasEl.width = 4000;
      canvasEl.height = 1920;
      const ctx = canvasEl.getContext('2d');

      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      const paddingX = canvasEl.width * 0.05;
      const headingY = canvasEl.height * 0.1;
      const subheadingY = canvasEl.height * 0.25;
      const maxLineWidth = canvasEl.width - paddingX * 2;

      const drawFittedText = ({ text, weight, initialSize, maxWidth, y, color, gradientStops }) => {
        let fontSize = initialSize;
        let width = Infinity;
        while (fontSize > 20 && width > maxWidth) {
          ctx.font = `${weight} ${fontSize}px "Futura", "Inter", sans-serif`;
          width = ctx.measureText(text).width;
          if (width > maxWidth) fontSize -= 6;
        }
        ctx.font = `${weight} ${fontSize}px "Futura", "Inter", sans-serif`;
        const metrics = ctx.measureText(text);
        if (gradientStops && Array.isArray(gradientStops)) {
          const ascent = metrics.actualBoundingBoxAscent || fontSize * 0.78;
          const descent = metrics.actualBoundingBoxDescent || fontSize * 0.22;
          const textTop = y - ascent;
          const textBottom = y + descent;
          const gradient = ctx.createLinearGradient(paddingX, textTop, paddingX, textBottom + descent * 0.4);
          gradientStops.forEach(([stop, stopColor]) => gradient.addColorStop(stop, stopColor));
          ctx.fillStyle = gradient;
        } else {
          ctx.fillStyle = color;
        }
        ctx.fillText(text, paddingX, y);
        return { fontSize, width, metrics };
      };

      drawFittedText({
        text: heading.toUpperCase(),
        weight: '600',
        initialSize: canvasEl.height * 0.12,
        maxWidth: maxLineWidth * 0.45,
        y: headingY,
        color: '#3c4253'
      });

      drawFittedText({
        text: subheading.toUpperCase(),
        weight: '800',
        initialSize: canvasEl.height * 0.95,
        maxWidth: maxLineWidth,
        y: subheadingY,
        color: 'rgba(220, 235, 255, 1)',
        gradientStops: [
          [0, 'rgba(220, 235, 255, 1)'],
          [0.55, 'rgba(185, 210, 255, 0.55)'],
          [0.75, 'rgba(160, 190, 255, 0.25)'],
          [0.92, 'rgba(145, 185, 255, 0.08)'],
          [1, 'rgba(134, 187, 255, 0)']
        ]
      });

      const texture = new state.THREE.CanvasTexture(canvasEl);
      texture.anisotropy = 8;
      texture.needsUpdate = true;
      return texture;
    }

    function createStarField() {
      const { THREE } = state;
      const starCount = 320;
      const starGeometry = new THREE.BufferGeometry();
      const starPositions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i += 1) {
        starPositions[i * 3] = (Math.random() - 0.5) * 60;
        starPositions[i * 3 + 1] = Math.random() * 30 + 2;

      }
      starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));

    function addIslandSpotlight(islandData, options = {}) {
      const { THREE, stage } = state;
      if (!THREE || !stage || !islandData?.group) return null;

      const {
        offset = new THREE.Vector3(3, 6, 3),
        color = 0xffffff,
        intensity = ISLAND_SPOTLIGHT_INTENSITY,
        distance = 24,
        angle = Math.PI / 6,
        penumbra = 0.45,
        decay = 2
      } = options;

      const light = new THREE.SpotLight(color, intensity, distance, angle, penumbra, decay);
      light.name = `Spot_${islandData.id}`;
      light.castShadow = false;

      const target = new THREE.Object3D();
      target.name = `SpotTarget_${islandData.id}`;
      target.position.copy(islandData.group.position);
      stage.add(target);

      const offsetWorld = offset.clone();
      offsetWorld.applyEuler(islandData.group.rotation);
      light.position.copy(islandData.group.position).add(offsetWorld);
      light.target = target;
      stage.add(light);

      if (!state.assetRefs.islandSpotlights) {
        state.assetRefs.islandSpotlights = {};
      }
      state.assetRefs.islandSpotlights[islandData.id] = { light, target };
      return light;
    }

      const offset = THREE.MathUtils.clamp((headerEl ? headerEl.offsetHeight : 0) - rect.top, 0, total);

    function resizeRenderer() {
      const { renderer, camera } = state;
      const pixelRatio = 1//Math.min(window.devicePixelRatio, 2);
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      if (canvas.width !== Math.floor(width * pixelRatio) || canvas.height !== Math.floor(height * pixelRatio)) {
        renderer.setSize(width, height, false);
        renderer.setPixelRatio(pixelRatio);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
    }

    function resetHoveredInteractive() {
      if (!state.hovered) return;
      const hovered = state.hovered;
      if (hovered.userData?.onLeave) {
        hovered.userData.onLeave(hovered, state.assetRefs?.lastPointerHit || null);
      }
      const material = Array.isArray(hovered.material) ? hovered.material[0] : hovered.material;
      if (material?.emissive) {
        material.emissiveIntensity = hovered.userData.baseEmissive ?? material.emissiveIntensity;
      }
      if (hovered.userData.glowEdge) {
        hovered.userData.glowEdge.material.opacity = 0.25;
      }
      state.hovered = null;
    }

    function setHoveredInteractive(mesh, hitInfo = null) {
      if (state.hovered === mesh) {
        if (mesh?.userData?.onPointerMove && hitInfo) {
          mesh.userData.onPointerMove(mesh, hitInfo);
        }
        return;
      }
      resetHoveredInteractive();
      if (!mesh) return;
      state.hovered = mesh;
      if (mesh.userData?.onHover) {
        mesh.userData.onHover(mesh, hitInfo);
      }
      const material = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
      if (material?.emissive) {
        mesh.userData.baseEmissive = mesh.userData.baseEmissive ?? material.emissiveIntensity ?? 0;
        material.emissiveIntensity = (mesh.userData.baseEmissive ?? 0) + 0.25;
      }
      if (mesh.userData.glowEdge) {

        eastTerrainAnchor.add(eastTerrain);
        ensureAnchorMarker(eastTerrainAnchor);
        const eastBasePos = new THREE.Vector3().copy(eastIsland.position);
        const eastOffsets = {
          terrain: new THREE.Vector3(3, 0, 0.2),
          clouds: new THREE.Vector3(3, 1.7, 0.2),
          aim120: new THREE.Vector3(3, 0.42, -1.4),
          qf01: new THREE.Vector3(3, 1.2, 0)
        };
        eastIsland.setAnchorGlobalPosition('terrain', eastBasePos.clone().add(eastOffsets.terrain));

        const eastCloudAnchor = eastIsland.createAnchor('clouds', { position: [0, 0, 0] });
        const eastClouds = createVolumetricCloud({
          dimensions: [5.2, 2.4, 8.6],
          resolution: 96,
          threshold: 0.34,
          range: 0.1,
          opacity: 0.26,
          steps: 110,
          seed: 73,
          scrollSpeed: [0, 0, 0.2],
          activityKey: 'island:east'
        });
        eastClouds.position.set(0, 1.2, 0.4);
        eastCloudAnchor.add(eastClouds);
        ensureAnchorMarker(eastCloudAnchor);
        eastIsland.setAnchorGlobalPosition('clouds', eastBasePos.clone().add(eastOffsets.clouds));

        const aim120Anchor = eastIsland.createAnchor('aim120', { position: [0, 0, 0] });
        gltfLoader.load(
          '/models/Aim120.glb',
          gltf => {
            const aim120 = gltf.scene;
            aim120.traverse(node => {
              if (node.isMesh) {
                node.castShadow = true;
                node.receiveShadow = true;
              }
            });
            aim120.name = 'Aim120_Right';
            state.assetRefs.aim120Right = aim120;
            state.assetRefs.aim120 = aim120;

            const aim120Mirror = aim120.clone(true);
            aim120Mirror.name = 'Aim120_Left';
            aim120Mirror.traverse(node => {
              if (node.isMesh && node.material && node.material.clone) {
                node.material = node.material.clone();
                node.castShadow = true;
                node.receiveShadow = true;
              }
            });
            state.assetRefs.aim120Left = aim120Mirror;

            Aim120.prepareFragments(aim120);

              ensureAnchorMarker(aim120Anchor);
            eastIsland.setAnchorGlobalPosition('aim120', eastBasePos.clone().add(eastOffsets.aim120));

            Aim120.attachToJet();
          },
          undefined,
          error => console.error('Failed to load Aim120.glb', error)
        );

        const qf01Anchor = eastIsland.createAnchor('qf01', { position: [0, 0, 0] });
        gltfLoader.load(
          '/models/qf01full.glb',
          gltf => {
            const qf01 = gltf.scene;
            const { THREE } = state;
            qf01.traverse(node => {
              if (!node.isMesh) return;
              node.castShadow = true;
              node.receiveShadow = true;
            });

            qf01.scale.set(jetscale, jetscale, jetscale);
            qf01.rotation.set(0, THREE.MathUtils.degToRad(0), 0);
            qf01Anchor.add(qf01);
              ensureAnchorMarker(qf01Anchor);
            eastIsland.setAnchorGlobalPosition('qf01', eastBasePos.clone().add(eastOffsets.qf01));
            eastIsland.setAnchorGlobalPosition('aim120', eastBasePos.clone().add(eastOffsets.aim120));

            const qf01AnchorMarker = qf01Anchor.children.find(child => child.name && child.name.startsWith('AnchorMarker_'));
            if (qf01AnchorMarker) {
              qf01AnchorMarker.visible = false;
              state.assetRefs.qf01AnchorMarker = qf01AnchorMarker;
            }

            state.assetRefs.qf01 = qf01;

            const hoverBounds = new THREE.Box3().setFromObject(qf01);
            const hoverSize = hoverBounds.getSize(new THREE.Vector3());
            const hoverCenter = hoverBounds.getCenter(new THREE.Vector3());
            qf01.worldToLocal(hoverCenter);
            const hoverRadius = Math.max(Math.max(hoverSize.x, hoverSize.y, hoverSize.z) * 0.45, 1.2);
            const hoverTarget = new THREE.Mesh(
              new THREE.SphereGeometry(hoverRadius, 16, 16),
              new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0 })
            );
            hoverTarget.name = 'QF01HoverTarget';
            hoverTarget.renderOrder = -5;
            hoverTarget.position.copy(hoverCenter);
            hoverTarget.userData.baseEmissive = 0;
            hoverTarget.material.depthWrite = false;
            hoverTarget.material.depthTest = false;
            hoverTarget.material.colorWrite = false;
            qf01.add(hoverTarget);
            registerInteractive(hoverTarget, {
              baseEmissive: 0,
              hoverActivityKey: 'island:east'
            });
            state.assetRefs.qf01HoverTarget = hoverTarget;

            Aim120.attachToJet();

            const basePosition = qf01.position.clone();
            const baseRotation = qf01.rotation.clone();
            state.assetRefs.qf01BasePose = { position: basePosition, rotation: baseRotation };
            let pausedPose = null;
            let qf01LocalTime = 0;
            registerUpdater(({ delta = 0, elapsed = 0 }) => {
              if (!qf01.parent) return;
              const isActive = isIslandAnimationActive('island:east');
              if (!isActive) {
                if (!pausedPose) {
                  pausedPose = {
                    position: qf01.position.clone(),
                    quaternion: qf01.quaternion.clone()
                  };
                } else {
                  qf01.position.copy(pausedPose.position);
                  qf01.quaternion.copy(pausedPose.quaternion);
                  qf01.rotation.setFromQuaternion(pausedPose.quaternion);
                }
                return;
              } else {
                pausedPose = null;
              }
              qf01LocalTime += delta;
              const animTime = qf01LocalTime;
              const pending = state.qf01PitchPending;
              if (pending) {
                pending.timer += delta;
                if (pending.timer >= pending.delay) {
                  state.qf01PitchPending = null;
                  Jet.triggerPitch();
                }
              }
              const maneuver = state.qf01Maneuver;
              const resetAnim = state.qf01Reset;
              if (maneuver?.active) {
                maneuver.timer += delta;
                const duration = Math.max(maneuver.duration || QF01_MANEUVER_DURATION, 0.001);
                const t = Math.min(maneuver.timer / duration, 1);
                const eased = easeOutCubic(t);
                const pitch = THREE.MathUtils.lerp(0, maneuver.pitch, eased);
                const roll = THREE.MathUtils.lerp(0, maneuver.roll ?? 0, eased);
                const yaw = THREE.MathUtils.lerp(0, maneuver.yaw ?? 0, eased);
                const displacement = maneuver.distance * eased;
                const orientation = new THREE.Euler(
                  baseRotation.x + pitch,
                  baseRotation.y + yaw,
                  baseRotation.z + roll
                );
                const forward = new THREE.Vector3(0, 0, 1).applyEuler(orientation).normalize();
                const newPosition = basePosition.clone().add(forward.multiplyScalar(displacement));
                qf01.position.copy(newPosition);
                qf01.rotation.copy(orientation);
                if (t >= 1) {
                  maneuver.active = false;
                  maneuver.completed = true;
                  maneuver.finalPosition = newPosition.clone();
                  maneuver.finalRotation = orientation.clone();
                  const last = state.assetRefs.qf01LastManeuver || (state.assetRefs.qf01LastManeuver = {});
                  last.pitch = maneuver.pitch;
                  last.roll = maneuver.roll ?? 0;
                  last.yaw = maneuver.yaw ?? 0;
                  last.distance = maneuver.distance;
                  last.duration = maneuver.duration;
                  last.finalPosition = maneuver.finalPosition.clone();
                  last.finalRotation = maneuver.finalRotation.clone();
                }
              } else if (resetAnim?.active) {
                resetAnim.timer += delta;
                const duration = Math.max(resetAnim.duration || QF01_MANEUVER_DURATION, 0.001);
                const t = Math.min(resetAnim.timer / duration, 1);
                const eased = easeOutCubic(t);
                const remaining = Math.max(1 - eased, 0);
                const pitch = THREE.MathUtils.lerp(resetAnim.pitch, 0, eased);
                const roll = THREE.MathUtils.lerp(resetAnim.roll ?? 0, 0, eased);
                const yaw = THREE.MathUtils.lerp(resetAnim.yaw ?? 0, 0, eased);
                const displacement = resetAnim.distance * remaining;
                const orientation = new THREE.Euler(
                  resetAnim.baseRotation.x + pitch,
                  resetAnim.baseRotation.y + yaw,
                  resetAnim.baseRotation.z + roll
                );
                const forward = new THREE.Vector3(0, 0, 1).applyEuler(orientation).normalize();
                const newPosition = resetAnim.basePosition.clone().add(forward.multiplyScalar(displacement));
                qf01.position.copy(newPosition);
                qf01.rotation.copy(orientation);
                if (t >= 1) {
                  const settle = {
                    active: true,
                    timer: 0,
                    duration: 0.45,
                    startPosition: qf01.position.clone(),
                    startQuaternion: qf01.quaternion.clone(),
                    basePosition: resetAnim.basePosition.clone(),
                    baseRotation: resetAnim.baseRotation.clone()
                  };
                  state.assetRefs.qf01Settle = settle;
                  state.qf01Reset = null;
                  state.assetRefs.qf01LastManeuver = null;
                }
              } else if (state.assetRefs.qf01Settle?.active) {
                const settle = state.assetRefs.qf01Settle;
                settle.timer += delta;
                const duration = Math.max(settle.duration || 0.45, 0.001);
                const t = Math.min(settle.timer / duration, 1);
                const eased = easeOutCubic(t);
                const idleBob = Math.sin(animTime * 1.6) * 0.08;
                const idleRoll = Math.sin(animTime * 1.2) * THREE.MathUtils.degToRad(6);
                const idlePitch = Math.sin(animTime * 1.4) * THREE.MathUtils.degToRad(4);
                const targetPosition = settle.basePosition.clone();
                targetPosition.y += idleBob;
                const targetEuler = new THREE.Euler(
                  settle.baseRotation.x + idlePitch,
                  settle.baseRotation.y,
                  settle.baseRotation.z + idleRoll
                );
                const targetQuaternion = new THREE.Quaternion().setFromEuler(targetEuler);
                const blendedPosition = settle.startPosition.clone().lerp(targetPosition, eased);
                const blendedQuaternion = settle.startQuaternion.clone().slerp(targetQuaternion, eased);
                qf01.position.copy(blendedPosition);
                qf01.quaternion.copy(blendedQuaternion);
                qf01.rotation.setFromQuaternion(blendedQuaternion);
                if (t >= 1) {
                  state.assetRefs.qf01Settle = null;
                }
              } else if (maneuver?.completed) {
                if (maneuver.finalPosition) {
                  qf01.position.copy(maneuver.finalPosition);
                }
                if (maneuver.finalRotation) {
                  qf01.rotation.copy(maneuver.finalRotation);
                }
              } else {
                const bob = Math.sin(animTime * 1.6) * 0.08;
                const roll = Math.sin(animTime * 1.2) * THREE.MathUtils.degToRad(6);
                qf01.position.copy(basePosition);
                qf01.position.y += bob;
                qf01.rotation.set(
                  baseRotation.x + Math.sin(animTime * 1.4) * THREE.MathUtils.degToRad(4),
                  baseRotation.y,
                  baseRotation.z + roll
                );
              }

            });
          },
          undefined,
          error => console.error('Failed to load qf01full.glb', error)
        );

        const stars = createStarField();
        state.scene.add(stars);

        state.clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();
        const rayPointer = new THREE.Vector2();

        const updatePointer = event => {
          const rect = sceneWrap.getBoundingClientRect();
          state.pointerTarget.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          state.pointerTarget.y = ((event.clientY - rect.top) / rect.height) * 2 - 1;
          state.pointerActive = true;
        };

        sceneWrap.addEventListener('pointerenter', () => {
          state.pointerActive = true;
        });
        sceneWrap.addEventListener('pointermove', updatePointer);
        sceneWrap.addEventListener('pointerdown', updatePointer);
        sceneWrap.addEventListener('pointerleave', () => {
          state.pointerActive = false;
          state.pointerTarget.x = 0;
          state.pointerTarget.y = 0;
          setHoveredInteractive(null);
          state.assetRefs.lastPointerHit = null;
          syncIslandHoverStates([]);
        });

        sceneWrap.addEventListener('click', () => {
          if (state.hovered && state.hovered.userData?.onClick) {
            state.hovered.userData.onClick(state.assetRefs?.lastPointerHit || null);
          }
        });

        window.addEventListener('scroll', updateScroll, { passive: true });
        window.addEventListener('resize', resizeRenderer);

        function render() {
          const now = performance.now();
          tickFpsDiag(now);
          resizeRenderer();

          const delta = state.clock ? state.clock.getDelta() : 0;
          const elapsed = state.clock ? state.clock.elapsedTime : 0;

          if (state.updaters.length) {
            if (updaterProfiler.enabled) {
              state.updaters.forEach((update, index) => {
                const start = performance.now();
                update({ delta, elapsed });
                const duration = performance.now() - start;
                let entry = updaterProfiler.entries.get(update);
                if (!entry) {
                  const label = update.__tag || update.name || `updater_${index}`;
                  entry = { name: label, total: 0, max: 0, count: 0 };
                  updaterProfiler.entries.set(update, entry);
                }
                entry.total += duration;
                entry.count += 1;
                if (duration > entry.max) entry.max = duration;
              });
            } else {
              state.updaters.forEach(update => update({ delta, elapsed }));
            }
          }

          state.pointer.x += (state.pointerTarget.x - state.pointer.x) * 0.85;
          state.pointer.y += (state.pointerTarget.y - state.pointer.y) * 0.45;

          rayPointer.set(state.pointer.x, -state.pointer.y);
          raycaster.setFromCamera(rayPointer, state.camera);
          const intersections = raycaster.intersectObjects(state.interactives, false);
          syncIslandHoverStates(intersections);
          const hitEntry =
            intersections.find(intersection => !intersection.object.userData?.pointerPassthrough) ||
            intersections[0] ||
            null;
          state.assetRefs.lastPointerHit = hitEntry;
          setHoveredInteractive(hitEntry ? hitEntry.object : null, hitEntry);
          const hoverSet = state.assetRefs.hoveredActivityKeys;
          const pointerOverNorth = !!(state.pointerActive && hoverSet && hoverSet.has('island:north'));

          updateScroll();
          state.scroll.current += (state.scroll.target - state.scroll.current) * 0.08;
          const easedScroll = easeInOut(state.scroll.current);

          const targetY = -state.pointer.x * 0.2 * (1 - easedScroll);
          const targetX = THREE.MathUtils.clamp(state.pointer.y * 0.08, -0.18, 0.18) * (1 - easedScroll);
          state.stage.rotation.y += (targetY - state.stage.rotation.y) * 0.05;
          state.stage.rotation.x += (targetX - state.stage.rotation.x) * 0.05;

          updateSkyYawFromCamera();

          state.stage.position.y = 1.55 + easedScroll * 2.8;
          state.stage.position.z = -4.8 - easedScroll * 2.2;
          state.stage.scale.setScalar(1 - easedScroll * 0.16);

          const backdrop = state.stage.userData?.backdrop;
          stats.update();
          updatePerfOverlay();

          if (backdrop) {
            const targetQuat = state.stage.quaternion.clone().invert().multiply(state.camera.quaternion);
            backdrop.quaternion.copy(targetQuat);
          }

          if (bgTitleEl) {
            bgTitleEl.style.opacity = Math.max(0.25, 1 - easedScroll * 1.1).toFixed(3);
            bgTitleEl.style.transform = `translate3d(0, ${-easedScroll * 180}px, 0)`;
          }

          if (projectsSection) {
            const projectEase = THREE.MathUtils.clamp((state.scroll.current - 0.2) / 0.6, 0, 1);
            projectsSection.style.opacity = projectEase.toFixed(3);
            projectsSection.style.transform = `translateY(${36 * (1 - projectEase)}px)`;
          }

          if (!prefersReducedMotion.matches) {
            stars.rotation.y -= 0.0003;
          }

          updateProfilerOverlay(now);

          const nowTime = now;
          const pointerMotion = Math.abs(state.pointer.x - state.pointerTarget.x) > 0.0008 || Math.abs(state.pointer.y - state.pointerTarget.y) > 0.0008;
          const scrollMotion = Math.abs(state.scroll.target - state.scroll.current) > 0.0005;
          const shouldRenderActive = pointerOverNorth || state.pointerActive || pointerMotion || scrollMotion;
          if (shouldRenderActive) {
            state.renderHoldUntil = nowTime + 850;
          }
          const shouldRenderFrame = shouldRenderActive || (state.renderHoldUntil || 0) > nowTime;

          if (shouldRenderFrame) {
            state.renderer.render(state.scene, state.camera);
            state.lastIdleRender = nowTime;
          } else if (!state.lastIdleRender || nowTime - state.lastIdleRender > 1200) {
            state.renderer.render(state.scene, state.camera);
            state.lastIdleRender = nowTime;
          }
        }

        state.renderer.setAnimationLoop(render);
        resizeRenderer();
        updateScroll();
      } catch (error) {
        root.classList.remove('has-webgl');
        root.classList.add('no-webgl');
        console.error('Failed to start Three.js scene:', error);
      }
    }
  </script>
