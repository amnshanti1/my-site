    function buildSceneCompositionReport() {
      const scene = state.scene;
      const summary = {
        objects: 0,
        meshes: 0,
        points: 0,
        groups: 0,
        lights: 0,
        transparentMeshes: 0,
        shadowCasters: 0,
        shadowReceivers: 0,
        rawShaderMaterials: 0,
        shaderMaterials: 0,
        physicalMaterials: 0
      };
      if (!scene?.traverse) return summary;

      scene.traverse(object => {
        summary.objects += 1;
        if (object.isGroup) summary.groups += 1;
        if (object.isLight) summary.lights += 1;
        if (object.isPoints) summary.points += 1;
        if (!object.isMesh) return;

        summary.meshes += 1;
        if (object.castShadow) summary.shadowCasters += 1;
        if (object.receiveShadow) summary.shadowReceivers += 1;

        const materials = Array.isArray(object.material) ? object.material : [object.material];
        materials.forEach(material => {
          if (!material) return;
          if (material.transparent) summary.transparentMeshes += 1;
          if (material.type === 'RawShaderMaterial') summary.rawShaderMaterials += 1;
          if (material.type === 'ShaderMaterial') summary.shaderMaterials += 1;
          if (material.type === 'MeshPhysicalMaterial') summary.physicalMaterials += 1;
        });
      });

      return summary;
    }

    function buildPerformanceSuspectsReport(sampleLabel = '') {
      const suspects = {

        },

          dimensions: state.assetRefs.eastClouds?.userData?.performance?.dimensions ?? null
        },
        scene: {
          transparentMeshes: [],
          physicalMaterials: [],
          shadowCasters: [],
          shadowReceivers: []
        }
      };

      state.scene?.traverse?.(object => {
        if (!object?.isMesh) return;
        const name = object.name || object.parent?.name || object.type;
        const materials = Array.isArray(object.material) ? object.material : [object.material];

        if (object.castShadow && suspects.scene.shadowCasters.length < 25) {
          suspects.scene.shadowCasters.push(name);
        }
        if (object.receiveShadow && suspects.scene.shadowReceivers.length < 25) {
          suspects.scene.shadowReceivers.push(name);
        }

        materials.forEach(material => {
          if (!material) return;
          if (material.transparent && suspects.scene.transparentMeshes.length < 25) {
            suspects.scene.transparentMeshes.push({
              name,
              type: material.type,
              opacity: Number.isFinite(material.opacity) ? Number(material.opacity.toFixed(3)) : null
            });
          }
          if (material.type === 'MeshPhysicalMaterial' && suspects.scene.physicalMaterials.length < 25) {
            suspects.scene.physicalMaterials.push(name);
          }
        });
      });

      return suspects;
    }

    function getBatteryTier(charge = 0) {
      const palette = ensureBatteryPalette();
      if (!palette?.tiers) return null;
      const clamped = Math.min(Math.max(charge, 0), 1);
      const tier = palette.tiers.find(entry => clamped >= entry.min) || palette.tiers[palette.tiers.length - 1];
      return tier;
    }

    function getBatteryCellIndex(name) {
      if (!name) return 0;
      if (/^\d+$/.test(name)) return Number(name);
      const match = name.match(/Battery_Cell(\d+)/i);
      return match ? Number(match[1]) : 0;
    }

    function getActiveCountFromCharge(chargeValue, totalCells) {
      if (!totalCells) return 0;
      const clamped = Math.min(Math.max(chargeValue, 0), 1);
      if (clamped <= 0) return 0;
      return Math.min(totalCells, Math.floor(clamped * totalCells + 1e-6));
    }

    function easeInOutPow(t, power = 3) {
      const clamped = Math.min(Math.max(t, 0), 1);
      if (clamped === 0 || clamped === 1) return clamped;
      if (clamped < 0.5) {
        return 0.5 * Math.pow(clamped * 2, power);
      }
      return 1 - 0.5 * Math.pow((1 - clamped) * 2, power);
    }

    function applyBatteryState(activeCount, { edgeIndex = null, edgeFade = 0, direction = -1 } = {}) {
      const cells = state.assetRefs.batteryCells;
      if (!cells || !cells.length) return;
      const palette = ensureBatteryPalette();
      if (!palette) return;
      const totalCells = cells.length;
      const tier = getBatteryTier(activeCount / totalCells);
      const activeColor = tier?.color;
      const activeEmissive = tier?.emissive;
      const activeIntensity = tier?.intensity ?? 1.6;

      cells.forEach(cell => {
        const material = Array.isArray(cell.material) ? cell.material[0] : cell.material;
        if (!material) return;
        const index = getBatteryCellIndex(cell.name);
        if (!index) return;
        const isActive = index <= activeCount;
        const isEdge = edgeIndex && index === edgeIndex;

        if (isEdge) {
          const fade = Math.min(Math.max(edgeFade, 0), 1);
          const turningOff = direction < 0;
          if (material.color) {
            material.color.copy(turningOff ? activeColor ?? palette.inactiveColor : palette.inactiveColor);
            if (activeColor) {
              material.color.lerp(turningOff ? palette.inactiveColor : activeColor, fade);
            }
          }
          if (material.emissive) {
            material.emissive.copy(turningOff ? activeEmissive ?? palette.inactiveEmissive : palette.inactiveEmissive);
            if (activeEmissive) {
              material.emissive.lerp(turningOff ? palette.inactiveEmissive : activeEmissive, fade);
            }
            const fromIntensity = turningOff ? activeIntensity : 0.06;
            const toIntensity = turningOff ? 0.06 : activeIntensity;
            material.emissiveIntensity = state.THREE
              ? state.THREE.MathUtils.lerp(fromIntensity, toIntensity, fade)
              : (fromIntensity + (toIntensity - fromIntensity) * fade);
          }
          return;
        }

        if (material.color) {
          if (isActive && activeColor) {
            material.color.copy(activeColor);
          } else {
            material.color.copy(palette.inactiveColor);
          }
        }
        if (material.emissive) {
          if (isActive && activeEmissive) {
            material.emissive.copy(activeEmissive);
            material.emissiveIntensity = activeIntensity;
          } else {
            material.emissive.copy(palette.inactiveEmissive);
            material.emissiveIntensity = 0.06;
          }
        }
      });
    }

    function applyBatteryCharge(chargeValue = 0) {
      const { THREE } = state;
      if (!THREE) return;
      const cells = state.assetRefs.batteryCells;
      if (!cells || !cells.length) return;
      const clamped = THREE.MathUtils.clamp(chargeValue, 0, 1);
      const activeCount = getActiveCountFromCharge(clamped, cells.length);
      applyBatteryState(activeCount);
    }

    function ensureBatteryUpdater() {
      if (state.assetRefs.batteryUpdaterCleanup) return state.assetRefs.batteryUpdaterCleanup;
      const update = ({ delta = 0 }) => {
        const { THREE } = state;
        if (!THREE) return;
        const charge = ensureBatteryChargeState();
        const pendingDelta = state.assetRefs.batteryDelta || 0;
        if (pendingDelta) {
          const next = THREE.MathUtils.clamp(
            (Number.isFinite(charge.current) ? charge.current : charge.target) + pendingDelta,
            0,
            1
          );
          charge.current = next;
          charge.target = next;
          charge.transition = null;
          state.assetRefs.batteryDelta = 0;
          applyBatteryCharge(next);
        }
        if (!charge.transition) {
          return;
        }
        const transition = charge.transition;
        transition.elapsed += delta;
        const progress = Math.min(Math.max(transition.elapsed / transition.totalDuration, 0), 1);
        const easedProgress = easeInOutPow(progress, transition.power);
        const stepFloat = easedProgress * transition.totalSteps;
        const stepIndex = Math.min(transition.totalSteps, Math.floor(stepFloat));
        const stepT = Math.min(Math.max(stepFloat - stepIndex, 0), 1);
        const easedStep = easeInOutPow(stepT, transition.power);
        const currentCount = transition.startCount + transition.direction * stepIndex;
        const edgeIndex = transition.direction < 0
          ? currentCount
          : currentCount + 1;

        applyBatteryState(currentCount, {
          edgeIndex,
          edgeFade: easedStep,
          direction: transition.direction
        });

        charge.current = transition.totalCells ? currentCount / transition.totalCells : charge.current;

        if (progress >= 1) {
          charge.current = transition.targetCount / transition.totalCells;
          charge.transition = null;
          applyBatteryState(transition.targetCount);
        }
      };
      update.__tag = 'BatteryCharge';
      const cleanup = registerUpdater(update);
      state.assetRefs.batteryUpdaterCleanup = cleanup;
      return cleanup;
    }

    function setBatteryChargeTarget(value, { immediate = false } = {}) {
      const charge = ensureBatteryChargeState();
      const next = Math.min(Math.max(Number.isFinite(value) ? value : 0, 0), 1);
      charge.target = next;
      if (immediate) {
        charge.current = next;
        charge.transition = null;
        applyBatteryCharge(next);
      }
      if (!immediate) {
        const cellCount = state.assetRefs.batteryCells?.length || 0;
        if (!cellCount) {
          charge.current = next;
          applyBatteryCharge(next);
        } else {
          if (charge.transition) {
            const targetCount = getActiveCountFromCharge(next, cellCount);
            const transition = charge.transition;
            transition.targetCount = targetCount;
            transition.direction = Math.sign(targetCount - transition.startCount);
            transition.totalSteps = Math.abs(targetCount - transition.startCount);
            transition.totalDuration = Math.min(Math.max(0.6 + transition.totalSteps * 0.12, 0.6), 5.0);
            transition.elapsed = Math.min(transition.elapsed, transition.totalDuration);
            if (transition.totalSteps === 0) {
              charge.transition = null;
              applyBatteryCharge(next);
            }
            ensureBatteryUpdater();
            return next;
          }
          const startCount = charge.transition?.startCount ?? getActiveCountFromCharge(charge.current, cellCount);
          const targetCount = getActiveCountFromCharge(next, cellCount);
          if (startCount === targetCount) {
            charge.current = next;
            charge.transition = null;
            applyBatteryCharge(next);
          } else {
            const deltaCells = Math.abs(targetCount - startCount);
            const totalDuration = Math.min(Math.max(0.6 + deltaCells * 0.12, 0.6), 5.0);
            charge.transition = {
              startCount,
              targetCount,
              direction: Math.sign(targetCount - startCount),
              totalSteps: deltaCells,
              totalDuration,
              elapsed: 0,
              power: 2,
              totalCells: cellCount
            };
            requestRenderHold(totalDuration * 1000 + 100);
          }
        }
      }
      ensureBatteryUpdater();
      return next;
    }

        shape.lineTo(width / 2, -depth / 4);
        shape.quadraticCurveTo(width / 2, -depth / 2, 0, -depth / 2 - tip);
        shape.quadraticCurveTo(-width / 2, -depth / 2, -width / 2, -depth / 4);
        shape.lineTo(-width / 2, depth / 2 - waist);
        shape.quadraticCurveTo(-width / 2, depth / 2 - radius, 0, depth / 2);
        shape.closePath();
        return shape;
      },
      oval: ({ THREE, options }) => {
        const { width = 5.4, depth = 4.4, wobble = 0.18 } = options.dimensions || {};
        const shape = new THREE.Shape();
        const steps = 48;
        for (let i = 0; i <= steps; i += 1) {
          const theta = (i / steps) * Math.PI * 2;
          const wobbleFactor = 1 + Math.sin(theta * 2) * wobble;
          const x = (width / 2) * Math.cos(theta) * wobbleFactor;
          const y = (depth / 2) * Math.sin(theta);
          if (i === 0) {
            shape.moveTo(x, y);
          } else {
            shape.lineTo(x, y);
          }
        }
        shape.closePath();
        return shape;
      },
      roundedRect: ({ THREE, options }) => {
        const { width = 5.6, depth = 4.2, radius = 0.9 } = options.dimensions || {};
        const halfW = width / 2;
        const halfD = depth / 2;
        const r = Math.min(radius, halfW, halfD);
        const shape = new THREE.Shape();
        shape.moveTo(-halfW + r, -halfD);
        shape.lineTo(halfW - r, -halfD);
        shape.quadraticCurveTo(halfW, -halfD, halfW, -halfD + r);
        shape.lineTo(halfW, halfD - r);
        shape.quadraticCurveTo(halfW, halfD, halfW - r, halfD);
        shape.lineTo(-halfW + r, halfD);
        shape.quadraticCurveTo(-halfW, halfD, -halfW, halfD - r);
        shape.lineTo(-halfW, -halfD + r);
        shape.quadraticCurveTo(-halfW, -halfD, -halfW + r, -halfD);
        shape.closePath();
        return shape;
      },
      semiCircle: ({ THREE, options }) => {
        const {
          radius = 3.2,
          baseHeight = 2.2,
          corner = 0.6
        } = options.dimensions || {};

        const halfHeight = baseHeight / 2;
        const clampedCorner = Math.min(corner, halfHeight, radius * 0.85);
        const bottomY = -halfHeight;
        const shape = new THREE.Shape();

        const effectiveRadius = radius - clampedCorner;
        const theta = Math.acos(THREE.MathUtils.clamp(effectiveRadius / radius, 0, 1));
        const startX = radius * Math.cos(theta);
        const startY = bottomY + radius * Math.sin(theta);

        shape.moveTo(-startX, bottomY);
        shape.quadraticCurveTo(-radius, bottomY, -radius, bottomY + clampedCorner);
        shape.absarc(0, bottomY, radius, Math.PI - theta, theta, true);
        shape.quadraticCurveTo(radius, bottomY, startX, bottomY);
        shape.lineTo(-startX, bottomY);
        shape.closePath();
        return shape;
      },
      trapezoid: ({ THREE, options }) => {
        const { topWidth = 4.6, bottomWidth = 6.6, depth = 5.2, corner = 0.6 } = options.dimensions || {};
        const halfDepth = depth / 2;
        const topHalf = topWidth / 2;
        const bottomHalf = bottomWidth / 2;
        const r = Math.min(corner, halfDepth, topHalf, bottomHalf);
        const shape = new THREE.Shape();
        shape.moveTo(-bottomHalf + r, -halfDepth);
        shape.lineTo(bottomHalf - r, -halfDepth);
        shape.quadraticCurveTo(bottomHalf, -halfDepth, bottomHalf, -halfDepth + r);
        shape.lineTo(topHalf, halfDepth - r);
        shape.quadraticCurveTo(topHalf, halfDepth, topHalf - r, halfDepth);
        shape.lineTo(-topHalf + r, halfDepth);
        shape.quadraticCurveTo(-topHalf, halfDepth, -topHalf, halfDepth - r);
        shape.lineTo(-bottomHalf, -halfDepth + r);
        shape.quadraticCurveTo(-bottomHalf, -halfDepth, -bottomHalf + r, -halfDepth);
        shape.closePath();
        return shape;
      }
    };

    function hasWebGL() {
      try {
        const testCanvas = document.createElement('canvas');
        return !!window.WebGLRenderingContext && !!(testCanvas.getContext('webgl') || testCanvas.getContext('experimental-webgl'));
      } catch (err) {
        return false;
      }
    }

    function registerInteractive(mesh, meta = {}) {
      mesh.userData = { ...mesh.userData, ...meta };
      state.interactives.push(mesh);
      const raycast = state.raycast;
      if (raycast) {
        raycast.candidateSourceSignature = '';
        if (mesh.userData.pointerPassthrough && mesh.userData.hoverActivityKey) {
          raycast.broad.push(mesh);
        } else if (mesh.userData.hoverActivityKey) {
          const key = mesh.userData.hoverActivityKey;
          if (!raycast.byActivityKey[key]) raycast.byActivityKey[key] = [];
          raycast.byActivityKey[key].push(mesh);
        } else {
          raycast.globals.push(mesh);
        }
      }
      return mesh;
    }

    function getRaycastCandidateArray(activeKeys = null) {
      const raycast = state.raycast;
      if (!raycast) return state.interactives;
      const globals = raycast.globals || state.interactives;
      const activeKeyList = activeKeys?.size ? Array.from(activeKeys).sort() : [];
      const activityCounts = activeKeyList.map(key => `${key}:${raycast.byActivityKey?.[key]?.length || 0}`).join(',');
      const sourceSignature = `${globals.length}|${state.interactives.length}|${activityCounts}`;
      const keysSignature = activeKeyList.join('|');
      if (raycast.candidateSourceSignature === sourceSignature && raycast.candidateKeysSignature === keysSignature) {
        return raycast.candidates;
      }
      const candidates = raycast.candidates;
      candidates.length = 0;
      const seen = state.assetRefs.raycastSeen || (state.assetRefs.raycastSeen = new Set());
      seen.clear();
      globals.forEach(object => {
        if (!object || seen.has(object)) return;
        seen.add(object);
        candidates.push(object);
      });
      activeKeyList.forEach(key => {
        (raycast.byActivityKey?.[key] || []).forEach(object => {
          if (!object || seen.has(object)) return;
          seen.add(object);
          candidates.push(object);
        });
      });
      seen.clear();
      raycast.candidateSourceSignature = sourceSignature;
      raycast.candidateKeysSignature = keysSignature;
      return candidates;
    }

    function createDebugLabel(text, { color = '#c6daff' } = {}) {
      const paddingX = 64;
      const paddingY = 80;
      const maxWidth = 960;
      const minWidth = 280;
      const minHeight = 200;
      let fontSize = 138;
      const minFont = 96;

      const measureCanvas = document.createElement('canvas');
      const measureCtx = measureCanvas.getContext('2d');
      measureCtx.font = `600 ${fontSize}px "Inter", sans-serif`;
      let textWidth = measureCtx.measureText(text).width;
      while ((textWidth + paddingX * 2 > maxWidth) && fontSize > minFont) {
        fontSize -= 4;
        measureCtx.font = `600 ${fontSize}px "Inter", sans-serif`;
        textWidth = measureCtx.measureText(text).width;
      }

      const width = Math.max(minWidth, Math.ceil(textWidth + paddingX * 2));
      const height = Math.max(minHeight, Math.ceil(fontSize + paddingY * 2));

      const canvasEl = document.createElement('canvas');
      canvasEl.width = width;
      canvasEl.height = height;
      const ctx = canvasEl.getContext('2d');
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(12, 19, 38, 0.78)';
      const boxX = 36;
      const boxY = 48;
      const boxW = width - boxX * 2;
      const boxH = height - boxY * 2;
      const radius = Math.min(48, boxH / 2.1);
      ctx.beginPath();
      ctx.moveTo(boxX + radius, boxY);
      ctx.lineTo(boxX + boxW - radius, boxY);
      ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + radius);
      ctx.lineTo(boxX + boxW, boxY + boxH - radius);
      ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - radius, boxY + boxH);
      ctx.lineTo(boxX + radius, boxY + boxH);
      ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - radius);
      ctx.lineTo(boxX, boxY + radius);
      ctx.quadraticCurveTo(boxX, boxY, boxX + radius, boxY);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = color;
      ctx.font = `600 ${fontSize}px "Inter", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, width / 2, height / 2);

      const texture = new state.THREE.CanvasTexture(canvasEl);
      texture.anisotropy = 4;
      texture.needsUpdate = true;

      const material = new state.THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
      const sprite = new state.THREE.Sprite(material);
      const scaleFactor = 0.0019;
      sprite.scale.set(width * scaleFactor, height * scaleFactor, 1);
      return sprite;
    }

    function createAnchorMarker(label) {
      const { THREE } = state;
      const shared = state.sharedMaterials || (state.sharedMaterials = {});
      const wrapper = new THREE.Group();
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.045, 18, 18),
        new THREE.MeshBasicMaterial({ color: 0x66e0ff, transparent: true, opacity: 0.9, depthTest: false })
      );
      sphere.position.set(0, 0.06, 0);
      wrapper.add(sphere);

      const labelSprite = createDebugLabel(label.toUpperCase(), { color: '#8bd5ff' });
      labelSprite.scale.multiplyScalar(0.32);
      labelSprite.position.set(0, 0.28, 0);
      labelSprite.material.depthTest = false;
      wrapper.add(labelSprite);

      return wrapper;
    }

    function ensureAnchorMarker(anchorGroup) {
      if (!DEBUG_HELPERS_VISIBLE || !anchorGroup) return;
      const island = state.islands.find(entry => entry.anchors && Object.values(entry.anchors).includes(anchorGroup));
      if (!island) return;
      const matched = Object.entries(island.anchors).find(([, group]) => group === anchorGroup);
      if (!matched) return;
      const [key] = matched;
      if (!island.anchorMarkers[key]) {
        const marker = createAnchorMarker(key);
        marker.name = `AnchorMarker_${island.id}_${key}`;
        anchorGroup.add(marker);
        island.anchorMarkers[key] = marker;
      }
      const marker = island.anchorMarkers[key];
      if (island.debugScaleInverse) {
        marker.scale.set(
          island.debugScaleInverse.x,
          island.debugScaleInverse.y,
          island.debugScaleInverse.z
        );
      }
      marker.visible = true;
    }

    function translateShape2D(shape, dx, dy) {
      if (!shape || (!dx && !dy)) return shape;
      if (typeof shape.translate === 'function') {
        shape.translate(dx, dy);
        return shape;
      }

      const offsetVec2 = vec => {
        if (!vec || typeof vec.x !== 'number' || typeof vec.y !== 'number') return;
        vec.x += dx;
        vec.y += dy;
      };

      const offsetCurve = curve => {
        if (!curve) return;
        if (curve.isEllipseCurve) {
          curve.aX += dx;
          curve.aY += dy;
          return;
        }
        if (Array.isArray(curve.points)) {
          curve.points.forEach(offsetVec2);
        }
        offsetVec2(curve.v0);
        offsetVec2(curve.v1);
        offsetVec2(curve.v2);
        offsetVec2(curve.v3);
        offsetVec2(curve.center);
      };

      const applyToPath = path => {
        if (!path) return;
        if (Array.isArray(path.curves)) {
          path.curves.forEach(offsetCurve);
        }
        offsetVec2(path.currentPoint);
      };

      applyToPath(shape);
      if (Array.isArray(shape.holes)) {
        shape.holes.forEach(applyToPath);
      }
      return shape;
    }

    function buildIslandShape(footprint = {}) {
      const { THREE } = state;
      const options = typeof footprint === 'string' ? { variant: footprint } : footprint || {};
      const variant = options.variant || 'default';
      const builder = ISLAND_SHAPE_BUILDERS[variant] || ISLAND_SHAPE_BUILDERS.default;
      const shape = builder({ THREE, options });
      const points = shape.getPoints(72);
      if (points.length) {
        let minX = Infinity;
        let maxX = -Infinity;
        let minY = Infinity;
        let maxY = -Infinity;
        points.forEach(point => {
          if (point.x < minX) minX = point.x;
          if (point.x > maxX) maxX = point.x;
          if (point.y < minY) minY = point.y;
          if (point.y > maxY) maxY = point.y;
        });
        const centerX = (minX + maxX) * 0.5;
        const centerY = (minY + maxY) * 0.5;
        if (Number.isFinite(centerX) && Number.isFinite(centerY)) {
          translateShape2D(shape, -centerX, -centerY);
        }
      }
      return shape;
    }

    const noiseUtils = (() => {
      const fract = value => value - Math.floor(value);
      const fade = t => t * t * (3 - 2 * t);
      const lerp = (a, b, t) => a + (b - a) * t;
      const rand3 = (x, y, z) => fract(Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453);

      function valueNoise3(x, y, z) {
        const xi = Math.floor(x);
        const yi = Math.floor(y);
        const zi = Math.floor(z);
        const xf = x - xi;
        const yf = y - yi;
        const zf = z - zi;
        const u = fade(xf);
        const v = fade(yf);
        const w = fade(zf);

        const c000 = rand3(xi, yi, zi);
        const c100 = rand3(xi + 1, yi, zi);
        const c010 = rand3(xi, yi + 1, zi);
        const c110 = rand3(xi + 1, yi + 1, zi);
        const c001 = rand3(xi, yi, zi + 1);
        const c101 = rand3(xi + 1, yi, zi + 1);
        const c011 = rand3(xi, yi + 1, zi + 1);
        const c111 = rand3(xi + 1, yi + 1, zi + 1);

        const x00 = lerp(c000, c100, u);
        const x10 = lerp(c010, c110, u);
        const x01 = lerp(c001, c101, u);
        const x11 = lerp(c011, c111, u);
        const y0 = lerp(x00, x10, v);
        const y1 = lerp(x01, x11, v);
        return lerp(y0, y1, w);
      }

      function fbm3(x, y, z, octaves = 5, lacunarity = 2, gain = 0.5) {
        let sum = 0;
        let amp = 1;
        let freq = 1;
        let norm = 0;
        for (let i = 0; i < octaves; i += 1) {
          sum += valueNoise3(x * freq, y * freq, z * freq) * amp;
          norm += amp;
          freq *= lacunarity;
          amp *= gain;
        }
        return sum / norm;
      }

      function fbm2(x, z, octaves = 5, lacunarity = 2, gain = 0.5) {
        return fbm3(x, 0, z, octaves, lacunarity, gain);
      }

      return { fbm2, fbm3 };
    })();

    function createTerrainMesh({
      width = 4,
      depth = 4,
      segments = 24,
      amplitude = 0.6,
      blockHeight = 1.2,
      crestColor = 0x6fb4ff,
      troughColor = 0x0b1e36,
      sideColor = 0x050b14,
      highlightBias = 0.58,
      scrollSpeed = [0, 0],
      cornerRadius = 0.45,
      noiseOffset = [50, 90],
      noiseScale = 3.6,
      activityKey = null
    } = {}) {
      const { THREE } = state;
      const shared = state.sharedMaterials || (state.sharedMaterials = {});

      const geometry = new THREE.BoxGeometry(width, blockHeight, depth, segments, Math.max(1, Math.ceil(segments * 0.4)), segments);
      const positions = geometry.attributes.position;
      const vertexCount = positions.count;
      const baseCoordinates = new Float32Array(vertexCount * 2);
      const baseHeights = new Float32Array(vertexCount);
      const topMask = new Uint8Array(vertexCount);
      const halfHeight = blockHeight / 2;
      const epsilon = 1e-4;
      const radius = Math.max(0, Math.min(cornerRadius, Math.min(width, depth) * 0.5));
      const minX = -width / 2 + radius;
      const maxX = width / 2 - radius;
      const minZ = -depth / 2 + radius;
      const maxZ = depth / 2 - radius;

      for (let i = 0; i < vertexCount; i += 1) {
        const originalX = positions.getX(i);
        const originalY = positions.getY(i);
        const originalZ = positions.getZ(i);

        let adjustedX = originalX;
        let adjustedZ = originalZ;
        if (radius > 0) {
          const clampedX = THREE.MathUtils.clamp(originalX, minX, maxX);
          const clampedZ = THREE.MathUtils.clamp(originalZ, minZ, maxZ);
          const dx = originalX - clampedX;
          const dz = originalZ - clampedZ;
          const distance = Math.hypot(dx, dz);
          if (distance > 0) {
            const scale = Math.min(radius, distance);
            const directionX = dx / distance;
            const directionZ = dz / distance;
            adjustedX = clampedX + directionX * scale;
            adjustedZ = clampedZ + directionZ * scale;
          } else {
            adjustedX = clampedX;
            adjustedZ = clampedZ;
          }
        }

        positions.setX(i, adjustedX);
        positions.setZ(i, adjustedZ);

        baseCoordinates[i * 2] = adjustedX;
        baseCoordinates[i * 2 + 1] = adjustedZ;
        baseHeights[i] = originalY;
        if (originalY >= halfHeight - epsilon) {
          topMask[i] = 1;
        }
      }

      const sampleSpeed = Array.isArray(scrollSpeed)
        ? { x: scrollSpeed[0] || 0, z: scrollSpeed[1] || 0 }
        : { x: scrollSpeed.x || 0, z: scrollSpeed.z || 0 };

      const sampleOffset = Array.isArray(noiseOffset)
        ? { x: noiseOffset[0] || 0, z: noiseOffset[1] || 0 }
        : { x: noiseOffset.x || 0, z: noiseOffset.z || 0 };

      const colors = new Float32Array(vertexCount * 3);
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const colorAttribute = geometry.attributes.color;
      const crest = crestColor instanceof THREE.Color ? crestColor.clone() : new THREE.Color(crestColor);
      const trough = troughColor instanceof THREE.Color ? troughColor.clone() : new THREE.Color(troughColor);
      const sideColorValue = sideColor instanceof THREE.Color ? sideColor.clone() : new THREE.Color(sideColor);
      const scrollState = {
        target: new THREE.Vector2(0, 0),
        current: new THREE.Vector2(0, 0)
      };

      const applyHeightField = (offsetX = 0, offsetZ = 0) => {
        for (let i = 0; i < vertexCount; i += 1) {
          const baseY = baseHeights[i];
          if (topMask[i]) {
            const x = baseCoordinates[i * 2];
            const z = baseCoordinates[i * 2 + 1];
            const nx = (x / width) * noiseScale + sampleOffset.x + offsetX;
            const nz = (z / depth) * noiseScale + sampleOffset.z + offsetZ;
            const elevation = (noiseUtils.fbm3(nx, 0, nz, 4, 2, 0.48) - 0.5) * amplitude;
            positions.setY(i, baseY + elevation);
            const normalizedHeight = amplitude !== 0
              ? THREE.MathUtils.clamp(elevation / amplitude + 0.5, 0, 1)
              : 0.5;
            const foamWeight = Math.pow(THREE.MathUtils.clamp(normalizedHeight - highlightBias, 0, 1), 1.4);
            const r = trough.r + (crest.r - trough.r) * foamWeight;
            const g = trough.g + (crest.g - trough.g) * foamWeight;
            const b = trough.b + (crest.b - trough.b) * foamWeight;
            colorAttribute.setXYZ(i, r, g, b);
          } else {
            positions.setY(i, baseY);
            colorAttribute.setXYZ(i, sideColorValue.r, sideColorValue.g, sideColorValue.b);
          }
        }
        positions.needsUpdate = true;
        colorAttribute.needsUpdate = true;
      };

      applyHeightField();
      scrollState.target.set(0, 0);
      scrollState.current.set(0, 0);
      geometry.computeVertexNormals();
      if (geometry.attributes.normal) {
        geometry.attributes.normal.needsUpdate = true;
      }

      let material = shared.terrain;
      if (!material) {
        material = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          metalness: 0.65,
          roughness: 0.22,
          envMapIntensity: 1.1,
          vertexColors: true,
          flatShading: true
        });
        shared.terrain = material;
      }
      const terrain = new THREE.Mesh(geometry, material);
      terrain.castShadow = true;
      terrain.receiveShadow = true;
      terrain.position.y = -blockHeight / 2;
      terrain.frustumCulled = true;
      terrain.userData.scrollState = scrollState;

      if (Math.hypot(sampleSpeed.x, sampleSpeed.z) > 0) {
        let normalAccumulator = 0;
        let lastAppliedOffset = null;
        registerUpdater(({ delta = 0 }) => {
          if (!terrain.parent) return;
          if (activityKey && !isIslandAnimationActive(activityKey)) return;
          const { target, current } = scrollState;
          const motionFactor = getLaunchMotionFactor();
          if (motionFactor > 0) {
            target.x += sampleSpeed.x * delta * motionFactor;
            target.y += sampleSpeed.z * delta * motionFactor;
          }
          const lambda = 2.2;
          current.x = THREE.MathUtils.damp(current.x, target.x, lambda, delta);
          current.y = THREE.MathUtils.damp(current.y, target.y, lambda, delta);

          const changed = !lastAppliedOffset
            || Math.abs(current.x - lastAppliedOffset.x) > 1e-5
            || Math.abs(current.y - lastAppliedOffset.y) > 1e-5;

          if (changed) {
            applyHeightField(current.x, current.y);
            if (!lastAppliedOffset) {
              lastAppliedOffset = new THREE.Vector2();
            }
            lastAppliedOffset.set(current.x, current.y);
            normalAccumulator += delta;
            if (normalAccumulator >= 0.14) {
              geometry.computeVertexNormals();
              if (geometry.attributes.normal) {
                geometry.attributes.normal.needsUpdate = true;
              }
              normalAccumulator = 0;
            }
          }
        }, {
          tag: 'TerrainScroll',
          isActive: () => Boolean(terrain.parent && (!activityKey || isIslandAnimationActive(activityKey)))
        });
      }

      return terrain;
    }


function createCloudVolume({
  size = [4, 2, 3],
  spacing = 0.45,
  threshold = 0.72,
  radiusRange = [0.28, 0.62],
  seed = 42,
  color = 0xf2f6ff
} = {}) {
  const { THREE } = state;
  const shared = state.sharedMaterials || (state.sharedMaterials = {});

  if (!shared.cloudMaterials) {
    shared.cloudMaterials = {
      light: new THREE.MeshBasicMaterial({ color, toneMapped: false, side: THREE.DoubleSide, transparent: true, opacity: 0.95, depthWrite: false }),
      shadow: new THREE.MeshBasicMaterial({ color: 0x1a2133, toneMapped: false, side: THREE.DoubleSide, transparent: true, opacity: 0.78, depthWrite: false })
    };
  } else {
    shared.cloudMaterials.light.color.set(color);
  }

  const geometry = new THREE.SphereGeometry(0.5, 10, 8);
  const [width, height, depth] = size;
  const group = new THREE.Group();
  let puffCount = 0;
  const band = 0.1;
  const freq = 0.38;

  for (let x = -width / 2; x <= width / 2; x += spacing) {
    for (let y = 0; y <= height; y += spacing) {
      for (let z = -depth / 2; z <= depth / 2; z += spacing) {
        const sample = noiseUtils.fbm3(
          (x + seed * 1.7) * freq,
          (y + seed * 0.9) * freq,
          (z - seed * 1.3) * freq,
          5, 2.05, 0.52
        );

        if (sample > threshold) {
          const material = sample > threshold + band ? shared.cloudMaterials.light : shared.cloudMaterials.shadow;
          const puff = new THREE.Mesh(geometry, material);
          const scale = THREE.MathUtils.lerp(radiusRange[0], radiusRange[1], Math.random());
          puff.scale.set(scale, scale, scale);
          puff.position.set(
            x + (Math.random() - 0.5) * spacing * 0.35,
            y * 0.55 + Math.random() * 0.25,
            z + (Math.random() - 0.5) * spacing * 0.35
          );
          puff.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2);
          puff.castShadow = false;
          puff.receiveShadow = false;
          group.add(puff);
          puffCount += 1;
        }
      }
    }
  }

  if (puffCount === 0) {
    for (let i = 0; i < 24; i += 1) {
      const puff = new THREE.Mesh(geometry, shared.cloudMaterials.light);
      const scale = THREE.MathUtils.lerp(radiusRange[0], radiusRange[1], Math.random());
          puff.scale.set(scale, scale, scale);
      puff.position.set((Math.random() - 0.5) * width, Math.random() * height, (Math.random() - 0.5) * depth);
      puff.castShadow = false;
      puff.receiveShadow = false;
      group.add(puff);
    }
  }

  return group;
}

function createVolumetricCloud({
  dimensions = [4.6, 2.4, 3.4],
  resolution = 96,
  threshold = 0.25,
  range = 0.1,
  opacity = 0.25,
  steps = 80,
  seed = 42,
  scrollSpeed = [0.006, 0.002, 0.008],
  activityKey = null
} = {}) {
  const { THREE, ImprovedNoise } = state;
  const supportsWebGL2 = state.renderer?.capabilities?.isWebGL2;
  if (!THREE || !ImprovedNoise || !supportsWebGL2) {
    return createCloudVolume({ size: dimensions, spacing: 0.5, threshold: 0.45, radiusRange: [0.32, 0.58], seed });
  }

  const size = Math.max(32, Math.floor(resolution));
  const data = new Uint8Array(size * size * size);
  const perlin = new ImprovedNoise();
  const vector = new THREE.Vector3();
  const scale = 0.05;
  let i = 0;

  for (let z = 0; z < size; z += 1) {
    for (let y = 0; y < size; y += 1) {
      for (let x = 0; x < size; x += 1) {
        const d = 1.0 - vector.set(x, y, z).subScalar(size / 2).divideScalar(size).length();
        data[i] = (128 + 128 * perlin.noise(x * scale / 1.5, y * scale, z * scale / 1.5)) * d * d;
        i += 1;
      }
    }
  }

  const texture = new THREE.Data3DTexture(data, size, size, size);
  texture.format = THREE.RedFormat;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.unpackAlignment = 1;
  texture.needsUpdate = true;

  const vertexShader = /* glsl */`
    in vec3 position;

    uniform mat4 modelMatrix;
    uniform mat4 modelViewMatrix;
    uniform mat4 projectionMatrix;
    uniform vec3 cameraPos;

    out vec3 vOrigin;
    out vec3 vDirection;

    void main() {
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      vOrigin = vec3(inverse(modelMatrix) * vec4(cameraPos, 1.0));
      vDirection = position - vOrigin;
      gl_Position = projectionMatrix * mvPosition;
    }
  `;

  const fragmentShader = /* glsl */`
    precision highp float;
    precision highp sampler3D;

    in vec3 vOrigin;
    in vec3 vDirection;

    out vec4 color;

    uniform vec3 base;
    uniform sampler3D map;
    uniform float threshold;
    uniform float range;
    uniform float opacity;
    uniform float steps;
    uniform float frame;
    uniform vec3 scroll;

    uint wang_hash(uint seed) {
      seed = (seed ^ 61u) ^ (seed >> 16u);
      seed *= 9u;
      seed = seed ^ (seed >> 4u);
      seed *= 0x27d4eb2du;
      seed = seed ^ (seed >> 15u);
      return seed;
    }

    float randomFloat(inout uint seed) {
      return float(wang_hash(seed)) / 4294967296.0;
    }

    vec2 hitBox(vec3 orig, vec3 dir) {
      const vec3 box_min = vec3(-0.5);
      const vec3 box_max = vec3(0.5);
      vec3 inv_dir = 1.0 / dir;
      vec3 tmin_tmp = (box_min - orig) * inv_dir;
      vec3 tmax_tmp = (box_max - orig) * inv_dir;
      vec3 tmin = min(tmin_tmp, tmax_tmp);
      vec3 tmax = max(tmin_tmp, tmax_tmp);
      float t0 = max(tmin.x, max(tmin.y, tmin.z));
      float t1 = min(tmax.x, min(tmax.y, tmax.z));
      return vec2(t0, t1);
    }

    float sample1(vec3 p) { return texture(map, p).r; }

    float shading(vec3 coord) {
      float step = 0.01;
      return sample1(coord + vec3(-step)) - sample1(coord + vec3(step));
    }

    vec4 linearToSRGB(vec4 value) {
      return vec4(
        mix(
          pow(value.rgb, vec3(0.41666)) * 1.055 - vec3(0.055),
          value.rgb * 12.92,
          vec3(lessThanEqual(value.rgb, vec3(0.0031308)))
        ),
        value.a
      );
    }

    void main(){
      vec3 rayDir = normalize(vDirection);
      vec2 bounds = hitBox(vOrigin, rayDir);
      if (bounds.x > bounds.y) discard;
      bounds.x = max(bounds.x, 0.0);

      vec3 p = vOrigin + bounds.x * rayDir;
      vec3 inc = 1.0 / abs(rayDir);
      float delta = min(inc.x, min(inc.y, inc.z));
      delta /= steps;

      uint seed = uint(gl_FragCoord.x) * uint(1973) + uint(gl_FragCoord.y) * uint(9277) + uint(frame) * uint(26699);
      vec3 size = vec3(textureSize(map, 0));
      float randNum = randomFloat(seed) * 2.0 - 1.0;
      p += rayDir * randNum * (1.0 / size);

      vec4 acc = vec4(base, 0.0);

      for (float t = bounds.x; t < bounds.y; t += delta) {
        vec3 samplePoint = fract(p + scroll + 0.5);
        float d = sample1(samplePoint);
        d = smoothstep(threshold - range, threshold + range, d) * opacity;

        float col = shading(samplePoint) * 3.0 + ((samplePoint.x + samplePoint.y) * 0.25) + 0.2;

        acc.rgb += (1.0 - acc.a) * d * col;
        acc.a += (1.0 - acc.a) * d;

        if (acc.a >= 0.95) break;

        p += rayDir * delta;
      }

      float finalAlpha = clamp(acc.a * 1.6, 0.0, 1.0);
      color = linearToSRGB(vec4(acc.rgb, finalAlpha));
      if (finalAlpha <= 0.001) discard;
    }
  `;

  const sharedUniforms = {
    base: { value: new THREE.Color(0x798aa0) },
    map: { value: texture },
    cameraPos: { value: new THREE.Vector3() },
    threshold: { value: threshold },
    opacity: { value: opacity },
    range: { value: range },
    steps: { value: steps },
    frame: { value: 0 },
    scroll: { value: new THREE.Vector3() }
  };

	  const material = new THREE.RawShaderMaterial({
	    glslVersion: THREE.GLSL3,
	    uniforms: sharedUniforms,
	    vertexShader,
    fragmentShader,
    side: THREE.BackSide,
    transparent: true,
    depthWrite: true,
    depthTest: true,
    blending: THREE.NormalBlending
  });

	  const geometry = new THREE.BoxGeometry(1, 1, 1);
	  geometry.computeBoundingBox();
	  const mesh = new THREE.Mesh(geometry, material);
	  const cloudRoot = new THREE.Group();
	  const [scaleX, scaleY, scaleZ] = dimensions;
	  cloudRoot.scale.set(scaleX, scaleY, scaleZ);
      cloudRoot.userData.performance = {
        resolution: size,
        steps,
        dimensions: [...dimensions]
      };
	  mesh.renderOrder = 12;
	  cloudRoot.add(mesh);
	  mesh.castShadow = false;
	  mesh.receiveShadow = false;
	  mesh.frustumCulled = false;

  const scrollVector = new THREE.Vector3(...scrollSpeed);
  const accumulatedScroll = new THREE.Vector3();
  const wrapScalar = value => {
    const mod = value % 1;
    return mod < 0 ? mod + 1 : mod;
  };

  registerUpdater(({ delta = 0 }) => {
    if (!cloudRoot.parent) return;
    const isActive = !activityKey || isIslandAnimationActive(activityKey);
    if (cloudRoot.visible !== isActive) {
      cloudRoot.visible = isActive;
    }
    if (!isActive) return;
    sharedUniforms.cameraPos.value.copy(state.camera.position);
    const motionFactor = getLaunchMotionFactor();
    sharedUniforms.frame.value += motionFactor;
    if (motionFactor > 0) {
      accumulatedScroll.addScaledVector(scrollVector, delta * motionFactor);
    }
    const scroll = sharedUniforms.scroll.value;
    scroll.set(
      wrapScalar(accumulatedScroll.x),
      wrapScalar(accumulatedScroll.y),
      wrapScalar(accumulatedScroll.z)
    );
  }, {
    tag: 'VolumetricCloud',
    isActive: () => Boolean(cloudRoot.parent && (!activityKey || isIslandAnimationActive(activityKey)))
  });

  return cloudRoot;
}


    function applyLineOpacity(material, opacity) {
      const materials = Array.isArray(material) ? material : [material];
      materials.forEach(mat => {
        mat.opacity = opacity;
        mat.transparent = true;
        mat.depthWrite = false;
      });
    }

    function createStage() {
      const { THREE } = state;
      const stage = new THREE.Group();
      stage.position.set(-0.6, 1.55, -4.8);

      const islandsGroup = new THREE.Group();
      islandsGroup.name = 'Islands';
      stage.add(islandsGroup);
      stage.userData.islandsGroup = islandsGroup;

      if (DEBUG_HELPERS_VISIBLE) {
        const grid = new THREE.GridHelper(40, 40, 0x6ec5ff, 0x3e7dff);
        grid.position.y = 0;
        grid.renderOrder = -1;
        applyLineOpacity(grid.material, 0.55);
        const gridMaterials = Array.isArray(grid.material) ? grid.material : [grid.material];
        gridMaterials.forEach((mat, index) => {
          mat.color.setHex(index === 0 ? 0xa3d9ff : 0x4c9dff);
        });
        stage.add(grid);

        const axes = new THREE.AxesHelper(3.6);
        axes.material.depthTest = false;
        axes.material.transparent = true;
        axes.material.opacity = 0.6;
        axes.renderOrder = 1;
        stage.add(axes);

        const axisLabels = {
          x: createDebugLabel('X', { color: '#ff8e76' }),
          y: createDebugLabel('Y', { color: '#9bff86' }),
          z: createDebugLabel('Z', { color: '#76b6ff' })
        };
        axisLabels.x.scale.multiplyScalar(0.6);
        axisLabels.y.scale.multiplyScalar(0.6);
        axisLabels.z.scale.multiplyScalar(0.6);
        axisLabels.x.position.set(3.9, 0.1, 0);
        axisLabels.y.position.set(0, 3.9, 0);
        axisLabels.z.position.set(0, 0.1, 3.9);
        Object.values(axisLabels).forEach(label => {
          label.material.depthTest = false;
          stage.add(label);
        });

        const originMarker = new THREE.Mesh(
          new THREE.SphereGeometry(0.12, 22, 22),
          new THREE.MeshBasicMaterial({ color: 0xff86bd })
        );
        originMarker.position.set(0, 0.06, 0);
        stage.add(originMarker);

        const originRing = new THREE.Mesh(
          new THREE.RingGeometry(0.48, 0.52, 48),
          new THREE.MeshBasicMaterial({ color: 0xff86bd, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
        );
        originRing.rotation.x = -Math.PI / 2;
        stage.add(originRing);

        const labels = [];
        const labelExtent = 5;
        const labelStep = 1;
        for (let x = -labelExtent; x <= labelExtent; x += labelStep) {
          if (x === 0) continue;
          const xLabel = createDebugLabel(`${x}`);
          xLabel.position.set(x, 0.04, 0);
          stage.add(xLabel);
          labels.push(xLabel);
        }
        for (let z = -labelExtent; z <= labelExtent; z += labelStep) {
          if (z === 0) continue;
          const zLabel = createDebugLabel(`${z}`);
          zLabel.position.set(0, 0.04, z);
          stage.add(zLabel);
          labels.push(zLabel);
        }

        stage.userData.debugHelpers = { grid, axes, originMarker, originRing, labels, axisLabels };
      }

      return stage;
    }

    function createOceanPlane() {
      const { THREE } = state;
      const slabHeight = 0.12;
      const geometry = new THREE.BoxGeometry(280, slabHeight, 150, 1, 1, 1);
      const material = new THREE.MeshStandardMaterial({
        color: new THREE.Color('#9fdcff'),
        transparent: true,
        opacity: 0.26,
        roughness: 0.3,
        metalness: 0.04,
        emissive: new THREE.Color('#173a73'),
        emissiveIntensity: 0.08,

        depthTest: true,

        toneMapped: false
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = 'OceanPlane';
      mesh.position.set(0, -slabHeight * 0.5, 0);
      mesh.renderOrder = 0;
      mesh.frustumCulled = false;
      mesh.receiveShadow = false;
      mesh.userData.slabHeight = slabHeight;
      return mesh;
    }

    function createIsland({
      id,
      position = [0, 0, 0],
      rotation = [0, 0, 0],
      scale = 1,
      footprint = {},
      anchors: anchorOverrides = {}
    }) {
      const { THREE } = state;
      const islandRoot = new THREE.Group();
      islandRoot.name = `Island_${id}`;

      const rawScale = Array.isArray(scale) ? scale : [scale, scale, scale];
      const mirrorVector = rawScale.map(value => (value < 0 ? -1 : 1));
      const magnitudeVector = rawScale.map(value => Math.abs(value));

      const platform = new THREE.Group();
      platform.name = 'IslandPlatform';
      islandRoot.add(platform);

      const islandShape = buildIslandShape(footprint);
      const extrudeSettings = { depth: 0.42, bevelEnabled: false, curveSegments: 48, steps: 1 };
      const baseGeometry = new THREE.ExtrudeGeometry(islandShape, extrudeSettings);
      baseGeometry.scale(mirrorVector[0], mirrorVector[1], mirrorVector[2]);
      baseGeometry.computeVertexNormals();

      const base = new THREE.Mesh(
        baseGeometry,
        new THREE.MeshStandardMaterial({ color: 0x1d2f53, metalness: 0.3, roughness: 0.64, side: THREE.DoubleSide })
      );
      base.rotation.x = -Math.PI / 2;
      base.receiveShadow = false;
      platform.add(base);

      const anchors = {
        deckTop: new THREE.Group(),
        frontWall: new THREE.Group()
      };

      anchors.deckTop.position.set(0, 0, 0);
      const mirroredFrontWallPosition = [1.4, 0, -1.2].map((value, index) => value * mirrorVector[index]);
      anchors.frontWall.position.set(...mirroredFrontWallPosition);
      anchors.frontWall.rotation.set(0, 0, 0);

      const anchorGlobalPositionOverrides = {};
      if (anchorOverrides.deckTop?.position) {
        const [gx, gy, gz] = anchorOverrides.deckTop.position;
        anchorGlobalPositionOverrides.deckTop = new THREE.Vector3(gx, gy, gz);
      }
      if (anchorOverrides.deckTop?.rotation) {
        anchors.deckTop.rotation.set(...anchorOverrides.deckTop.rotation);
      }
      if (anchorOverrides.frontWall?.position) {
        const [gx, gy, gz] = anchorOverrides.frontWall.position;
        anchorGlobalPositionOverrides.frontWall = new THREE.Vector3(gx, gy, gz);
      }
      if (anchorOverrides.frontWall?.rotation) {
        anchors.frontWall.rotation.set(...anchorOverrides.frontWall.rotation);
      }

      islandRoot.add(anchors.deckTop);
      islandRoot.add(anchors.frontWall);

      let debugMarker = null;
      const anchorMarkers = {};
      if (DEBUG_HELPERS_VISIBLE) {
        const debugGroup = new THREE.Group();
        debugGroup.name = `IslandCenter_${id}`;

        const orb = new THREE.Mesh(
          new THREE.SphereGeometry(0.08, 26, 26),
          new THREE.MeshBasicMaterial({ color: 0xfff1c7, transparent: true, opacity: 0.92, depthTest: false, depthWrite: false })
        );
        orb.position.set(0, 0, 0);
        debugGroup.add(orb);

        const idLabel = createDebugLabel(id.toUpperCase(), { color: '#ffe59a' });
        idLabel.position.set(0, 0.42, 0);
        debugGroup.add(idLabel);

        islandRoot.add(debugGroup);
        islandRoot.userData.debugCenter = debugGroup;
        debugMarker = debugGroup;

        Object.keys(anchors).forEach(key => {
          anchorMarkers[key] = null;
        });
      }

      islandRoot.updateMatrixWorld(true);
      const baseBox = new THREE.Box3().setFromObject(base);
      const baseTop = baseBox.max.y;
      const baseCenter = baseBox.getCenter(new THREE.Vector3());
      platform.position.x -= baseCenter.x;
      platform.position.y -= baseTop;
      platform.position.z -= baseCenter.z;

      if (debugMarker) {
        const size = baseBox.getSize(new THREE.Vector3());
        debugMarker.position.set(0, 0, 0);
        const labelSprite = debugMarker.children.find(child => child.isSprite);
        if (labelSprite) {
          labelSprite.position.set(0, size.y + 0.35, 0);
        }
      }
      islandRoot.updateMatrixWorld(true);

      islandRoot.position.set(...position);
      islandRoot.rotation.set(...rotation);
      islandRoot.scale.set(...magnitudeVector);

      const debugScaleInverse = {
        x: magnitudeVector[0] !== 0 ? 1 / magnitudeVector[0] : 1,
        y: magnitudeVector[1] !== 0 ? 1 / magnitudeVector[1] : 1,
        z: magnitudeVector[2] !== 0 ? 1 / magnitudeVector[2] : 1
      };

      if (debugMarker) {
        debugMarker.scale.set(debugScaleInverse.x, debugScaleInverse.y, debugScaleInverse.z);
      }

      if (Object.keys(anchorGlobalPositionOverrides).length > 0) {
        islandRoot.updateMatrixWorld(true);
        Object.entries(anchorGlobalPositionOverrides).forEach(([key, globalVec]) => {
          const local = globalVec.clone();
          islandRoot.worldToLocal(local);
          anchors[key]?.position.copy(local);
        });
      }

      const islandsGroup = state.stage?.userData?.islandsGroup || state.stage;
      islandsGroup.add(islandRoot);

      const islandData = {
        id,
        group: islandRoot,
        platform,
        baseMesh: base,
        anchors,
        marker: debugMarker,
        anchorMarkers,
        footprint,
        position: islandRoot.position,
        rotation: islandRoot.rotation,
        scale: islandRoot.scale,
        debugScaleInverse,
        createAnchor(name, { position: localPos = [0, 0, 0], rotation: localRot = [0, 0, 0], globalPosition = null } = {}) {
          if (!name) return null;
          let anchorGroup = anchors[name];
          if (!anchorGroup) {
            anchorGroup = new state.THREE.Group();
            anchorGroup.name = `Anchor_${id}_${name}`;
            anchors[name] = anchorGroup;
            islandRoot.add(anchorGroup);
            if (anchorMarkers[name] === undefined) {
              anchorMarkers[name] = null;
            }
          }

          if (globalPosition) {
            const vec = Array.isArray(globalPosition)
              ? new state.THREE.Vector3(globalPosition[0], globalPosition[1], globalPosition[2])
              : globalPosition.clone();
            islandRoot.updateMatrixWorld(true);
            const local = vec.clone();
            islandRoot.worldToLocal(local);
            anchorGroup.position.copy(local);
          } else if (localPos) {
            anchorGroup.position.set(localPos[0], localPos[1], localPos[2]);
          }

          if (localRot) {
            anchorGroup.rotation.set(localRot[0], localRot[1], localRot[2]);
          }

          if (DEBUG_HELPERS_VISIBLE && anchorMarkers[name]) {
            anchorMarkers[name].scale.set(debugScaleInverse.x, debugScaleInverse.y, debugScaleInverse.z);
          }

          return anchorGroup;
        },
        getAnchor(name) {
          return anchors[name] || null;
        },
        setAnchorGlobalPosition(name, target) {
          if (!name || !target) return;
          let anchorGroup = anchors[name];
          if (!anchorGroup) {
            anchorGroup = this.createAnchor(name);
          }
          if (!anchorGroup) return;
          const vec = Array.isArray(target)
            ? new state.THREE.Vector3(target[0], target[1], target[2])
            : target.clone();
          if (state.stage) {
            islandRoot.updateMatrixWorld(true);
            const stageWorld = state.stage.localToWorld(new state.THREE.Vector3(0, 0, 0));
            vec.add(stageWorld);
          }
          islandRoot.updateMatrixWorld(true);
          const local = vec.clone();
          islandRoot.worldToLocal(local);
          anchorGroup.position.copy(local);
          ensureAnchorMarker(anchorGroup);
        },
        getAnchorGlobalPosition(name) {
          if (!name) return null;
          let anchorGroup = anchors[name];
          if (!anchorGroup) {
            anchorGroup = this.createAnchor(name);
          }
          if (!anchorGroup) return null;
          const world = new state.THREE.Vector3();
          anchorGroup.getWorldPosition(world);
          return world;
        }
      };
      state.islands.push(islandData);
      return islandData;
    }

    function createLabelTexture(text) {
      if (labelCache.has(text)) return labelCache.get(text);
      const canvasEl = document.createElement('canvas');
      canvasEl.width = 512;
      canvasEl.height = 256;
      const ctx = canvasEl.getContext('2d');
      ctx.fillStyle = 'rgba(255, 255, 255, 0)';
      ctx.fillRect(0, 0, canvasEl.width, canvasEl.height);
      ctx.fillStyle = '#0b1326';
      ctx.font = 'bold 120px "Inter", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvasEl.width / 2, canvasEl.height / 2);
      const texture = new state.THREE.CanvasTexture(canvasEl);
      texture.anisotropy = 8;
      labelCache.set(text, texture);
      return texture;
    }

    function createBlankWall(anchor) {
      const { THREE } = state;
      const wallGroup = new THREE.Group();
      anchor.add(wallGroup);
      ensureAnchorMarker(anchor);

      const holeRadius = 0.62;
      const width = 3.1;
      const height = 2.1;
      const halfW = width / 2;
      const halfH = height / 2;

      const doorHole = new THREE.Path();
      const doorBottom = -halfH + 0.02;
      doorHole.moveTo(-holeRadius, doorBottom);
      doorHole.lineTo(-holeRadius, 0);
      doorHole.absarc(0, 0, holeRadius, Math.PI, 0, true);
      doorHole.lineTo(holeRadius, doorBottom);
      doorHole.lineTo(-holeRadius, doorBottom);
      doorHole.closePath();

      const panelShape = new THREE.Shape();
      panelShape.moveTo(-halfW, -halfH);
      panelShape.lineTo(halfW, -halfH);
      panelShape.lineTo(halfW, halfH);
      panelShape.lineTo(-halfW, halfH);
      panelShape.lineTo(-halfW, -halfH);
      panelShape.holes.push(doorHole);

      const panelGeometry = new THREE.ExtrudeGeometry(panelShape, {
        depth: 0.12,
        bevelEnabled: false,
        curveSegments: 32,
        steps: 1
      });
      panelGeometry.translate(0, 0, -0.06);
      const panelMaterial = new THREE.MeshStandardMaterial({
        color: 0xfafcff,
        metalness: 0.08,
        roughness: 0.62
      });
      const panel = new THREE.Mesh(panelGeometry, panelMaterial);
      panel.castShadow = true;
      panel.receiveShadow = true;
      panel.rotation.y = Math.PI / 2;
      panel.position.set(0, halfH, 0);
      wallGroup.add(panel);

      return wallGroup;
    }

    function createResumeWall(anchor) {
      const { THREE } = state;
      const wallGroup = new THREE.Group();
      anchor.add(wallGroup);
      ensureAnchorMarker(anchor);

    function createBillboardTexture({ heading, subheading }) {
      const canvasEl = document.createElement('canvas');
      canvasEl.width = 4000;
      canvasEl.height = 1920;
      const ctx = canvasEl.getContext('2d');

      const texture = new state.THREE.CanvasTexture(canvasEl);
      texture.anisotropy = 8;
      texture.needsUpdate = true;

      const redrawBillboardTexture = () => {
        ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';

        const paddingX = canvasEl.width * 0.05;
        const headingY = canvasEl.height * 0.1;
        const subheadingY = canvasEl.height * 0.25;
        const maxLineWidth = canvasEl.width - paddingX * 2;

        const drawFittedText = ({ text, weight, initialSize, maxWidth, y, color, gradientStops }) => {
          let fontSize = initialSize;
          let width = Infinity;
          while (fontSize > 20 && width > maxWidth) {
            ctx.font = `${weight} ${fontSize}px "Futura", "Inter", sans-serif`;
            width = ctx.measureText(text).width;
            if (width > maxWidth) fontSize -= 6;
          }
          ctx.font = `${weight} ${fontSize}px "Futura", "Inter", sans-serif`;
          const metrics = ctx.measureText(text);
          if (gradientStops && Array.isArray(gradientStops)) {
            const ascent = metrics.actualBoundingBoxAscent || fontSize * 0.78;
            const descent = metrics.actualBoundingBoxDescent || fontSize * 0.22;
            const textTop = y - ascent;
            const textBottom = y + descent;
            const gradient = ctx.createLinearGradient(paddingX, textTop, paddingX, textBottom + descent * 0.4);
            gradientStops.forEach(([stop, stopColor]) => gradient.addColorStop(stop, stopColor));
            ctx.fillStyle = gradient;
          } else {
            ctx.fillStyle = color;
          }
          ctx.fillText(text, paddingX, y);
          return { fontSize, width, metrics };
        };

        drawFittedText({
          text: heading.toUpperCase(),
          weight: '600',
          initialSize: canvasEl.height * 0.12,
          maxWidth: maxLineWidth * 0.45,
          y: headingY,
          color: '#3c4253'
        });

        drawFittedText({
          text: subheading.toUpperCase(),
          weight: '800',
          initialSize: canvasEl.height * 0.95,
          maxWidth: maxLineWidth,
          y: subheadingY,
          color: 'rgba(220, 235, 255, 1)',
          gradientStops: [
            [0, 'rgba(220, 235, 255, 1)'],
            [0.55, 'rgba(185, 210, 255, 0.55)'],
            [0.75, 'rgba(160, 190, 255, 0.25)'],
            [0.92, 'rgba(145, 185, 255, 0.08)'],
            [1, 'rgba(134, 187, 255, 0)']
          ]
        });

        texture.needsUpdate = true;
        requestRenderHold();
      };

      redrawBillboardTexture();

      return texture;
    }
